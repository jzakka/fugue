        - "apps/web/src/app/mypage/page.tsx:39"
        - "apps/web/src/app/boards/[id]/page.tsx:51"
        - "apps/web/src/app/creators/[id]/page.tsx:73"
        - "apps/web/src/app/login/page.tsx:35"
      cite: "WCAG 2.1 SC 2.4.1 Bypass Blocks (Level A) — 'A mechanism is available to bypass blocks of content that are repeated on multiple Web pages.' Fugue 의 / · /search · /mypage · /pins/[id] · /pin/new · /boards/[id] · /creators/[id] 페이지가 모두 NavBar 로 시작하고 NavBar 는 SearchBar input + 검색 결과 dropdown row 들(검색 결과 N개) + ThemeToggle button + (인증 상태에 따라) LoginButton 또는 LogoutButton 다중 컨트롤 보유. `grep -rn 'sr-only\\|skip\\|건너뛰기' src` 매칭 0건(L87 sr-only h1 1건은 작품 피드 헤딩이지 skip link 아님). `grep -rn 'id=\"main' src` 매칭 0건. 키보드 사용자가 매 페이지 진입 시 NavBar 모든 컨트롤(검색어 입력 시 dropdown row 가산) 을 Tab 으로 통과해야 main content 첫 article 에 도달. 안티패턴 L15-L21 무매치 — 토큰/공개 컴포넌트 API 비변경, 시각 변경은 sr-only/focus:not-sr-only 표준 패턴(평소 visually hidden, 키보드 첫 Tab 포커스 시 좌상단 등장)으로 기존 화면 시각 영향 0."
      repro: "1) cd apps/web && npm run dev. 2) / 진입(로그인 안 한 상태). 3) Tab 키 눌렀을 때 첫 포커스 도달 위치 관찰 → SearchBar input(NavBar 첫 컨트롤)에 도달. 4) 추가 Tab → SearchBar 검색어 입력 시 dropdown row 들 → ThemeToggle → LoginButton 순으로 통과. 5) main content 첫 article(MasonryGrid 안 PinCard)에 도달하려면 NavBar 컨트롤 전부 통과 필요. 6) /search?q=<keyword> 진입 시 동일(검색 결과 dropdown 가산). 7) `grep -rn 'href=\"#main\\|sr-only.*focus:not-sr-only' src` 매칭 0건 확인."
    qa_plan: "1) cd apps/web && npm run dev. 2) / 진입 후 Tab 첫 회 누름 → 화면 좌상단에 'main content 로 건너뛰기' 링크 visible 등장(sr-only → focus:not-sr-only 토글). 3) Enter 키 → main content (#main) 으로 focus 이동 + 화면 스크롤. 4) /search, /mypage, /pins/[id], /pin/new, /boards/[id], /creators/[id] 페이지에서 동일 동작 확인. 5) /login 페이지(NavBar 없음)는 단순 main 으로 jump(시각 영향 없음). 6) 마우스 사용자는 anchor visible 없음(sr-only 유지). 7) 시각 회귀 0(skip link 외 모든 페이지 컨텐츠 미변경). 8) light mode 동일."
