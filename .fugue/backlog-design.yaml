  - id: "design-20260528-a11y-pin-create-form-orphan-labels-to-div"
    title: "PinCreateForm L331/L540 styled `<label>` 2개에 `htmlFor` + 라벨링 가능한 form control 자식 둘 다 부재 — HTML5 spec 상 label 의미 부적합(SR 가 label 발화하나 programmatic 연결 0) · WCAG 2.1 SC 1.3.1 Info & Relationships Level A · ProfileEditForm L67/L86 + PinCreateForm L460/L479/L492 의 htmlFor 보유 5 라벨 컨벤션 라인업 외부 갭"
