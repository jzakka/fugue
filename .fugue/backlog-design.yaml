        - "apps/web/src/app/pin/new/PinCreateForm.tsx:604-608"
      cite: "WCAG 2.1 SC 4.1.3 Status Messages (Level AA) — 'In content implemented using markup languages, status messages can be programmatically determined through role or properties such that they can be presented to the user by assistive technologies without receiving focus.' decision-log 2026-05-21 PR #58 (f7b8fdf) 가 6개 동적 inline error/feedback 컨테이너(FeedContainer · PinCreateForm · ProfileEditForm · MyPageClient · BoardActions · AddToBoardButton) 에 role/aria-live 부착해 a11y 라인업 확장. SearchBar L251-255 `검색 결과가 없습니다` (query.length >= 3 + !hasAnyResults 조건부 동적 마운트) 와 PinCreateForm L604-608 `일치하는 태그가 없습니다` (filteredTags.length === 0 동적 마운트) 는 같은 '동적 inline 상태 메시지' 패턴인데 PR #58 batch 에서 누락(검색 결과 없음은 error/feedback 분류가 아니라 별도 'no-results' 분기 — 같은 WCAG 4.1.3 항목 적용). 안티패턴 L19 는 인라인 마크업 유지 자체를 권장(EmptyState 컴포넌트 대체 금지)하므로 본 변경은 안티패턴과 정합(인라인 마크업 유지 + role/aria-live 만 추가)."
      repro: "1) cd apps/web && npm run dev. 2) NavBar 검색창에 'zzzz' 같은 결과 없는 3+ 자 입력 → 드롭다운에 '검색 결과가 없습니다' 인라인 div 마운트. SR(VoiceOver/NVDA) → 메시지 자동 안내 없음. 3) /pin/new 핀 생성 폼 → 태그 검색 input 에 일치 없는 텍스트 입력 → '일치하는 태그가 없습니다' 인라인 div 마운트. SR 자동 안내 없음. 4) 처리: SearchBar.tsx:252 `<div className=\"py-4 text-center text-sm text-text-dim\">` 에 `role=\"status\" aria-live=\"polite\"` 2 attribute 추가(diff +2 -1, JSX 단일 라인 multi-line 분리 포함). PinCreateForm.tsx:605 같은 패턴 적용(diff +2 -1)."
    qa_plan: "1) cd apps/web && npm run dev. 2) 시각 회귀 확인 — 두 메시지 mount 시 className(py-4 text-center text-sm text-text-dim · text-xs text-text-dim py-4 w-full text-center) 무변경 → 동일 시각. 3) DevTools → 두 div 에 role='status' + aria-live='polite' attribute 적용 확인. 4) SR 시뮬레이션(macOS VoiceOver Cmd+F5): SearchBar 'zzzz' 입력 → '검색 결과가 없습니다' 안내 / PinCreateForm 일치 없는 태그 입력 → '일치하는 태그가 없습니다' 안내. 5) 인접 회귀: SearchBar L243 showResults · L245 loading spinner · L257 hasPins / PinCreateForm L584-602 tag 매핑 무변경 확인. 6) 마우스 사용자 회귀 0 확인(시각 변화 없음). 7) decision-log 2026-05-21 PR #58 의 6개 기존 live region 박스 어떤 것도 시각·동작 변경 없음 확인."
    impact: 2
    confidence: 4
    effort: 1
    risk: 1
    score: 8.0
    status: done
    pr: 80
    note: "2026-05-21 PR #80 (dfcc02c) — 두 동적 inline `no-results` 메시지 div 에 `role=\"status\" aria-live=\"polite\"` 2 attribute 추가(diff +5 -1 두 곳, 총 +10 -2). SearchBar.tsx:251-255 (`검색 결과가 없습니다` mount 조건 `!loading && query.length >= 3 && !hasAnyResults`) + PinCreateForm.tsx:604-608 (`일치하는 태그가 없습니다` mount 조건 `filteredTags.length === 0`). 변경 후 `grep \"role=\"status\"\\|aria-live=\" apps/web/src/` 매칭 추가 2건. className(py-4 text-center text-sm text-text-dim / text-xs text-text-dim py-4 w-full text-center)·조건문·자식 텍스트·부모 컴포넌트 모두 미수정 → 시각 회귀 0, 마우스 사용자 회귀 0. PR #58 (f7b8fdf) 6 박스 ARIA live region 라인업의 'no-results' 분기 follow-up. 안티패턴 L19 (인라인 마크업 유지) 와 정합."

  - id: "design-20260521-a11y-search-recent-delete-focus-invisible"
    title: "SearchBar 최근 검색 row 의 삭제 버튼이 `opacity-0 group-hover:opacity-100` 로 hover 외에 비가시 — Tab 포커스 도달 시 focus indicator 불가시(WCAG 2.4.7 Focus Visible Level AA 위반)"
    area: a11y
    evidence:
