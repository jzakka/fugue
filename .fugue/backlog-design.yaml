      cite: "W3C CSS Media Queries Level 5 § 11.1 prefers-reduced-motion — 'Indicates that the user prefers the page to use minimal animation or motion.' MDN Web Docs § prefers-reduced-motion — '@media (prefers-reduced-motion: reduce) { /* disable non-essential animation */ }'. DESIGN.md L89 'Motion · Approach: Minimal-functional — 작품 감상을 방해하지 않는 선' 정신과 정렬 — OS 설정으로 motion 감소를 선택한 사용자는 '작품 감상 방해' 정의가 더 엄격함. 코드베이스 grep `prefers-reduced-motion` 0 매칭으로 갭 확인."
      repro: "1) macOS 시스템 설정 → 손쉬운 사용 → 디스플레이 → '동작 줄이기' 토글 ON (또는 Chrome DevTools → Rendering → Emulate CSS media feature prefers-reduced-motion: reduce). 2) 피드 첫 로드 시 CardSkeleton 또는 프로필 첫 로드 시 ProfileSkeleton 표시 → .skeleton-shimmer .bg-surface-elevated 가 background-position 1.5s linear infinite 로 좌→우 이동 애니메이션 계속 진행 → 사용자의 motion 감소 선호 무시. 3) 처리: globals.css L92-102 다음에 `@media (prefers-reduced-motion: reduce) { .skeleton-shimmer .bg-surface-elevated { animation: none; } }` 1 블록 추가(2-3 라인). animation 만 비활성 — background-image/size/repeat 정적 그라디언트는 유지되어 skeleton 시각 형태(어두운 배경 위에 미묘한 highlight 줄) 그대로. animate-spin 13곳은 essential progress indication 으로 별도 후보(본 cycle 미포함)."
