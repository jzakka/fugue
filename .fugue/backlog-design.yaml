      cite: "WAI-ARIA 1.2 aria-busy widget state (https://www.w3.org/TR/wai-aria-1.2/#aria-busy): 'Indicates an element is being modified and that assistive technologies MAY want to wait until the modifications are complete before exposing them to the user.' PinCreateForm.tsx L649-655 submit button 이 `disabled={isDisabled}` (L651, isDisabled = submitting || optimizing L299)로 시각/키보드 차단 + button text 가 `submitting ? '등록 중...' : optimizing ? '처리 중...' : '등록하기'` (L654)로 시각/SR 모두 busy state 노출되지만 `aria-busy` attribute 부재. SR(VoiceOver/NVDA) 사용자가 submit 직후 button focus 시 '등록 중..., 버튼, 비활성' 발화는 되지만 '바쁨' widget state 발화 0 — disabled 와 aria-busy 는 ARIA 1.2 spec 상 의미 분리(disabled=조작 불가, aria-busy=내부 변경 중). 컨벤션 라인업: BoardActions 저장 L96-97 disabled+aria-busy={saving}, MyPageClient 생성 L117-118 disabled+aria-busy={creating}, LoginButtons L71-72 disabled+aria-busy={loading === provider.id} (one-of-N), AddToBoardButton 생성 및 추가 L381-382 disabled+aria-busy={creating}, LogoutButton L26-27 disabled+aria-busy={loading}, ProfileEditForm 저장 L124-125 disabled+aria-busy={saving}, LoadMorePins 더보기 L43-44 disabled+aria-busy={loading}, SearchClient 더보기 L420-421 disabled+aria-busy={loadingMore} — 8 컴포넌트 일관된 컨벤션, PinCreateForm 만 누락. 보수적 선택 — `aria-busy={isDisabled}` 또는 `aria-busy={submitting || optimizing}`: 전자는 기존 isDisabled 식 재사용으로 식 중복 0, 후자는 isDisabled 의미(submitting + optimizing 모두 busy) 그대로 풀어쓴 형태. 두 식 의미 동일이지만 isDisabled 가 disabled 와 동일 식이라 isDisabled 식 재사용 보수적. anti-patterns L15-L21 무매치 — 단일 attribute 추가, Tailwind 클래스 의미 덮어쓰기 0, JSX 구조 비변경. 본 사이클 머지 시점 origin/main `grep -rnE 'aria-busy' apps/web/src/ --include=\"*.tsx\"` 8 match → 9 match (PinCreateForm 합류)."
