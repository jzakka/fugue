  - id: "design-20260519-pin-create-form-dropzone-keyboard-inoperable"
    title: "PinCreateForm 미디어 파일 dropzone div onClick 이 키보드로 작동 불가 — WAI-ARIA APG Button Pattern · WCAG 2.1 SC 2.1.1 Keyboard (Level A) 위반"
    area: a11y
    evidence:
      files:
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:329-344"
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:414-420"
      cite: "WAI-ARIA Authoring Practices Guide § Button Pattern: '버튼이 아닌 HTML 요소(예: `<div>`)가 버튼으로 사용되는 경우 (1) `role=\"button\"` 추가, (2) accessible name 제공(contents 또는 `aria-label`), (3) Enter/Space 키 이벤트 핸들러 구현, (4) tab 순서에 포함되도록 `tabindex` 설정해야 한다.' WCAG 2.1 SC 2.1.1 Keyboard (Level A): 'All functionality of the content is operable through a keyboard interface without requiring specific timings for individual keystrokes.' DESIGN.md L11 'Decoration level: Minimal' 및 루프 정체성 L7 '접근성 (대비, 키보드 포커스, aria)' 영역 정합. In-codebase precedent: archive/2026-05-15-search-dropdown-keyboard-a11y(SearchBar 5종 시맨틱 정렬) 동일 라인업의 폼 영역 확장. `grep -rEn -B1 'onClick=' apps/web/src --include='*.tsx' | grep -E '<div|<span'` 결과 본 단일 케이스만 매칭(코드베이스 내 div onClick 유일 — 다른 곳은 button 또는 Link 시맨틱 사용)."
      repro: "1) /pin/new 진입 후 Tab 키만으로 미디어 파일 dropzone 영역에 도달 시도 → 도달 불가(dropzone div 는 tabIndex 없음). 2) 키보드만 사용하는 사용자는 핀 생성 자체가 완전 불가능(미디어 업로드 시작 점이 키보드 비접근). 3) SR 이 dropzone 영역에 도달해도 'clickable region' 형태로 button 시맨틱 인식 안 함. 4) 처리: L330-333 `<div onClick={...}>` 에 `role=\"button\"` · `tabIndex={0}` · `aria-label=\"미디어 파일 선택\"` · `onKeyDown` 핸들러(Enter/Space 시 `e.preventDefault()` + `fileInputRef.current?.click()`) 4 attribute 추가. className(border-2 border-dashed border-border rounded-[10px] p-8 text-center cursor-pointer hover:border-accent transition-colors) 그대로 유지. 자식 div 3개(📁 / '클릭하여 파일을 선택하세요' / '이미지 / 오디오 / 비디오' / 부연) 미수정 → 시각 변화 0. focus-visible 시각 표시는 WCAG SC 2.4.7 (Level AA) 별도 후보로 분리(본 변경은 SC 2.1.1 키보드 작동만 충족)."
