      repro: "1) grep -n 'text-error\">\\*' apps/web/src/app/pin/new/PinCreateForm.tsx → 2건(L327 미디어 파일 · L436 제목). 2) L438 input element 보면 `id=\"pin-title\"`로 `<label htmlFor=\"pin-title\">`(L435) 연결 정상이지만 `aria-required` / HTML `required` 속성 부재. 3) VoiceOver/NVDA로 /pin/new 진입 후 제목 input 포커스 — SR이 'pin title, edit text'로 안내, '필수' 또는 'required' 안내 없음. visible '*'는 label 텍스트 안에 있어 'pin title star, edit text' 형태로 'star' 발음됨(WAI-ARIA APG 권장 패턴 위반: 시각 단서가 SR에 그대로 노출되어 의미 모호). 4) 처리: L438 input element 에 `aria-required=\"true\"` 1 attribute 추가, L436 visible '*' span에 `aria-hidden=\"true\"` 1 attribute 추가(SR이 'star' 발음 회피). 시각 변화 0(visible '*' 그대로 렌더, input 디자인 미변경). 함수형 동작 0(`required` HTML 속성 미사용으로 browser native validation popup 미트리거, 기존 `handleSubmit` 커스텀 validation 유지). 미디어 파일 case(L327)는 dropzone를 button으로 변환 + `<label htmlFor>` 연결 + hidden input 라벨링 필요해 단일 cycle 범위 초과, 별도 후보로 분리."
