        - "apps/web/src/app/pin/new/PinCreateForm.tsx:318-474"
      cite: "WAI-ARIA 1.2 aria-invalid (https://www.w3.org/TR/wai-aria-1.2/#aria-invalid): 'Indicates the entered value does not conform to the format expected by the application.' WAI-ARIA 1.2 aria-describedby (https://www.w3.org/TR/wai-aria-1.2/#aria-describedby): 'Identifies the element (or elements) that describes the object.' MyPageClient.tsx L89-96 error alert div(role=\"alert\" aria-live=\"polite\") 와 L98-113 새 보드 이름 input 둘 다 존재하지만 input 에 `aria-invalid` + `aria-describedby` 둘 다 부재 + error div 에 id 부재 → 보드 생성 실패 시(L47-50 createBoard catch) error 메시지가 alert 로 announce 되지만 SR(VoiceOver/NVDA) 사용자가 input focus 로 돌아왔을 때 input 의 invalid state programmatic 식별 0 + error 메시지와 input 의 관계 0. 컨벤션 라인업: (a) BoardActions L64-83 error div `id=\"board-name-error\"` (L66) + input `aria-invalid={!!error && !name.trim()}` (L81) + `aria-describedby={error ? \"board-name-error\" : undefined}` (L82), (b) ProfileEditForm L54-81 error div `id=\"profile-nickname-error\"` (L56) + input `aria-invalid={!!error && !nickname.trim()}` (L78) + `aria-describedby={error ? \"profile-nickname-error\" : undefined}` (L79), (c) PinCreateForm L318-474 error div `id=\"pin-error\"` (L320) + title input `aria-invalid={!!error && !title.trim()}` (L471) + `aria-describedby={error ? \"pin-error\" : undefined}` (L472) — 3 컴포넌트 일관된 'input ↔ error alert wiring' 컨벤션, MyPageClient 만 누락. 보수적 선택 — id 명명: `mypage-board-name-error` (BoardActions 의 `board-name-error` 와 충돌 회피, 컴포넌트 스코프 prefix). aria-invalid 식: `!!error && !newBoardName.trim()` (BoardActions L81 의 `!!error && !name.trim()` 패턴 그대로 — error 가 있으면서 input 이 비어있을 때만 invalid=true). aria-describedby 식: `error ? \"mypage-board-name-error\" : undefined` (BoardActions L82 그대로). anti-patterns L15-L21 무매치 — 3 attribute + 1 id 추가, JSX 구조 비변경, Tailwind 클래스 비변경, 시각 변경 0."
      repro: "1) cd apps/web && npm run dev → 로그인 → /me 또는 /creators/<UUID> 진입 → '+ 새 보드' button click → showCreate=true → BoardSection mb-4 panel open. 2) 빈 input 으로 '생성' button click 시도 → disabled (L117 disabled={creating}) 이지만 input trim 후 empty 면 handleCreate L37-38 early return (button disabled 아니라 다른 경로). 3) 의도적 server error 유발 → createBoard L43 throw → catch L47-50 setError(...) → error alert L89-96 표시. 4) input focus 로 tab return → DevTools Elements 패널 → input 에 aria-invalid/aria-describedby 둘 다 missing 확인. 5) VoiceOver/NVDA → input focus 시 '새 보드 이름, 텍스트 필드, 필수' 발화는 되지만 'invalid' state + error 메시지 description 발화 0. 6) `grep -nE 'aria-invalid|aria-describedby' apps/web/src/components/profile/MyPageClient.tsx` 0 match — input 부재 확인. 7) 비교: /me → '보드 편집' BoardActions L74-83 input 동일 시나리오에서 SR 'invalid, 보드 이름, 텍스트 필드, 필수, <error 메시지>' 발화 (aria-invalid + aria-describedby 적용 효과)."
      qa_plan: "1) cd apps/web && npm run dev → /me 또는 /creators/<UUID> 진입 → '+ 새 보드' button click → DevTools Elements 패널 → input 에 aria-invalid 평가 (변경 전 0, 변경 후 `!!error && !newBoardName.trim()` binding) + aria-describedby 평가 (변경 전 0, 변경 후 `error ? \"mypage-board-name-error\" : undefined` binding) + error alert div 의 id 평가 (변경 전 0, 변경 후 \"mypage-board-name-error\"). 2) 빈 input + 의도적 error 유발 (예: 네트워크 끊김 또는 mock api 503) → error 표시 → input focus 시 `aria-invalid=\"true\"` + `aria-describedby=\"mypage-board-name-error\"` 노출 (DOM inspection). 3) VoiceOver/NVDA 로 error 표시 후 input focus → '새 보드 이름, 텍스트 필드, 필수, invalid, <error 메시지>' 발화 확인. 4) `grep -nE 'aria-invalid|aria-describedby' apps/web/src/components/profile/MyPageClient.tsx` 2 matches 확인 (L?? aria-invalid 신규 + L?? aria-describedby 신규). 5) input 의 type/value/onChange/placeholder/aria-label/aria-required/maxLength/className/onKeyDown 모두 미수정 → 시각/동작 변화 0. 6) error alert div 의 role/aria-live/className/메시지 모두 미수정 (id 만 추가) → 시각 변경 0. 7) 인접 컴포넌트(ProfileHeader · ProfileEditForm · PinsGrid · BoardCover · NavBar) 영향 0. 8) `grep -rnE 'aria-invalid' apps/web/src/ --include=\"*.tsx\"` 변경 전 N → 변경 후 N+1 (MyPageClient 합류)."
