    note: "2026-05-21 PR #4762 — LogoutButton.tsx:29 첫 분기 `\"...\"` → `\"로그아웃 중...\"` 1 string literal 변경(diff +1 -1). WCAG 2.1 SC 4.1.3 Status Messages (Level AA) 정렬 — SR(VoiceOver/NVDA) 가 'horizontal ellipsis' 대신 의미 있는 진행 상태 안내. 코드베이스 내 5건의 `{동작} 중...` 패턴(LoginButtons '리다이렉트 중...' · ProfileEditForm '저장 중...' · PinCreateForm '파일 처리 중...' / '미리보기를 불러오는 중...' / '등록 중...')과 비대칭 해소. disabled 동작·error 분기('재시도')·hover transition·className(`text-sm text-text-muted hover:text-text-primary transition-colors cursor-pointer disabled:opacity-50`) 미수정 → 시각/동작 회귀 0. button width 가 4 chars(로그아웃) → 8 chars(로그아웃 중...) 로 변화하지만 NavBar 의 gap-3 spacing 안에서 흡수. Ralph 환경 제약(node_modules 미설치)으로 lint/typecheck/실 브라우저 QA 미수행 — 단일 string literal 변경 단위라 코드 검증으로 대체."

  - id: "design-20260521-responsive-pincard-audio-nickname-truncate"
    title: "PinCard AudioSection 의 creator.nickname 이 sibling title(truncate) 과 다르게 overflow 처리 부재 — 좁은 masonry column 에서 줄 바꿈 또는 가로 overflow"
