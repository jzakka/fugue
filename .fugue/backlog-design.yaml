  - id: "design-20260528-a11y-mypage-client-board-create-input-aria-invalid-describedby-missing"
    title: "MyPageClient '새 보드 이름' input 에 aria-invalid + aria-describedby 누락 — 보드 생성 실패 시 SR 사용자가 input 의 error 상태 programmatic 식별 불가 · WAI-ARIA 1.2 aria-invalid + aria-describedby · BoardActions L74-83 / ProfileEditForm L70-81 / PinCreateForm L463-474 의 'input ↔ error alert' 컨벤션 라인업 외부 갭"
    area: a11y
