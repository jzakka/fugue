  - id: "design-20260528-a11y-video-thumbnail-picker-group-role-label-missing"
    title: "VideoThumbnailPicker 썸네일 선택 버튼 wrapper 에 role=\"group\" + aria-label=\"비디오 썸네일 선택\" 누락 — 비디오 핀 생성 시 SR 사용자가 N 썸네일 옵션 묶음 식별 불가 · WAI-ARIA 1.2 group role + WCAG 2.1 SC 1.3.1 Info & Relationships Level A · cycle 154/156/158/159 group landmark 컨벤션 외부 갭"
