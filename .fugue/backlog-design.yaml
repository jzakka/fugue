  - id: "design-20260528-a11y-profile-edit-nickname-label-asterisk-missing"
    title: "ProfileEditForm 닉네임 label 에 시각 asterisk(`<span text-error aria-hidden>*</span>`) 누락 — PinCreateForm L461 gold-standard 4 요소 컨벤션(label asterisk + aria-required + aria-invalid + aria-describedby) 중 ProfileEditForm L67 이 1 요소(label asterisk) 부족 · cycle 142 decision-log 가 명시적으로 deferral 한 시각 companion · WCAG 2.1 SC 3.3.2 Labels or Instructions Level A"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/profile/ProfileEditForm.tsx:67"
        - "apps/web/src/components/profile/ProfileEditForm.tsx:21-29"
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:460-462"
      cite: "WCAG 2.1 SC 3.3.2 Labels or Instructions Level A (https://www.w3.org/WAI/WCAG21/Understanding/labels-or-instructions): 'Labels or instructions are provided when content requires user input.' SC 3.3.2 의 'instructions' 는 required state 가 시각적으로 노출되어야 한다는 의미를 포함 — aria-required 만 있으면 SR 사용자에게만 발화되고 시각 사용자(저시력 / 인지 / 일반 sighted)는 '필수' 시각 단서 0. PinCreateForm L460-462 gold-standard: `<label htmlFor=\"pin-title\">제목 <span className=\"text-error\" aria-hidden=\"true\">*</span></label>` — 4 요소 컨벤션의 시각 요소(label asterisk). ProfileEditForm L67 은 `<label htmlFor=\"profile-nickname\">닉네임</label>` 만 — aria-required(L75 cycle 142) · aria-invalid(L76 cycle 138) · aria-describedby(L77 cycle 138) 3 요소 보유하나 시각 asterisk 1 요소 부재. handleSubmit(L21-45)이 L25-29 `const trimmed = nickname.trim(); if (!trimmed) { setError('닉네임을 입력해주세요'); return; }` 으로 setError-based required validation 명시적 의도(PinCreateForm 과 정확 동일 패턴). cycle 142 decision-log 가 이 갭을 명시적으로 deferral: 'PinCreateForm L470 의 4 요소 컨벤션(label asterisk + aria-required + aria-invalid + aria-describedby) 중 본 사이클은 aria-required 1건만 — label 시각 asterisk(<span className=\"text-error\" aria-hidden=\"true\">*</span>) 는 시각 변경이라 별도 사이클로 분리(anti-patterns L16 시각/a11y 분리 정신).' in-codebase label asterisk 라인업: `grep -rnE 'className=\"text-error\".+aria-hidden=\"true\".*\\*' apps/web/src/ --include=\"*.tsx\"` 1 match(PinCreateForm L461 단일) — 본 사이클 추가 시 coverage 1 → 2 (PinCreateForm + ProfileEditForm). 보수적 선택 — `aria-hidden=\"true\"` 가 SR 중복 발화 차단(aria-required 가 SR 채널 담당 분리 유지). anti-patterns L15-L21 무매치 — `text-error` 토큰(`@theme inline` cycle <=140 정의됨) 재사용, 신규 토큰 0, Tailwind 클래스 의미 덮어쓰기 0, JSX 구조 변경 0(label children 에 inline span 1개 추가)."
      repro: "1) cd apps/web && npm run dev → 로그인 → /mypage → '편집' button click → ProfileEditForm open. 2) 닉네임 label(L67) 확인 → '닉네임' 텍스트만, 시각 asterisk 0. 3) 비교: /pin/new 진입 → 제목 label 확인 → '제목 *'(`*` 는 text-error 색상). 4) DevTools Elements 패널 → label children 비교: ProfileEditForm = `'닉네임'` text node 1개 / PinCreateForm = `'제목 '` + `<span text-error aria-hidden>*</span>` 2 children. 5) sighted 사용자가 ProfileEditForm 닉네임을 비워두면 setError UI 발동하지만, 폼 진입 시점에 '필수' 시각 단서 미노출 → trial-and-error 강제. 6) VoiceOver 비교: 두 input 모두 aria-required 보유라 '필수' 발화는 동일, but 시각 asterisk 가 사용자에게 사전 안내 역할(SC 3.3.2 'before submission' 시점에 instruction 노출 의미). 7) `grep -rnE 'className=\"text-error\".+aria-hidden=\"true\".*\\*' apps/web/src/ --include=\"*.tsx\"` 1 match 확인 — PinCreateForm 단독."
