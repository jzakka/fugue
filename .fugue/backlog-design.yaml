      cite: "WCAG 2.1 SC 2.4.7 Focus Visible (Level AA) — 'Any keyboard operable user interface has a mode of operation where the keyboard focus indicator is visible.' SearchBar.tsx:221 의 className `opacity-0 group-hover:opacity-100 text-text-dim hover:text-text-primary transition-opacity p-1 cursor-pointer` 가 마우스 hover 외에는 opacity:0 유지 → 키보드 Tab 으로 버튼에 포커스가 도달해도 시각 표시 없음. 자체 `focus-visible:` 규칙도 없고 `group-focus-within:` 규칙도 부모 div(L189 `group transition-colors`)에 없어 포커스 시 opacity 회복 경로가 0건. decision-log 2026-05-19 PR #36(PinCreateForm dropzone focus-visible 추가) · in-codebase focus-visible 패턴 6 파일(PinCard L146 · BoardCover L6+L30 · BoardGrid L22 · MyPageClient L130 · SearchClient L313+L351 · PinCreateForm L341) 라인업에 정합. 안티패턴 L15-L21 무매치."
      repro: "1) cd apps/web && npm run dev. 2) NavBar 검색창 클릭 → 최근 검색 항목 있는 상태(예: 이전 검색어 '음악' 1건). 3) Tab/Shift+Tab 으로 검색 input → 최근 검색 query 버튼 → 삭제 X 버튼 순서로 포커스 이동. 4) X 버튼에 포커스 시 시각 표시 0 (opacity:0 유지) → 키보드 사용자는 어디에 포커스 있는지 알 수 없음. Enter/Space 누르면 최근 검색 삭제됨(보이지 않게). 5) 처리: L221 className `opacity-0 group-hover:opacity-100` 뒤에 `focus-visible:opacity-100` 1 utility 삽입(diff +1 -1, 단일 className 변경). 추가 클릭/SR 행위 미요구."
