  - id: "design-20260521-video-trim-modal-focus-trap"
    title: "VideoTrimModal Tab focus trap 누락 — WAI-ARIA Dialog Pattern 잔여 정렬"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/pin/VideoTrimModal.tsx:73-75,146-265"
      cite: "WAI-ARIA Authoring Practices Guide § Dialog (Modal) Pattern — 'Tab and Shift+Tab do not move focus outside the dialog.' WCAG 2.1 SC 2.4.3 Focus Order (Level A) 및 SC 2.1.2 No Keyboard Trap 의 modal 예외(modal 컨텍스트 내부에서는 의도적 focus 순환이 정상). decision-log 2026-05-18 cycle 30(Initial focus 추가) note 마지막 줄 명시: '잔여 Focus trap 은 effort/risk 가 단발 사이클 패턴 초과로 본 사이클 범위 밖' — 본 후보는 그 잔여 항목 중 단순한 modal(focusable=2 buttons) 한 건. 동일 컴포넌트 누적: cycle 25(role=dialog 트리플), cycle 56(Escape + body scroll lock), cycle 70(overlay click 닫기), cycle 30(Initial focus via panelRef tabIndex=-1)."
      repro: "1) VideoTrimModal 진입 후 Tab 키 반복 → panel(tabIndex=-1, Initial focus 받음) → '취소' button → '선택 완료' button → Tab 한 번 더 누르면 modal 외부(아래쪽 페이지 콘텐츠)로 포커스 이탈 → background 의 다른 폼/링크가 키보드 활성화되어 modal 격리 위반. 2) Shift+Tab 도 동일하게 panel 위쪽 페이지 콘텐츠로 이탈. 3) 처리: useEffect 1 블록 추가 — panel keydown listener 에서 e.key === 'Tab' 시 panel.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), [tabindex]:not([tabindex=\"-1\"])') 로 focusable 수집, first/last index 와 비교해 Shift+Tab on first → last 로 wrap, Tab on last → first 로 wrap (e.preventDefault() + target.focus()). modal 내 focusable = [취소, 선택 완료] 2개로 단순. slider handle div 들은 tabIndex 부여 안 되어 있어 Tab 순서 포함되지 않음(별도 후보로 분리)."
    qa_plan: "1) cd apps/web && npm run dev 후 비디오 업로드 → VideoTrimModal 진입 → Tab 키 반복으로 panel → 취소 → 선택 완료 → 다시 취소(wrap) 순환 확인. 2) Shift+Tab 반대 방향 순환 확인 — 선택 완료 → 취소 → 선택 완료(wrap). 3) modal 외부 background 페이지 콘텐츠로 포커스 이탈하지 않음 확인. 4) 시각 변화 0(useEffect 1 블록 추가만, JSX 미변경) — 동일 스크린샷. 5) 마우스 사용자 회귀 0(keydown listener 는 마우스 클릭 동작 미간섭). 6) Initial focus(cycle 30) · Escape(cycle 56) · overlay click(cycle 70) 기존 동작 그대로 회귀 0."
    impact: 3
    confidence: 4
    effort: 1
    risk: 2
    score: 6.0
    status: done
    pr: 61
    note: "2026-05-21 PR #61 squash merge — VideoTrimModal.tsx 에 focus trap useEffect 1 블록 추가(diff +26 -0). panel keydown 에서 e.key === 'Tab' 시 panel.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), [tabindex]:not([tabindex=\"-1\"])') 로 focusable 수집, first/last wrap. Shift+Tab on first 또는 panel → last, Tab on last → first (e.preventDefault() + target.focus()). modal 내 focusable = [취소, 선택 완료] 2 buttons. WAI-ARIA APG Dialog Pattern · WCAG 2.1 SC 2.4.3 Focus Order Level A 정렬. cycle 30(Initial focus) 잔여 항목 처리. JSX/className/role/aria-* 미변경 → 시각 회귀 0. 기존 useEffect(L42 video URL · L52 currentTime · L58 Escape · L66 body scroll lock · L73 Initial focus) 미수정 → 회귀 0. 마우스 사용자 회귀 0. Ralph 환경 제약(node_modules 미설치)으로 lint/typecheck/실 브라우저 QA 미수행 — 코드 검증으로 대체."

