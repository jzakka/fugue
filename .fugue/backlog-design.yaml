L) 와 의미 불일치. 'photo' 가 정확. 안티패턴 L15-L21 무매치 — 단일 attribute 추가(diff +1 -0), Tailwind 기본 클래스 의미 덮어쓰기 없음, JSX 구조 비변경, radius/Card System/EmptyState/breakpoint/DESIGN.md 내부 모순과 무관, photo token 은 user-data 매핑(deployment 매니페스트 아님)."
      repro: "1) cd apps/web && npm run dev → 로그인 → /mypage → '편집' 버튼 → ProfileEditForm 진입. 2) 아바타 URL input(L86-93) DevTools Elements 패널 확인 → type='url' 보유 but autocomplete attribute 0. 3) 브라우저에 저장된 photo URL 이 있는 자동완성 활성 환경에서 input focus → 자동완성 제안 표시되지 않음(input purpose programmatic 식별 불가, type='url' 만으로는 user-data purpose 미식별). 4) 음성 입력 도구(Voice Control on macOS) → '아바타 필드로 이동' 명령 실패. 5) name attribute 도 없음 → autofill engine 이 field purpose 추론 불가. 6) `grep -nE 'autoComplete' apps/web/src/components/profile/ProfileEditForm.tsx` 1 match(L74 nickname) 확인 — L88(type='url' 라인)에는 autoComplete 부재."
    qa_plan: "1) cd apps/web && npm run dev → 로그인 → /mypage → '편집' 버튼 → ProfileEditForm. 2) avatar URL input DevTools 확인 → autocomplete=\"photo\" attribute 평가. 3) 브라우저 자동완성 활성 환경에서 input focus → 'photo' purpose 식별되어 적절한 자동완성 UI 표시 확인. 4) 시각 회귀 0 (autoComplete 는 HTML form attribute, input styling/label/aria/layout/type='url'/placeholder='https://...' 모두 그대로). 5) `grep -nE 'autoComplete' apps/web/src/components/profile/ProfileEditForm.tsx` 2 matches(L74 nickname 기존 · L92 photo 신규) 확인 — 변경 전 1 → 변경 후 2. 6) `grep -rnE 'autoComplete' apps/web/src/ --include=\"*.tsx\"` 2 matches(둘 다 ProfileEditForm.tsx) 확인. 7) 인접 input(MyPageClient 보드 이름 · 다른 컴포넌트의 보드 이름/제목 input 등) 미수정 → 영향 0. 8) avatar preview img(L94-105 onError fallback)·form submit/validation/error 분기 미영향. 9) ProfileEditForm 의 다른 attribute(id/htmlFor/maxLength/value/onChange/placeholder/type 등) 변경 0."
