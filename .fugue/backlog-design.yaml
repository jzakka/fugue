# Fugue 디자인 트랙 백로그
#
# 루프(`prompts/loop-design.md`)가 발견 모드에서 채우고 처리 모드에서 비운다.
# 사람이 직접 편집해도 된다. status를 `skip`으로 바꾸면 루프가 영구 스킵한다.
#
# 스키마:
#   id:         "design-<yyyymmdd>-<short>"  발견 시 자동 부여
#   title:      한 줄 요약
#   area:       tokens | states | responsive | a11y | aesthetic
#   evidence:
#     files:    ["apps/web/path/to/file.tsx:LSTART-LEND", ...]
#     cite:     "DESIGN.md L?? — 인용 문장"
#     repro:    (선택) 재현 절차
#   qa_plan:    한 사이클의 7단계 실 브라우저 QA에서 수행할 검증 시나리오 1~3줄
#   impact:     1..5  사용자 체감 시각/기능 영향
#   confidence: 1..5  "진짜 이슈"의 확신도 (< 3 이면 자동 폐기)
#   effort:    1..5  수정에 드는 변경 폭
#   risk:       1..5  다른 화면·컴포넌트 회귀 위험
#   score:      impact * confidence / (effort * risk)   자동 계산
#   status:     pending | in_progress | done
#               | rejected_self | rejected_impl | rejected_qa | rejected_ci
#               | needs_decision | skip
#   pr:         (done/rejected_ci 시) PR 번호
#   note:       (선택) 자유 메모

items:
  - id: "design-20260605-overflow-wrap-freetext-guard"
    title: "free-text 본문(핀/보드 설명·제목)에 overflow-wrap 가드가 없어 긴 무공백 문자열(URL 등)이 좁은 뷰포트에서 가로 오버플로한다"
    area: responsive
    evidence:
      files:
        - "apps/web/src/app/pins/[id]/page.tsx:135"
        - "apps/web/src/app/pins/[id]/page.tsx:140-143"
        - "apps/web/src/app/boards/[id]/page.tsx:56"
        - "apps/web/src/app/boards/[id]/page.tsx:59-62"
      cite: "WCAG 2.1 SC 1.4.10 Reflow (Level AA) — 320px CSS 폭에서 2차원 스크롤 없이 콘텐츠 reflow. block `<p>`/`<h1>`은 기본 `overflow-wrap: normal`이라 공백 없는 긴 토큰(붙여넣은 URL 등)을 끊지 못해 콘텐츠 박스를 넘어 가로 오버플로(또는 가로 스크롤바)를 유발. 코드베이스 전체에 `break-words`/`overflow-wrap` 가드가 0곳 — line-clamp/truncate 사용처(SearchClient 보드설명 L391 line-clamp-2 등)는 `overflow:hidden`으로 자기보호되나, 전문(全文) 노출되는 설명/제목 4곳은 무방비."
      repro: "dev 서버 320px 폭에서 (1) 긴 무공백 문자열(예: 200자 URL)을 핀 설명에 넣고 /pins/{id} 진입 → 설명 `<p>`(L141)가 우측으로 넘쳐 가로 스크롤 발생. (2) 동일 문자열을 보드 설명/이름에 넣고 /boards/{id} 진입 → 헤더 `<p>`(L60)/`<h1>`(L56) 오버플로. line-clamp 적용된 검색 결과 보드설명은 클립되어 안전(대조군)."
    qa_plan: "dev 서버 + 헤드리스 브라우저 320px: (1) 긴 무공백 URL을 가진 핀/보드 설명·제목에서 document.scrollWidth > clientWidth 여부(가로 오버플로) 측정 — 수정 전 true 확인. (2) `break-words` 적용 후 동일 측정 false(reflow 정상) 확인. (3) 인접 회귀: 일반 공백 포함 설명·짧은 제목·태그 칩(whitespace-nowrap 의도)·line-clamp 검색결과가 변형되지 않는지."
    impact: 2
    confidence: 3
    effort: 1
    risk: 1
    score: 6.0
    status: done
    pr: 1278
    note: "cycle 680 발견 → cycle 681 Processing 완료. pins/[id] 제목 L135·설명 L141, boards/[id] 이름 L56·설명 L60에 `break-words` 추가. 실 브라우저 QA(Chrome headless, 272px=320−px-6 콘텐츠박스): 수정 전 긴 무공백 URL scrollWidth 2651>cw 272(overflow true) → `break-words` 적용 후 272==272(overflow false), 공백 포함 일반 텍스트 대조군 무회귀(overflow false). lint 0 error·tsc 통과."
  - id: "design-20260605-truncate-min-w-0-flex-guard"
    title: "flex 직접 자식인 truncate span에 min-w-0 가드가 없어 ellipsis 대신 하드 클립된다"
    area: responsive
    evidence:
      files:
        - "apps/web/src/components/feed/PinCard.tsx:160-188"
        - "apps/web/src/components/nav/SearchBar.tsx:198-218"
      cite: "DESIGN.md L11 — 'Decoration level: Minimal — 타이포그래피와 여백이 모든 걸 한다' (의도된 ellipsis truncate가 하드 클립으로 깨짐). 코드베이스 내부 관용구: truncate-in-flex 6곳(PinCard L70·SearchBar L297/373·AddToBoardButton L338·ProfileHeader L29·SearchClient L336/385)은 모두 min-w-0 wrapper 사용. WCAG 1.4.10 Reflow 보조 근거."
      repro: "좁은 뷰포트(320px)에서 긴 크리에이터 닉네임을 가진 핀 카드(피드) 또는 긴 최근 검색어가 있을 때, truncate가 ellipsis(…)를 표시하지 못하고 ancestor overflow-hidden에 의해 텍스트가 단어 중간에서 하드 컷된다. 원인: flex 자식 span이 min-width:auto라 content 폭 미만으로 축소되지 못해 text-overflow:ellipsis가 발동 안 함."
    qa_plan: "dev 서버에서 (1) 피드(/)의 PinCard 크리에이터명 행을 320px 폭에서 확인 — 긴 닉네임이 '…'로 끝나는가, 카드 경계를 넘지 않는가. (2) 검색바 드롭다운의 긴 최근 검색어가 '…'로 truncate되는가. (3) 인접: SearchClient 결과행(L336/385, 이미 min-w-0)은 회귀 없는가."
    impact: 2
    confidence: 4
    effort: 1
    risk: 1
    score: 8
    status: rejected_qa
    note: "FALSE POSITIVE (cycle 665 처리 모드 QA). `truncate`는 overflow:hidden을 포함 → CSS Flexbox §4.5상 overflow≠visible인 flex 자식은 자동 최소 크기가 0이라, direct truncate 자식은 min-w-0 없이 이미 정상 truncate됨. 헤드리스 QA(playwright, 320px)에서 PinCard replica·실제 SearchBar 둘 다 min-w-0 토글 전/후 결과 동일(ellipsisActive=true, overflow 없음, clientWidth 불변). 코드베이스 다른 6곳이 min-w-0를 쓰는 건 truncate가 중간 wrapper div(overflow:visible)에 감싸인 경우라 wrapper에 필요한 것. 코드 변경 되돌림(머지 안 함). anti-patterns 기록."
  - id: "design-20260515-general-sans-not-loaded"
    title: "General Sans 폰트가 로드되지 않아 디스플레이/히어로 타이포가 시스템 sans-serif로 폴백된다"
    area: tokens
    evidence:
      files:
        - "apps/web/src/app/layout.tsx:14-25"
        - "apps/web/src/app/pins/[id]/page.tsx:140"
        - "apps/web/src/app/pins/[id]/page.tsx:258"
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:316"
        - "apps/web/src/app/search/SearchClient.tsx:233"
        - "apps/web/src/app/boards/[id]/page.tsx:57"
        - "apps/web/src/components/board/BoardGrid.tsx:16"
        - "apps/web/src/components/board/AddToBoardButton.tsx:208"
        - "apps/web/src/components/profile/MyPageClient.tsx:68"
      cite: "DESIGN.md L17 — 'Display/Hero: General Sans 700 — 기하학적이면서 개성 있음.' / L22-25 폰트 로딩 명세에 General Sans 포함"
      repro: "어느 페이지든 General Sans inline 스타일이 걸린 헤딩 요소를 DevTools Computed Font로 검사하면 'General Sans'가 아닌 시스템 sans-serif가 사용되고 있음을 확인할 수 있다 (layout.tsx에서 General Sans CSS를 로드하지 않기 때문)."
    impact: 5
    confidence: 5
    effort: 1
    risk: 1
    score: 25.0
    status: done
    note: "2026-05-15 처리 완료. Fontshare CDN으로 500/700 weight 로드. OpenSpec change: archive/2026-05-15-load-general-sans-font."
  - id: "design-20260515-semantic-hex-literal"
    title: "AddToBoardButton 피드백 박스가 semantic 토큰 대신 raw hex(#34C759 / #FF3B30)를 사용한다"
    area: tokens
    evidence:
      files:
        - "apps/web/src/components/board/AddToBoardButton.tsx:235-239"
      cite: "DESIGN.md L50 — 'Semantic: success #34C759, warning #FFB800, error #FF3B30, info #5AC8FA' (토큰으로 명시). globals.css L19-22, L49-51에서 --color-success/--color-error를 @theme inline으로 노출 중이라 `bg-success`, `text-error` 등 토큰 클래스가 이미 사용 가능."
      repro: "AddToBoardButton에서 보드에 핀 추가 후 노출되는 피드백 박스 코드 인스펙트."
    impact: 2
    confidence: 4
    effort: 1
    risk: 1
    score: 8.0
    status: done
    note: "2026-05-15 처리 완료. OpenSpec change: archive/2026-05-15-replace-semantic-hex-with-tokens."
  - id: "design-20260515-avatar-gradient-orange-400"
    title: "아바타 폴백 그라디언트가 토큰 외 색(`orange-400`, `#FF8A5C`)을 사용한다"
    area: tokens
    evidence:
      files:
        - "apps/web/src/components/nav/NavBar.tsx:46"
        - "apps/web/src/components/feed/PinCard.tsx:168-172"
        - "apps/web/src/components/profile/ProfileHeader.tsx:24"
        - "apps/web/src/components/nav/SearchBar.tsx:322"
        - "apps/web/src/app/pins/[id]/page.tsx:214"
        - "apps/web/src/app/search/SearchClient.tsx:325"
      cite: "DESIGN.md L37-49 — 색 팔레트 명시. accent 계열은 #E85A2A / #FF6B3D / accent-subtle 세 가지로 한정. Tailwind 기본 orange-400(#FB923C) 및 #FF8A5C는 정의된 토큰 어디에도 없음. L38 'Restrained — 액센트는 사용자 액션에만 써서 작품과 경쟁하지 않는다' 위반(아바타 폴백은 사용자 액션 아님)."
    impact: 3
    confidence: 4
    effort: 2
    risk: 2
    score: 3.0
