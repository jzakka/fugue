      cite: "WAI-ARIA Authoring Practices Guide Dialog (Modal) Pattern: 'When a dialog opens, focus moves to an element contained in the dialog.' 두 modal 모두 `role=\"dialog\" aria-modal=\"true\"` 트리플(사이클 25), Escape 닫기(사이클 56), body scroll lock(사이클 56), overlay click 닫기(cycle 70)는 받았으나 Initial focus(modal 열릴 때 panel에 포커스 이동) 패턴 누락. 사이클 70 archive note(`.fugue/decision-log.md:23`) '본문: body scroll lock·overlay click 닫기·Initial focus·Focus trap은 별도 후보로 분리 유지' + cycle 70 note '`Initial focus·Focus trap`은 별도 잔여 후보로 보류'에서 명시적 후속 잔여로 분리 보류."
      repro: "VideoTrimModal·AddToBoardButton 모달이 열린 직후 Tab 키를 누르면 modal 바깥 요소(예: 백그라운드 NavBar 링크 또는 폼 컨트롤)로 포커스가 이동할 수 있음. 키보드 사용자 흐름이 modal과 분리됨. 처리 방식: 두 modal panel div(VideoTrimModal L148-153 inner dialog div · AddToBoardButton L201-207 panel div)에 `tabIndex={-1}` 추가 + 각 컴포넌트 본문에 `useEffect(() => { panelRef.current?.focus(); }, [])` 한 블록 추가. 두 modal 모두 panelRef 기존 존재 — cycle 70 + AddToBoardButton 정착 패턴 활용. 4단계 변경(파일당 2단계 × 2 파일)."
