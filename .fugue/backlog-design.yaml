    note: "apps/web/src/components/profile/MyPageClient.tsx error alert div L91 에 `id=\"mypage-board-name-error\"` 추가 + 새 보드 이름 input L106-107 에 `aria-invalid={!!error && !newBoardName.trim()}` + `aria-describedby={error ? \"mypage-board-name-error\" : undefined}` 2 attribute 추가 (diff +3 -0). BoardActions L66/L81/L82 의 동일 패턴 정확 복제 — 보드 생성 실패 시(L47-50 createBoard catch → setError) error 메시지가 alert(role=\"alert\" aria-live=\"polite\") 로 announce 되고, input focus 시 SR(VoiceOver/NVDA) 가 invalid state + error 메시지 description 추가 발화. id 명명 `mypage-board-name-error` 는 BoardActions 의 `board-name-error` 와 충돌 회피용 컴포넌트 스코프 prefix. WAI-ARIA 1.2 aria-invalid + aria-describedby spec 충족. 시각/레이아웃/동작 변화 0 (id/aria-invalid/aria-describedby 모두 SR 전용 attribute, input 의 type/value/onChange/placeholder/aria-label/aria-required/maxLength/className/onKeyDown 모두 그대로). 인접 button(L116 생성 + L124 취소)·BoardSection BoardCover·ProfileHeader·ProfileEditForm·PinsGrid·NavBar 모두 영향 0. SR 사용자가 보드 생성 실패 후 input focus 시 '새 보드 이름, 텍스트 필드, 필수, invalid, <error 메시지>' 발화 — 컨벤션 라인업 3 → 4 (BoardActions + ProfileEditForm + PinCreateForm + MyPageClient). cycle 154 PR #362 FieldFilter open 유지. Ralph env 제약(node_modules/headless 도구 미설치)으로 step 7 실 브라우저 QA 는 grep + diff inspection으로 대체. CI Web (Next.js) + API (Go) 모두 SUCCESS. PR #378 머지 완료(2026-05-28)."

  - id: "design-20260528-a11y-pin-create-form-tag-category-filter-group-role-label-missing"
    title: "PinCreateForm 태그 카테고리 필터 wrapper 에 role=\"group\" + aria-label=\"태그 카테고리 필터\" 누락 — 핀 생성 폼 태그 picker 내 카테고리 N 옵션 (전체 + categories) 묶음에 group landmark 부재 · WAI-ARIA 1.2 group role + WCAG 2.1 SC 1.3.1 Info & Relationships Level A · cycle 158 PR #369 SearchClient 카테고리 탭 / cycle 154 PR #362 FieldFilter / cycle 156 PR #366 TagFilter / cycle 159 PR #371 SearchClient 인기 태그 정착 패턴의 인접 갭"
    area: a11y
    evidence:
      files:
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:575-603"
        - "apps/web/src/app/search/SearchClient.tsx:237-251"
        - "apps/web/src/components/feed/FieldFilter.tsx"
        - "apps/web/src/components/feed/TagFilter.tsx:44"
      cite: "WAI-ARIA 1.2 group role (https://www.w3.org/TR/wai-aria-1.2/#group): 'A set of user interface objects which is not intended to be included in a page summary or table of contents by assistive technologies.' WCAG 2.1 SC 1.3.1 Info & Relationships Level A: 'Information, structure, and relationships conveyed through presentation can be programmatically determined.' PinCreateForm.tsx L575-603 태그 카테고리 필터 wrapper div(`<div className=\"flex gap-1.5 overflow-x-auto mb-3 scrollbar-hide\">`)가 시각적으로 '전체' button(L576-587) + categories map button N개(L588-602)를 단일 categories 필터 그룹으로 묶지만 role/aria-label 둘 다 0. button 은 exclusive single-select (activeCategory state, button 의 aria-pressed={activeCategory === \"\"} L579 / aria-pressed={activeCategory === cat} L593) 패턴 — cycle 158 PR #369 SearchClient 카테고리 탭(L237-251 4 button + aria-pressed exclusive single-select + 직전 사이클 role=\"group\" 적용)과 정확 동일 패턴. SR(VoiceOver/NVDA) 사용자가 /pin/new 진입 → 태그 picker 영역의 tag 검색 input(L566 aria-label=\"태그 검색\") 다음 카테고리 button focus 시 '전체, button, pressed' 발화하나 어떤 그룹의 일부인지 context 0. 컨벤션 라인업 (4 컴포넌트, 모두 wrapper 단일 div 에 role=\"group\" + aria-label 추가): (a) FieldFilter cycle 154 PR #362, (b) TagFilter L44 cycle 156 PR #366, (c) SearchClient 카테고리 탭 L237 cycle 158 PR #369, (d) SearchClient 인기 태그 L260 cycle 159 PR #371 — PinCreateForm 태그 카테고리 필터만 외부. 보수적 선택 — `role=\"group\"` (cycle 158 의 4 button exclusive single-select 정확 동일 패턴 그대로 복제) vs `role=\"radiogroup\"` (후자는 inner button 을 role=\"radio\" + aria-checked 로 재선언 + keyboard arrow navigation + roving tabindex 까지 요구하는 큰 refactor — PinCreateForm 의 setActiveCategory 시그니처 재작성 + button JSX 재작성). aria-label `태그 카테고리 필터` 는 컴포넌트의 명시적 의미(태그 picker 내 카테고리 필터, TagCategory 타입) 직접 derive — FieldFilter '미디어 타입 필터' / TagFilter '태그 필터' / SearchClient '검색 카테고리' / '인기 태그' 와 동일 '<옵션 종류>' 명명 규칙. anti-patterns L15-L21 무매치 — 단일 attribute 추가, Tailwind 클래스 의미 덮어쓰기 0, JSX 구조 비변경."
      repro: "1) cd apps/web && npm run dev → 로그인 → /pin/new 진입 → 파일 업로드 → 태그 picker 영역 도달 → 태그 카테고리 필터 wrapper L575 의 button N개(전체 + categories) 표시. 2) VoiceOver/NVDA 로 button focus 시 '전체, button, pressed' 만 발화하고 그룹 context 0 (현재 wrapper L575 에 role=\"group\" 없음). 3) DevTools Elements 패널 → wrapper L575 div 에 role/aria-label 모두 missing 확인. 4) 비교: /search?q=<keyword> → 카테고리 탭(SearchClient L237 cycle 158 적용)에서 button focus 시 '검색 카테고리, group, 4 items, 전체, button, pressed' 발화. 5) `grep -nE 'role=\"group\"' apps/web/src/app/pin/new/PinCreateForm.tsx` 0 match — wrapper 부재 확인."
      qa_plan: "1) cd apps/web && npm run dev → /pin/new 진입 → 파일 업로드 + 제목 입력 후 태그 picker 영역 도달 → DevTools Elements 패널 → 카테고리 필터 wrapper L575 에 role=\"group\" 평가 (변경 전 0, 변경 후 \"group\") + aria-label 평가 (변경 전 0, 변경 후 \"태그 카테고리 필터\"). 2) VoiceOver/NVDA 로 카테고리 button focus → '태그 카테고리 필터, group, N items, 전체, button, pressed' 발화 확인. 3) `grep -nE 'role=\"group\"|aria-label=\"태그 카테고리 필터\"' apps/web/src/app/pin/new/PinCreateForm.tsx` 2 matches 확인. 4) `grep -rnE 'role=\"group\"' apps/web/src/ --include=\"*.tsx\" | wc -l` 변경 전 N → 변경 후 N+1 (PinCreateForm 합류). 5) wrapper div 의 className(flex gap-1.5 overflow-x-auto mb-3 scrollbar-hide)·button N개(전체 L576-587 + categories map L588-602)·activeCategory state·setActiveCategory·aria-pressed·onClick·className conditional bg-text-primary text-bg/bg-surface border text-text-muted 모두 미수정 → 시각/동작 변화 0. 6) 인접 영역(태그 검색 input L566 / selected tag chips L545-564 / filteredTags list L605+) 영향 0. 7) PinCreateForm 의 form handleSubmit/file upload/title input/description textarea/url input/OG preview/tag toggle 모두 미수정 → 동작 변화 0."
    impact: 1
