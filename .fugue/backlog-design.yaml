  - id: "design-20260528-a11y-profile-edit-form-avatar-url-autocomplete-photo-missing"
    title: "ProfileEditForm avatar URL input 에 autoComplete=\"photo\" 누락 — WCAG 2.1 SC 1.3.5 Identify Input Purpose Level AA · HTML autocomplete spec 4.10.18.7.2 'photo' token 직접 매칭 · cycle 138 자매 갭"
