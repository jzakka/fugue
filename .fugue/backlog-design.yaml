    qa_plan: "1) cd apps/web && npm run dev → 로그인 → /mypage → BoardSection → '+ 새 보드' button click. 2) DevTools 확인 → 인라인 폼 input(L98-112) 에 aria-required=\"true\" attribute 평가. 3) VoiceOver/NVDA 로 input focus → '새 보드 이름, 편집 텍스트, 필수' 발화 확인. 4) 시각 회귀 0 (aria-required 는 SR 전용 attribute, input styling/aria-label/maxLength/placeholder/onChange/onKeyDown/className 모두 그대로). 5) `grep -nE 'aria-required' apps/web/src/components/profile/MyPageClient.tsx` 1 match 확인 — 변경 전 0 → 변경 후 1. 6) `grep -rnE 'aria-required' apps/web/src/ --include=\"*.tsx\"` 5 matches(PinCreateForm L470 · ProfileEditForm L75 · BoardActions L80 · AddToBoardButton L367 · MyPageClient 신규) 확인 — 4 → 5. 7) handleCreate 동작 변경 0 (aria-required 는 SR 전용, native form validation popup 미작동, silent return 흐름 그대로). 8) BoardSection 의 showCreate toggle(L75)·error live region(L89-97)·취소 button(L122-131)·loadBoards/createBoard API·boards 렌더(L139-157)·EmptyState(L137) 모두 미수정. 9) MyPageClient 의 ProfileHeader/ProfileEditForm/PinsGrid·creator/editing state 모두 영향 0. 10) 인접 컴포넌트(PinCreateForm · ProfileEditForm · BoardActions · AddToBoardButton) 영향 0."
