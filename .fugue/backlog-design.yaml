      cite: "PinCard.tsx:71 `<div className=\"text-sm font-semibold truncate\">{pin.title}</div>` 에는 truncate 적용, 같은 부모 `<div className=\"flex-1 min-w-0\">` (L70) 의 sibling L72 `<div className=\"text-xs text-text-muted\">{pin.creator.nickname}</div>` 에는 overflow 처리 0. 같은 컴포넌트의 non-audio info section L184 `<span className=\"text-xs text-text-muted truncate\">{pin.creator.nickname}</span>` 는 truncate 일관 적용 — 카드 타입 간 비대칭. In-codebase nickname/유사 텍스트 truncate 5건(SearchBar.tsx:290 truncate / :324 truncate / :365 truncate · BoardGrid.tsx:26 truncate · PinCard.tsx:184 truncate) 모두 truncate. nickname 은 `creators.nickname VARCHAR(50)` cap(decision-log 2026-05-19) 이라 한국어 50 자 / Latin 50 자 모두 좁은 mobile masonry column(~340px-padding-아바타 = ~252px) 에서 text-xs 12px 폭으로 overflow 가능. DESIGN.md L83 'Audio card: 트랙 제목/아티스트' 명세에서 두 텍스트는 같은 시각적 무게로 카드 안에 단정히 표시되어야 함."
      repro: "1) cd apps/web && npm run dev. 2) DevTools → Toggle Device Toolbar → iPhone SE (375px width) 로 / 접속(audio 타입 핀이 있는 피드). 3) audio 타입 PinCard 의 AudioSection 내부 `flex-1 min-w-0` 컨테이너에서 title 은 한 줄로 잘려 ellipsis(`text-sm font-semibold truncate`) 표시되지만, 바로 아래 nickname(50 chars 한국어 또는 break-point 없는 Latin) 은 (a) 줄 바꿈 발생 시 카드 높이가 비대칭으로 늘어남, (b) 단일 단어 nickname(break-point 부재) 일 경우 부모 컨테이너를 가로 overflow → masonry column 폭 침범 가능. 4) 처리: L72 className 끝에 ` truncate` 1 utility 추가(`text-xs text-text-muted truncate`). diff +1 -1 단일 className. 같은 부모 L70 이미 `flex-1 min-w-0` 라 truncate 가 정상 작동(text-overflow:ellipsis + overflow:hidden + whitespace:nowrap)."
