  - id: "design-20260522-a11y-layout-main-skip-link-missing"
    title: "RootLayout 에 skip link anchor 부재 + 모든 page <main> 요소에 id 부재 — 키보드 사용자가 NavBar 다중 컨트롤(SearchBar input + 검색 dropdown rows + ThemeToggle + LoginButton/LogoutButton) 을 매 페이지 진입마다 Tab 통과해야 main content 도달(WCAG 2.1 SC 2.4.1 Bypass Blocks Level A)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/app/layout.tsx:14-32"
        - "apps/web/src/app/page.tsx:86"
