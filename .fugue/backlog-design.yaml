  - id: "design-20260528-a11y-profile-edit-form-nickname-aria-required-missing"
    title: "ProfileEditForm 닉네임 input 에 aria-required=\"true\" 누락 — PinCreateForm 컨벤션(L470) 정렬 갭 · WCAG 4.1.2 Name/Role/Value Level A · WAI-ARIA 1.2 required state"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/profile/ProfileEditForm.tsx:68-78"
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:463-474"
      cite: "WCAG 2.1 SC 4.1.2 Name/Role/Value Level A (https://www.w3.org/WAI/WCAG21/Understanding/name-role-value) — 'For all user interface components ... the name and role can be programmatically determined; states, properties, and values that can be set by the user can be programmatically set; and notification of changes to these items is available to user agents, including assistive technologies.' required 는 ARIA 1.2 (https://www.w3.org/TR/wai-aria-1.2/#aria-required) widget attribute state: 'Indicates that user input is required on the element before a form may be submitted.' ProfileEditForm.tsx handleSubmit L25-29 `const trimmed = nickname.trim(); if (!trimmed) { setError(\"닉네임을 입력해주세요\"); return; }` — 빈 닉네임 disallow 명시적 의도 100%, but input(L68-78)에 aria-required/required 둘 다 0. SR(VoiceOver/NVDA) 사용자가 닉네임 input focus 시 'edit text' 만 발화 받고 'required' 발화 받지 못함. PinCreateForm.tsx L463-474 title input 은 동일 구조(빈 입력 disallow + setError pattern)에서 `aria-required=\"true\"`(L470) + `aria-invalid={!!error && !title.trim()}`(L471) + `aria-describedby`(L472) + label 끝 `<span className=\"text-error\" aria-hidden=\"true\">*</span>`(L461) 4 요소 컨벤션 정착. ProfileEditForm nickname input 은 aria-invalid(L75, cycle 138 cohort) + aria-describedby(L76, cycle 138 cohort) 만 보유, aria-required + label asterisk 2/4 누락 — 컨벤션 부분 정렬. 본 사이클은 가장 보수적인 단일 attribute(aria-required) 만 추가 — label visual asterisk 는 시각 변경(작은 빨간 *)이라 별도 사이클로 분리(anti-patterns L16 정신 — 시각/a11y 두 작업 분리). in-codebase aria-required 라인업: `grep -rnE 'aria-required' apps/web/src/ --include=\"*.tsx\"` 1 match(PinCreateForm.tsx L470) — 본 사이클 추가 시 1 → 2. `required` HTML attribute 가 아닌 `aria-required` 를 선택한 이유는 PinCreateForm 컨벤션 매칭 + native form validation 안 켬으로 handleSubmit 의 client-side trim validation 과 충돌 없음(native required 켜면 browser default validation popup 트리거되어 setError-based error UI 와 동작 중복/충돌 가능성). 안티패턴 L15-L21 무매치 — 단일 attribute 추가(diff +1 -0), Tailwind 기본 클래스 의미 덮어쓰기 없음, JSX 구조 비변경, radius/Card System/EmptyState/brea