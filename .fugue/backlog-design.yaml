# Fugue 디자인 트랙 백로그
#
# 루프(`prompts/loop-design.md`)가 발견 모드에서 채우고 처리 모드에서 비운다.
# 사람이 직접 편집해도 된다. status를 `skip`으로 바꾸면 루프가 영구 스킵한다.
#
# 스키마:
#   id:         "design-<yyyymmdd>-<short>"  발견 시 자동 부여
#   title:      한 줄 요약
#   area:       tokens | states | responsive | a11y | aesthetic
#   evidence:
#     files:    ["apps/web/path/to/file.tsx:LSTART-LEND", ...]
#     cite:     "DESIGN.md L?? — 인용 문장"
#     repro:    (선택) 재현 절차
#   impact:     1..5  사용자 체감 시각/기능 영향
#   confidence: 1..5  "진짜 이슈"의 확신도 (< 3 이면 자동 폐기)
#   effort:    1..5  수정에 드는 변경 폭
#   risk:       1..5  다른 화면·컴포넌트 회귀 위험
#   score:      impact * confidence / (effort * risk)   자동 계산
#   status:     pending | in_progress | done | rejected_self | rejected_impl | needs_decision | skip
#   note:       (선택) 자유 메모

items:
  - id: "design-20260515-general-sans-not-loaded"
    title: "General Sans 폰트가 로드되지 않아 디스플레이/히어로 타이포가 시스템 sans-serif로 폴백된다"
    area: tokens
    evidence:
      files:
        - "apps/web/src/app/layout.tsx:14-25"
        - "apps/web/src/app/pins/[id]/page.tsx:140"
        - "apps/web/src/app/pins/[id]/page.tsx:258"
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:316"
        - "apps/web/src/app/search/SearchClient.tsx:233"
        - "apps/web/src/app/boards/[id]/page.tsx:57"
        - "apps/web/src/components/board/BoardGrid.tsx:16"
        - "apps/web/src/components/board/AddToBoardButton.tsx:208"
        - "apps/web/src/components/profile/MyPageClient.tsx:68"
      cite: "DESIGN.md L17 — 'Display/Hero: General Sans 700 — 기하학적이면서 개성 있음.' / L22-25 폰트 로딩 명세에 General Sans 포함"
      repro: "어느 페이지든 General Sans inline 스타일이 걸린 헤딩 요소를 DevTools Computed Font로 검사하면 'General Sans'가 아닌 시스템 sans-serif가 사용되고 있음을 확인할 수 있다 (layout.tsx에서 General Sans CSS를 로드하지 않기 때문)."
    impact: 5
    confidence: 5
    effort: 1
    risk: 1
    score: 25.0
    status: done
    note: "2026-05-15 처리 완료. Fontshare CDN으로 500/700 weight 로드. OpenSpec change: archive/2026-05-15-load-general-sans-font."
  - id: "design-20260515-semantic-hex-literal"
    title: "AddToBoardButton 피드백 박스가 semantic 토큰 대신 raw hex(#34C759 / #FF3B30)를 사용한다"
    area: tokens
    evidence:
      files:
        - "apps/web/src/components/board/AddToBoardButton.tsx:235-239"
      cite: "DESIGN.md L50 — 'Semantic: success #34C759, warning #FFB800, error #FF3B30, info #5AC8FA' (토큰으로 명시). globals.css L19-22, L49-51에서 --color-success/--color-error를 @theme inline으로 노출 중이라 `bg-success`, `text-error` 등 토큰 클래스가 이미 사용 가능."
      repro: "AddToBoardButton에서 보드에 핀 추가 후 노출되는 피드백 박스 코드 인스펙트."
    impact: 2
    confidence: 4
    effort: 1
    risk: 1
    score: 8.0
    status: done
    note: "2026-05-15 처리 완료. OpenSpec change: archive/2026-05-15-replace-semantic-hex-with-tokens."
  - id: "design-20260515-avatar-gradient-orange-400"
    title: "아바타 폴백 그라디언트가 토큰 외 색(`orange-400`, `#FF8A5C`)을 사용한다"
    area: tokens
    evidence:
      files:
        - "apps/web/src/components/nav/NavBar.tsx:46"
        - "apps/web/src/components/feed/PinCard.tsx:168-172"
        - "apps/web/src/components/profile/ProfileHeader.tsx:24"
        - "apps/web/src/components/nav/SearchBar.tsx:322"
        - "apps/web/src/app/pins/[id]/page.tsx:214"
        - "apps/web/src/app/search/SearchClient.tsx:325"
      cite: "DESIGN.md L37-49 — 색 팔레트 명시. accent 계열은 #E85A2A / #FF6B3D / accent-subtle 세 가지로 한정. Tailwind 기본 orange-400(#FB923C) 및 #FF8A5C는 정의된 토큰 어디에도 없음. L38 'Restrained — 액센트는 사용자 액션에만 써서 작품과 경쟁하지 않는다' 위반(아바타 폴백은 사용자 액션 아님)."
    impact: 3
    confidence: 4
    effort: 2
    risk: 2
    score: 3.0
    status: done
    note: "2026-05-15 처리 완료. 6개 위치 모두 to-accent-hover 토큰으로 통일. PinCard inline style은 className으로 일관화. OpenSpec change: archive/2026-05-15-unify-avatar-gradient-tokens."
  - id: "design-20260515-typography-scale-unmapped"
    title: "타이포그래피 스케일이 @theme에 미정의되어 컴포넌트가 Tailwind 기본값(text-sm=14px)을 그대로 사용한다"
    area: tokens
    evidence:
      files:
        - "apps/web/src/app/globals.css:38-54"
        - "apps/web/src/components/feed/PinCard.tsx:152"
        - "apps/web/src/components/feed/EmptyState.tsx:11"
        - "apps/web/src/components/nav/NavBar.tsx:32"
        - "apps/web/src/components/nav/NavBar.tsx:48"
      cite: "DESIGN.md L26-35 — 타이포 스케일 명시: '3xl: 42px / 2xl: 32px / xl: 24px / lg: 18px / md: 15px / sm: 13px / xs: 12px / 2xs: 11px / 3xs: 10px'. globals.css의 @theme inline에 --text-* 토큰이 전혀 정의되지 않아 Tailwind v4 기본(sm=14px, base=16px)이 그대로 적용됨."
    impact: 4
    confidence: 4
    effort: 3
    risk: 3
    score: 1.78
    status: rejected_self
    note: "2026-05-15 처리 시도 → rejected_self. 측정 결과 충돌 사용처 84건+ (text-sm 74, text-3xl 5, text-xl 2, text-base 3). 자동 머지 시 시각 회귀 위험이 발견 단계 risk=3 추정을 초과(실제 ≥5). effort 추정도 ≥2x 부정확. 발견 단계에서 '토큰 추가'와 '기존 클래스 의미 덮어쓰기'를 분리해 재발견 필요."
  - id: "design-20260515-board-card-no-hover"
    title: "BoardGrid 카드 아이템에 DESIGN.md 명시 카드 hover state(translateY/box-shadow/accent border)가 없다"
    area: states
    evidence:
      files:
        - "apps/web/src/components/board/BoardGrid.tsx:22-39"
        - "apps/web/src/components/feed/PinCard.tsx:142"
      cite: "DESIGN.md L86 — 'Hover state: translateY(-2px) + box-shadow 확대 + accent border. 150ms ease.' (Card System 섹션). Board는 BoardCover가 카드 외형(L73 'rounded-[10px]'의 정사각형 그리드 카드)을 가진 동일한 카드 단위. PinCard.tsx:142가 동일 스펙을 이미 구현."
      repro: "보드 목록 페이지에서 보드 카드에 마우스를 올리면 hover시 텍스트 색만 accent로 바뀌고 카드 자체는 위로 뜨거나 그림자가 확대되거나 accent border가 그려지지 않는다. PinCard와 비교."
    impact: 3
    confidence: 4
    effort: 1
    risk: 1
    score: 12.0
    status: done
    note: "2026-05-15 처리 완료. BoardCover 두 분기에 group-hover:border-accent + shadow + transition-all duration-200 추가, BoardGrid·MyPageClient의 Link에 hover:-translate-y-0.5 추가. OpenSpec change: archive/2026-05-15-add-board-card-hover-state."
  - id: "design-20260515-skeleton-pulse-not-shimmer"
    title: "스켈레톤 로딩이 shimmer가 아닌 animate-pulse(opacity 점멸)로 구현되어 있다"
    area: states
    evidence:
      files:
        - "apps/web/src/components/feed/CardSkeleton.tsx:3"
        - "apps/web/src/components/profile/ProfileSkeleton.tsx:3"
      cite: "DESIGN.md L94 — 'Skeleton loading: 카드 자리에 shimmer 효과'. Tailwind `animate-pulse`는 opacity 점멸 애니메이션이며 shimmer(슬라이딩 그라디언트 하이라이트)와 시각적으로 구분되는 별개 패턴."
      repro: "피드/마이페이지 진입 직후 또는 슬로 네트워크에서 카드 자리 점멸이 확인됨. shimmer 슬라이드 효과는 없음."
    impact: 3
    confidence: 4
    effort: 2
    risk: 2
    score: 3.0
    status: done
    note: "2026-05-15 처리 완료. globals.css에 --shimmer-highlight 토큰(dark/light) + @keyframes + .skeleton-shimmer 자식 셀렉터 추가. CardSkeleton/ProfileSkeleton 외곽 div의 animate-pulse → skeleton-shimmer. OpenSpec change: archive/2026-05-15-replace-skeleton-pulse-with-shimmer."
    note: "토큰만 추가하고 기존 클래스명을 유지하면 디자인 의도에 맞춰 자동 정렬되지만, 모든 화면의 글자 크기가 1~2px 변하므로 회귀 위험. 처리 시 시각 회귀 스냅샷 확보 권장."
  - id: "design-20260515-empty-state-mascot-inconsistent"
    title: "빈 상태(empty state)가 컴포넌트별로 마스코트 활용에서 일관되지 않음"
    area: states
    evidence:
      files:
        - "apps/web/src/components/feed/EmptyState.tsx:9-21"
        - "apps/web/src/app/search/SearchClient.tsx:407-415"
        - "apps/web/src/components/profile/PinsGrid.tsx:121-124"
        - "apps/web/src/components/profile/MyPageClient.tsx:123-126"
        - "apps/web/src/components/board/AddToBoardButton.tsx:251-254"
        - "apps/web/src/app/boards/[id]/page.tsx:99-119"
      cite: "DESIGN.md L14 — '마스코트: 헤드셋 끼고 붓 든 복어 (Fugue ≈ Fugu). 로고/빈 상태/온보딩에서 활용.' 빈 상태 6곳 중 2곳(EmptyState/SearchClient)만 🐡 이모지를 시도하고, 3곳(PinsGrid/MyPageClient/AddToBoardButton)은 텍스트만, 1곳(boards/[id])은 grid SVG 아이콘을 마스코트 자리에 사용. 메시지 사이즈도 sm/lg 혼재."
      repro: "feed/search/profile/board 페이지를 빈 상태로 진입(예: 보드 미생성 계정의 마이페이지)하면 페이지마다 빈 상태 시각 요소가 다름."
    impact: 3
    confidence: 4
    effort: 3
    risk: 2
    score: 2.0
    status: done
    note: "2026-05-15 처리 완료. EmptyState를 props 기반 공통 컴포넌트로 일반화(🐡 + sm 메시지 + xs 부연 + 액션 children). 6곳 빈 상태 마크업을 <EmptyState> 사용으로 교체. boards[id] grid SVG는 마스코트로 대체. OpenSpec change: archive/2026-05-15-unify-empty-state-with-mascot."
  - id: "design-20260515-video-trim-modal-radius"
    title: "VideoTrimModal 모달 컨테이너가 rounded-[12px]로 DESIGN.md modal radius(16px) 위반"
    area: tokens
    evidence:
      files:
        - "apps/web/src/components/pin/VideoTrimModal.tsx:121"
      cite: "DESIGN.md L73-77 — 'Border radius: sm: 6px (inputs, alerts) / md: 10px (cards) / lg: 16px (modals, panels) / full: 9999px'. AddToBoardButton.tsx:203의 모달 패널이 rounded-[16px]로 동일 스펙을 따르고 있어 비교 가능."
      repro: "비디오 핀 업로드 시 노출되는 트림 모달 외곽 모서리가 다른 모달(보드에 추가, 프로필 편집 등)보다 살짝 더 각짐."
    impact: 2
    confidence: 5
    effort: 1
    risk: 1
    score: 10.0
    status: done
    note: "2026-05-15 처리 완료. VideoTrimModal.tsx:121 rounded-[12px] → rounded-[16px]. OpenSpec change: archive/2026-05-15-fix-video-trim-modal-radius."
  - id: "design-20260515-login-logo-radius-non-spec"
    title: "로그인 페이지 로고 박스가 rounded-xl(12px)로 DESIGN.md radius scale 외 값 사용"
    area: tokens
    evidence:
      files:
        - "apps/web/src/app/login/page.tsx:38"
      cite: "DESIGN.md L73-77 — radius scale은 sm:6px / md:10px / lg:16px / full 네 단계로 한정. Tailwind 기본 rounded-xl(12px)은 스펙 어디에도 없음. 동일 페이지 L35의 로그인 카드는 rounded-2xl(16px)로 modal/panel 16px와 매칭되지만, L38의 64px 로고 박스만 12px로 어긋남."
      repro: "/login 진입 시 가운데 카드 안의 🐡 로고 박스 모서리가 카드 자체(16px)와 일관되지 않음."
    impact: 2
    confidence: 4
    effort: 1
    risk: 1
    score: 8.0
    status: rejected_self
    note: "2026-05-15 자체 리뷰에서 rejected_self. DESIGN.md L73-77은 radius scale 네 등급(sm/md/lg/full)을 명시하지만 64×64 마스코트 로고 박스가 어느 등급(card 10px / panel 16px / avatar full)에 속하는지 직접 명시하지 않음. 단일 라인 교체에서 등급 선택이 자의적 해석이 되어 reject 조건 #2 해당. 후속: '로고/아이콘 박스 radius 등급 매핑'을 DESIGN.md에 추가하거나 사용자 결정 후 재발견 필요."
  - id: "design-20260515-masonry-columns-off-by-one"
    title: "MasonryGrid 컬럼 매핑이 DESIGN.md L70(4/3/2/1) 명세와 어긋남 — small mobile에서 2 column, tablet에서 4 column"
    area: responsive
    evidence:
      files:
        - "apps/web/src/components/feed/MasonryGrid.tsx:6-11"
      cite: "DESIGN.md L67-70 — 'Approach: Masonry grid', 'Grid: 4 columns (desktop), 3 (tablet), 2 (mobile), 1 (small mobile)', 'Breakpoints: sm: 500px, md: 800px, lg: 1200px'. react-masonry-css의 breakpointCols 키는 max-width 임계이므로 `1200: 4`는 viewport≤1200에서 4 columns 유지를 의미 → tablet(800~1199)에서 3이 아닌 4 columns. `500: 2`는 small mobile(<500)에서도 2 columns → 1 columns 명세 위반."
      repro: "Chrome DevTools에서 viewport를 900px(tablet)·400px(small mobile)로 설정하고 피드 페이지(/) 열기. 명세는 각각 3·1 column, 실제는 4·2 column."
    impact: 4
    confidence: 5
    effort: 1
    risk: 1
    score: 20.0
    status: done
    note: "2026-05-15 처리 완료. BREAKPOINT_COLUMNS를 default:4/1199:3/799:2/499:1로 교체. react-masonry-css의 max-width inclusive 키 의미에 맞춰 -1 offset 사용. OpenSpec change: archive/2026-05-15-fix-masonry-columns-mapping."
  - id: "design-20260515-pin-duration-display-missing"
    title: "Audio/Video 카드에 재생시간/길이 표시 누락 — Pin 타입에 duration 필드 부재"
    area: aesthetic
    evidence:
      files:
        - "apps/web/src/components/feed/PinCard.tsx:57-75"
        - "apps/web/src/components/feed/PinCard.tsx:77-102"
        - "apps/web/src/lib/api.ts"
      cite: "DESIGN.md L83 — 'Audio card: 웨이브폼 시각화 + 미묘한 그라디언트 배경 + 재생 버튼 + 트랙 제목/아티스트 + 재생시간.' L85 — 'Video card: 썸네일 + 재생 아이콘 오버레이 + 길이 표시.' 현재 PinCard의 AudioSection/VideoSection은 재생시간/길이를 표시하지 않으며, apps/web/src/lib/api.ts의 Pin 타입에 duration 필드 자체가 없다(grep 결과 0건)."
      repro: "오디오/비디오 핀이 포함된 피드를 보면 카드에 재생시간 정보가 없음. PinDetailPage에서도 동일."
    impact: 3
    confidence: 5
    effort: 4
    risk: 2
    score: 1.875
    status: needs_decision
    note: "디자인 트랙 단독 처리 불가. 처리하려면 apps/api 영역에서 (1) Pin 모델에 duration 필드 추가, (2) 비디오/오디오 harvester가 ffprobe 등으로 duration 측정·저장, (3) Pin DTO 응답에 포함이 선행되어야 함. 디자인 루프 경계(apps/web 한정) 위반이라 사용자 결정 또는 백엔드 변경 후 재발견 대상."
  - id: "design-20260515-search-dropdown-keyboard-inaccessible"
    title: "SearchBar 드롭다운 결과 4종(recent/pin/creator/board)이 div onClick으로 키보드 접근 불가"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/nav/SearchBar.tsx:185-191"
        - "apps/web/src/components/nav/SearchBar.tsx:254-261"
        - "apps/web/src/components/nav/SearchBar.tsx:306-313"
        - "apps/web/src/components/nav/SearchBar.tsx:336-343"
      cite: "루프 정체성(prompts/loop-design.md L7) — 'apps/web/ 안의 UI/UX, 디자인 시스템 일관성, 타이포그래피, 색/여백, 인터랙션, 접근성, 빈 상태, 에러 표시만 본다' → 접근성 명시. HTML/WAI-ARIA 표준상 인터랙티브 콘텐츠는 button/a로 마크업해야 키보드 Tab 도달과 스크린리더 시맨틱이 가능. 같은 파일 L212-229는 삭제 버튼을 정상적으로 button으로 마크업하고 있어 부분적으로만 적용된 패턴."
      repro: "헤더 검색창에 포커스 → 검색어 입력 → Tab 키로 드롭다운 결과 아이템 도달 시도. 입력 필드 다음으로 도달 가능한 인터랙티브 요소가 없어 결과를 키보드로 활성화 불가."
    impact: 4
    confidence: 4
    effort: 2
    risk: 2
