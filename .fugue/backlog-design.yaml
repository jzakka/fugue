  - id: "design-20260526-a11y-search-page-empty-h1-missing"
    title: "/search 페이지 query 비어있을 때 EmptyState 단독 렌더로 h1 누락 — SR 페이지 진입/구조 인지 0(WCAG 2.1 SC 1.3.1 Info & Relationships Level A · SC 2.4.6 Headings & Labels Level AA · in-codebase sr-only h1 패턴)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/app/search/page.tsx:58-80"
      cite: "WCAG 2.1 SC 1.3.1 Info and Relationships (Level A) — 'Information, structure, and relationships conveyed through presentation can be programmatically determined or are available in text.' WCAG 2.1 SC 2.4.6 Headings and Labels (Level AA) — 'Headings and labels describe topic or purpose.' /search/page.tsx L58-80 의 `<main>` 직속 children 분기: `q` 가 truthy 면 `<SearchClient>` 가 L232 에서 `<h1>\"{query}\" 검색 결과</h1>` 를 렌더해 페이지 단위 h1 충족. 그러나 `q` 가 falsy(비어있거나 미지정)일 때 L73-76 `<EmptyState message=\"검색어를 입력해주세요\" description=\"작품, 크리에이터, 보드를 검색할 수 있습니다\" />` 만 렌더 — EmptyState 컴포넌트(`apps/web/src/components/feed/EmptyState.tsx` L14-23)는 `<div> + <div aria-hidden> + <p> + <p>` 로 구성되어 h1/h2/h3 없음. 결과적으로 /search?q= 또는 /search 진입 시 페이지에 h1 0개 → SR 사용자가 페이지를 'Search' 페이지로 식별 불가, heading 네비게이션(VoiceOver Rotor 'Headings'·NVDA H 단축키)에서 페이지 식별 0. in-codebase 같은 패턴 선례 확립: 홈 `/page.tsx` L86-87 `<main id=\"main\"><h1 className=\"sr-only\">작품 피드</h1>...</main>` — 시각 회귀 0의 sr-only h1 로 페이지 단위 heading 보강. 그 외 모든 페이지(`/login`·`/pins/[id]`·`/boards/[id]`·`/mypage`(ProfileHeader)·`/creators/[id]`(ProfileHeader)·`/pin/new`(PinCreateForm)·`/search?q=...`(SearchClient)) 는 h1 보유. /search 의 empty-state 분기만 누락. 안티패턴 L15-L21 무매치 — 토큰 비변경(sr-only 는 globals.css Tailwind utility), 공개 컴포넌트 API 비변경(EmptyState 미수정), JSX 구조 미수정(EmptyState 위 sr-only h1 1줄 추가만, diff +1 -0)."
