  - id: "design-20260528-a11y-mypage-board-create-disclosure-aria-expanded-missing"
    title: "MyPageClient '+ 새 보드' button 이 showCreate 토글로 form 표시/숨김을 수행하나 aria-expanded/aria-controls 미보유 — 키보드/SR 사용자가 disclosure 상태 인지 불가(WAI-ARIA Authoring Practices 1.2 Disclosure Pattern · WCAG 2.1 SC 4.1.2 Name/Role/Value Level A)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/profile/MyPageClient.tsx:74-79"
        - "apps/web/src/components/profile/MyPageClient.tsx:82-129"
      cite: "WAI-ARIA Authoring Practices 1.2 Disclosure (Show/Hide) Pattern (https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/) — 'The element that shows and hides the content has role button. When the content is visible, the element with role button has aria-expanded set to true. When the content area is hidden, it is set to false. Optionally, the element with role button has a value specified for aria-controls that refers to the element that contains all the content that is shown or hidden.' + WCAG 2.1 SC 4.1.2 Name/Role/Value (Level A) — 'For all user interface components ... states, properties, and values that can be set by the user can be programmatically set; and notification of changes to these items is available to user agents, including assistive technologies.' MyPageClient.tsx L74-79 '+ 새 보드' button(`onClick={() => setShowCreate((prev) => !prev)}`)이 L82-129 의 보드 생성 form `{showCreate && (...)}` 조건부 render 를 토글하는 disclosure pattern 이나 aria-expanded/aria-controls attribute 0. 키보드 사용자는 button focus 후 Enter/Space 로 form open/close 하나 SR(VoiceOver/NVDA) 발화에서 button 의 expanded/collapsed 상태 announce 없음 — '버튼 더하기 새 보드'(NVDA) 또는 '+ 새 보드, 버튼'(VoiceOver) 으로만 발화되어 form 이 펼쳐졌는지 접혔는지 사용자가 SR 발화로 인지 불가. 코드베이스 aria-expanded 라인업: 0 matches (`grep -rnE 'aria-expanded' apps/web/src/ --include=\"*.tsx\"` 0건) — disclosure 패턴 첫 도입 후보. 인접 disclosure 패턴(AddToBoardButton.tsx L399 '+ 새 보드 만들기' 동일 setShowCreate · PinCreateForm.tsx L33 setShowTrimModal · SearchBar.tsx L39 setOpen)은 별도 사이클로 처리(modal 또는 dropdown 패턴이라 disclosure 와 별개 ARIA pattern). 본 후보는 MyPageClient.tsx 단독 컴포넌트(`/mypage` 의 BoardSection) 범위 — 단일 파일 단일 button + 단일 form div id 추가(diff ~3 lines). 안티패턴 L15-L21 무매치 — JSX 구조 비변경(button + form mount 그대로), Tailwind 기본 클래스 의미 덮어쓰기 없음, radius/Card System/EmptyState/breakpoint/DESIGN.md 내부 모순과 무관."
      repro: "1) cd apps/web && npm run dev → 로그인 → /mypage 진입. 2) BoardSection 의 보드 헤더 '보드' h2 옆 '+ 새 보드' button (L74-79) 키보드 Tab 으로 focus. 3) Enter → showCreate=true → L82-129 form div 가 button 아래에 mount(시각으로 펼쳐짐 확인). 4) SR(VoiceOver Cmd+F5 또는 NVDA) 활성화 → 동일 button 에 focus → '+ 새 보드, 버튼' 으로만 발화 — 'expanded'/'collapsed' announce 0. 5) form open 상태에서 button 에 재 focus → 발화 변화 0(여전히 '+ 새 보드, 버튼' 만). 6) form close 후(setShowCreate(false), L46/119) button 에 focus → 동일 발화. 7) 비교 검증: VoiceOver Rotor 'Form Controls' 항목에서 button 상태(expanded/collapsed) 정보 없음."
    qa_plan: "1) cd apps/web && npm run dev → 로그인 → /mypage 진입. 2) '+ 새 보드' button (L74-79) DevTools 인스펙트 → aria-expanded 가 showCreate state 와 동기화되어 false/true 로 평가되는지 확인. 3) aria-controls 가 form div 의 id(예: 'mypage-board-create-form') 와 일치하는지 확인. 4) 버튼 클릭 → showCreate=true → aria-expanded=\"true\" + form div(id 매칭) mount. 5) 다시 클릭 → showCreate=false → aria-expanded=\"false\" + form unmount. 6) 시각 회귀 0(aria-expanded/aria-controls/id 는 SR/접근성 전용 attribute, button styling · form styling · layout 모두 그대로). 7) `grep -nE 'aria-expanded' apps/web/src/components/profile/MyPageClient.tsx` 1+ match(L75 button) 확인. 8) `grep -nE 'aria-controls|id=\"mypage-board-create' apps/web/src/components/profile/MyPageClient.tsx` 2 matches(button aria-controls + form div id) 확인. 9) BoardSection 의 loading 분기(L56-65)·boards 빈 분기(L131-132)·boards 렌더 분기(L134-153) 모두 영향 0(disclosure 와 무관). 10) MyPageClient root component(L158-198) editing/ProfileEditForm/PinsGrid 영향 0."
