  - id: "design-20260522-a11y-searchbar-recent-search-row-keyboard-focus-parity"
    title: "SearchBar 최근 검색 row 의 hover 시각 표시 가 키보드 focus parity 누락 — 마우스 hover 시 row 배경 변경 + 삭제 버튼 노출 되지만 키보드 Tab 으로 행 내부 버튼 진입 시 row 무반응(WCAG 2.1 SC 2.4.7 Focus Visible Level AA · 디자인 시스템 hover/focus parity)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/nav/SearchBar.tsx:188-241"
      cite: "WCAG 2.1 SC 2.4.7 Focus Visible (Level AA) — 'Any keyboard operable user interface has a mode of operation where the keyboard focus indicator is visible.' 브라우저 default outline 으로 button 자체 focus 는 시각 표시되나 디자인 시스템이 row 단위 hover 반응(`hover:bg-surface-hover`)을 명시한 컨텍스트에서 키보드 사용자는 동일한 row-level 시각 피드백 부재. 디자인 시스템 정합성 in-codebase precedent: cycle 11 PR #36(PinCreateForm dropzone `hover:border-accent focus-visible:border-accent` 페어) + 5+ 컴포넌트(PinCard L147 / SearchClient L315+L353 / BoardGrid L22 / MyPageClient L138 / BoardCover L6+L31 / pins/[id]/page.tsx L205/L208/L210) 모두 `hover:* focus-visible:*`(또는 `group-hover:* group-focus-visible:*`) 페어 패턴 확립. SearchBar.tsx 본 row 만 페어 누락. L190 outer div 는 `hover:bg-surface-hover group transition-colors` — div 자체는 focusable 아님이라 `focus-visible:` 대신 `focus-within:` 으로 자손 focus 시 부모 반응 유도가 표준 CSS 패턴. L223 delete button 은 `opacity-0 group-hover:opacity-100 focus-visible:opacity-100` — group-hover 와 focus-visible 페어가 자기-포커스에만 반응(자식 button select L192 가 focus 시 delete 미노출)이라 마우스 'row 어디든 hover → delete 노출' 와 비대칭. `group-focus-within:opacity-100` 추가 시 select button 키보드 focus 만으로도 delete 노출. 안티패턴 L15-L21 무매치 — 토큰 비변경, 공개 컴포넌트 API 비변경, JSX 구조 미수정, 2 utility 추가만(L190 `focus-within:bg-surface-hover` + L223 `group-focus-within:opacity-100`, diff +2)."
      repro: "1) cd apps/web && npm run dev. 2) 검색창 focus 후 최근 검색 row 가 1개 이상 표시되는 상태. 3) (마우스) 최근 검색 row 위 hover → row 배경이 `bg-surface-hover`로 변경 + 우측 X 삭제 button(L219-239) opacity 0→100 노출. 4) (키보드) Tab 으로 검색창 input → recent search row 의 select button(L192-218) 진입 → row 배경 무변경 + 삭제 button opacity 0 유지 → row 가 인터랙티브 한지 + 삭제 가능한지 키보드 사용자에게 시각 피드백 부재. 5) Tab 한 번 더 → delete button focus → `focus-visible:opacity-100` 발화로 그 자체만 노출. 6) `grep -rn 'focus-within' apps/web/src/components/nav/SearchBar.tsx` 0 matches."
    qa_plan: "1) cd apps/web && npm run dev. 2) 검색창 focus → 최근 검색 1개 이상 표시되는 상태(이전 검색 기록 필요). 3) Tab 으로 recent search select button focus → row 배경 `bg-surface-hover` 적용 확인 + delete button opacity 100 노출 확인. 4) Shift+Tab 으로 input 복귀 → row 배경 원복 + delete button 숨김(opacity-0). 5) 마우스 hover 시 동작 회귀 0(기존 `hover:bg-surface-hover` + `group-hover:opacity-100` 그대로). 6) 인접 search results section(L246+) · 빈 결과 placeholder · 카테고리 분기 무영향. 7) 시각 변화는 키보드 focus 시 row reaction 추가 만(마우스 사용자 변화 0)."
    impact: 2
    confidence: 4
    effort: 1
    risk: 1
    score: 8.0
    status: done
    pr: 263
    note: "SearchBar.tsx L190 outer div(`hover:bg-surface-hover` 뒤) + L223 delete button(`group-hover:opacity-100` 와 `focus-visible:opacity-100` 사이)에 `focus-within:bg-surface-hover` + `group-focus-within:opacity-100` 각 1 utility 추가(diff +2 utilities, +2 -2 lines). 5+ 컴포넌트(cycle 11 PR #36 PinCreateForm dropzone · PinCard L147 · SearchClient L315/L353 · BoardGrid L22 · MyPageClient L138 · BoardCover L6/L31 · pins/[id]/page.tsx L205/L208/L210) hover/focus 페어 라인업 정합. WCAG 2.1 SC 2.4.7 Focus Visible (Level AA) 충족. 토큰/공개 컴포넌트 API 비변경, JSX 구조 미수정. 마우스 hover 동작 회귀 0(기존 `hover:bg-surface-hover` + `group-hover:opacity-100` 그대로). 키보드 Tab 으로 select button focus 시 row 배경 변경 + delete button 노출 — focus-visible 기존 단독 페어가 select button 자기-포커스만 커버하던 제약 해소. Ralph env 제약(node_modules/headless 도구 미설치)으로 step 7 실 브라우저 QA 는 grep verification(`grep -nE 'focus-within|group-focus-within' apps/web/src/components/nav/SearchBar.tsx` L190/L223 2 matches)으로 대체."

