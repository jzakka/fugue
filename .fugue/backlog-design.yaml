  - id: "design-20260522-a11y-pincreateform-title-aria-invalid-describedby-missing"
    title: "PinCreateForm 제목 input 이 `aria-invalid`/`aria-describedby` 부재 — 빈 제목 제출 시 SR 사용자가 form-level role=alert 만 듣고 어느 필드가 invalid 인지 인지 0건(WCAG 2.1 SC 3.3.1 Error Identification Level A)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:251-326,446-461"
      cite: "WCAG 2.1 SC 3.3.1 Error Identification (Level A) — 'If an input error is automatically detected, the item that is in error is identified and the error is described to the user in text.' WAI-ARIA 1.2 §6.6.5 `aria-invalid` — 'Indicates the entered value does not conform to the format expected by the application' / §6.6.1 `aria-describedby` — 'Identifies the element (or elements) that describes the object'. PinCreateForm L254 setError('제목을 입력해주세요') 가 form-level error region L318-326 (role=alert + aria-live=polite) 로 announce 되지만, L451-460 title input 자체는 `aria-required=\"true\"` L458 만 가지고 `aria-invalid`/`aria-describedby` 모두 부재 → SR 사용자가 (1) form 제출 직후 error region 의 '제목을 입력해주세요' announce 받지만 (2) input 에 focus 복귀했을 때 invalid 상태 announce 0건 + 에러 텍스트와 input 의 프로그래밍적 연결 0건. 코드베이스 내부 정합 근거: 코드베이스 전반 `aria-invalid`/`aria-describedby` 사용 0건 (grep 검증) — 본 후보가 첫 적용. 자체 리뷰 #2(자의적 해석) 위험은 WAI-ARIA 1.2 표준 패턴(aria-invalid + aria-describedby field-to-error linkage)으로 회피. 안티패턴 L15-L21 무매치 — 토큰/공개 API 비변경, JSX 구조 미수정, input 1개에 prop 2개 + error region 에 id 1개 추가."
      repro: "1) cd apps/web && npm run dev. 2) 로그인 후 /pin/new 진입. 3) 미디어 파일 업로드(아무 이미지). 4) 제목 비워둔 채 '게시하기' 클릭. 5) 현재: form 상단 error region 에 '제목을 입력해주세요' 표시(role=alert announce) → 사용자가 입력란으로 focus 이동해도 SR 가 invalid 상태/관련 에러 announce 0건. 6) 처리: L320 error div 에 `id=\"pin-error\"` + L451 title input 에 `aria-invalid={!!error && !title.trim()}` + `aria-describedby={error ? \"pin-error\" : undefined}` 추가(diff +3 -0)."
    qa_plan: "1) cd apps/web && npm run dev. 2) /pin/new 진입 후 제목 빈 채 제출 → form-level role=alert 가 '제목을 입력해주세요' announce(기존 동작) + title input 에 focus 복귀 시 SR 가 '제목, 필수, 잘못됨, 제목을 입력해주세요' 같이 announce 확인. 3) 제목 입력 후 제출 → error 사라지면 aria-invalid=false / aria-describedby 미설정 확인. 4) input 시각(`w-full px-4 py-2.5 bg-bg border border-border rounded-[6px]` 등) · label · 인접 description textarea · URL input · 미디어 영역 시각 회귀 0 확인. 5) light mode 동일."
