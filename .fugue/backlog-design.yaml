  - id: "design-20260526-a11y-addtoboardbutton-modal-close-focus-return-missing"
    title: "AddToBoardButton 모달 close 후 trigger button 으로 focus 복귀 누락 — 키보드/SR 사용자가 modal close 시 focus lost(WAI-ARIA Authoring Practices Dialog Pattern · WCAG 2.1 SC 2.4.3 Focus Order Level A)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/board/AddToBoardButton.tsx:38-55"
      cite: "WAI-ARIA Authoring Practices 1.2 Dialog (Modal) Pattern (https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/) — 'When a dialog closes, focus returns to the element that invoked the dialog unless either: (a) The invoking element no longer exists; (b) The workflow design includes the following conditions that may lead to a kind of unintended consequence...' + WCAG 2.1 SC 2.4.3 Focus Order (Level A) — 'If a Web page can be navigated sequentially and the navigation sequences affect meaning or operation, focusable components receive focus in an order that preserves meaning and operability.' AddToBoardButton.tsx L38-55 의 trigger button → BoardSelectModal mount(`setIsOpen(true)`, L41) → BoardSelectModal 내부 `panelRef.current?.focus()`(L127-128) 로 initial focus 진입 ✅, ESC/overlay click/Tab focus trap/auto-close-on-success 모두 구현 ✅ — 그러나 onClose(`setIsOpen(false)`, L51) 직후 trigger button(L40) 으로 focus 복귀 0. 키보드 사용자는 modal close 후 body(document) focus 로 떨어져 다시 Tab 으로 trigger button 까지 navigate 필요. SR 사용자는 focus 위치 발화 lost. 인접 modal 컴포넌트(VideoTrimModal)는 별도 trigger 의 file input 으로 별도 사이클 처리 — 본 후보는 AddToBoardButton 단독 컴포넌트 범위. 안티패턴 L15-L21 무매치 — JSX 구조 비변경(button + modal mount 그대로), useRef 1개 + onClose closure 변경(diff ~3 lines)."
      repro: "1) cd apps/web && npm run dev → 로그인. 2) /pins/[id] 진입(임의 pin) → '보드에 추가' button(AddToBoardButton trigger, L40) 키보드 Tab 으로 focus → Enter → modal open. 3) modal 내 `panelRef.current?.focus()`(L127-128) 로 panel focus 진입. 4) ESC → onClose() → setIsOpen(false) → modal unmount. 5) modal close 직후 focus → document.body(또는 직전 modal panel 의 unmount 위치). 6) trigger button(L40) 으로 복귀 0 → 사용자가 다시 Shift+Tab 으로 navigate. 7) 대조: AddToBoardButton 비로그인 분기(L26-35)는 Link 라 modal 없음 — 영향 0."
    qa_plan: "1) cd apps/web && npm run dev → 로그인. 2) /pins/[id] 진입 → 키보드 Tab 으로 '보드에 추가' button 으로 focus → Enter → modal open. 3) panel focus 진입(L127-128) ✅. 4) ESC → modal close → trigger button(L40) 으로 focus 복귀 확인. 5) overlay click → 동일 trigger focus 복귀. 6) auto-close-on-success(L167-171) → 동일 trigger focus 복귀. 7) X close button(L247-265) 클릭 → 동일 trigger focus 복귀. 8) 시각 회귀 0(useRef + focus() 호출은 키보드/SR 전용, 시각 UI 무변경). 9) `grep -nE 'triggerRef|useRef<HTMLButtonElement>' apps/web/src/components/board/AddToBoardButton.tsx` 1+ match 확인. 10) 비로그인 분기(Link, L26-35)는 영향 0(modal 자체 없음)."
