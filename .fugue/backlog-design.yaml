  - id: "design-20260522-a11y-feedcontainer-loadmore-spinner-role-status-missing"
    title: "FeedContainer 홈 피드 추가 작품 로딩 spinner 가 `role=status`/`aria-label` 부재 — 무한 스크롤 페이지네이션 시 SR 사용자에게 로딩 상태 미알림(WCAG 2.1 SC 4.1.3 Status Messages Level AA)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/feed/FeedContainer.tsx:214-218"
      cite: "WCAG 2.1 SC 4.1.3 Status Messages (Level AA) — 'In content implemented using markup languages, status messages can be programmatically determined through role or properties such that they can be presented to the user by assistive technologies without receiving focus.' FeedContainer L214-218 의 추가 작품 로딩 spinner: `{loading && pins.length > 0 && (<div className=\"flex justify-center py-8\"><div className=\"w-6 h-6 border-2 border-accent border-t-transparent rounded-full animate-spin\" /></div>)}` — IntersectionObserver(L138-147)가 sentinel 도달 시 loadMore() 트리거 → setLoading(true) → spinner 렌더. `role=\"status\"`/`aria-label` 부재라 SR 사용자에게 알림 0건. 동일 spinner 패턴이 PR #147(SearchClient L411-415) · PR #151(LoadMorePins L49-53) · PR #154(AddToBoardButton L282-287) 에서 role=status + aria-label 로 정렬된 in-codebase 5 라인업(SearchBar L253 · AddToBoardButton L270/L286 · SearchClient L413 · LoadMorePins L49 · PinCreateForm L606)에서 홈 피드 FeedContainer L214 만 갭. 같은 컴포넌트 L184-203 error 영역은 이미 role=alert + aria-live=polite 사용. 안티패턴 L15-L21 무매치 — 토큰/공개 API 비변경, JSX 구조 미수정(외곽 div 에 role + aria-label 2 prop 추가만)."
      repro: "1) cd apps/web && npm run dev. 2) 비로그인 또는 로그인 후 / 진입 → 초기 8개 핀 카드 표시(skeleton 분기는 별개). 3) 스크롤로 sentinel(L212 `<div ref={sentinelRef} className=\"h-4\" />`) 도달 → loadMore() 호출 → setLoading(true) → L214 spinner 렌더. 4) SR(VoiceOver) 활성화 후 스크롤 → spinner 출현 시 SR announce 0건 — '추가 작품 로딩 중' 음성 없음. 5) 처리: L214-218 외곽 div 에 `role=\"status\" aria-label=\"추가 작품 로딩 중\"` 2 prop 추가(diff +2 -1)."
    qa_plan: "1) cd apps/web && npm run dev. 2) / 진입 후 핀이 충분히 로드된 상태에서 스크롤 → 로딩 spinner 시각 동일 확인. 3) SR(VoiceOver) 으로 스크롤 시 sentinel 도달 직후 '추가 작품 로딩 중' announce 확인. 4) 페이지네이션 완료 후 spinner 사라짐 확인(setLoading(false)). 5) error 분기(L184-203) role=alert 미변경 확인. 6) light mode 시각 동일 확인. 7) 인접 화면(MasonryGrid · PinCard · FieldFilter · TagFilter) 회귀 0 확인."
