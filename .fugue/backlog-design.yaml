    title: "FieldFilter 홈 피드 미디어 타입 필터 4 button(전체/이미지/음악/영상) 의 토글 button 상태가 `aria-pressed` 부재 — SR 사용자에게 현재 선택된 미디어 타입 미알림(WCAG 2.1 SC 4.1.2 Name, Role, Value Level A)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/feed/FieldFilter.tsx:32-44"
      cite: "WCAG 2.1 SC 4.1.2 Name, Role, Value (Level A) — 'For all user interface components ... the name and role can be programmatically determined; states, properties, and values that can be set by the user can be programmatically determined; and notification of changes to these items is available to user agents, including assistive technologies.' FieldFilter L33-43 button 4개: `<button onClick={() => handleClick(mt.value)} className={current === mt.value ? 'bg-text-primary text-bg' : 'bg-transparent border border-border text-text-muted ...'}>{mt.label}</button>` — selected 상태(`current === mt.value`)가 시각으로만 표현(bg/text 색 반전), `aria-pressed`/`aria-selected`/`aria-checked` 0건. SR 사용자는 'button, 전체' / 'button, 이미지' 만 듣고 현재 어느 필터가 활성인지 인지 불가. W3C ARIA Authoring Practices 의 toggle button 패턴은 `aria-pressed=\"true|false\"` 명시. 코드베이스 전반 `aria-pressed`/`aria-selected`/`aria-checked` 사용 0건(grep 검증) — 이번 후보가 첫 적용 사례, 향후 PinsGrid/TagFilter/SearchClient tab/PinCreateForm 카테고리·태그 토글로 확장 가능. 안티패턴 L15-L21 무매치 — 토큰/공개 API 비변경, JSX 구조 미수정, 단일 button 에 `aria-pressed` 1 prop 추가만(map 안 분기는 `current === mt.value` 가 이미 boolean 이므로 그대로 활용)."
