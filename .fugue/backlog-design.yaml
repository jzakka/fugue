  - id: "design-20260519-avatar-img-redundant-alt"
    title: "프로필 아바타 img가 인접 visible nickname과 중복되는 alt 텍스트를 가진다 — WCAG 1.1.1 Level A · WAI-ARIA APG Image Pattern (decorative 위반)"
