  - id: "design-20260522-a11y-pincreate-optimizing-spinner-role-status-missing"
    title: "/pin/new PinCreateForm 의 파일 최적화 spinner 에 `role=\"status\"` + `aria-label` 누락 — 비디오/오디오 업로드 처리 진행 상태 SR announce 부재(WCAG 2.1 SC 4.1.3 Status Messages Level AA)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/app/pin/new/PinCreateForm.tsx:360-366"
      cite: "WCAG 2.1 SC 4.1.3 Status Messages (Level AA) — 'In content implemented using markup languages, status messages can be programmatically determined through role or properties such that they can be presented to the user by assistive technologies without receiving focus.' PinCreateForm.tsx L360-366 의 optimizing 분기는 비디오/오디오 파일 업로드 시 클라이언트사이드 ffmpeg 최적화(`optimizeFile`)의 진행 상황을 표시: L360 outer div(`border border-border rounded-[10px] p-6`) → L361 inner div(`flex items-center gap-3 mb-3`) → L362 spinner(`w-5 h-5 ... animate-spin`) + L363-365 stage span(`{optimizeProgress?.stage || \"파일 처리 중...\"}`) + L367-372 progress bar. spinner/stage 둘 다 role 부재 — SR 사용자는 최적화 시작 인지 0 + stage 변화(예: '메타데이터 추출' → '인코딩 중' → '완료') 추적 불가. in-codebase 직접 precedent: cycle 71 PR #212 PinsGrid 무한 스크롤 spinner 에 `role=\"status\"` + `aria-label=\"추가 핀 로딩 중\"` 추가 + cycle 72 PR #214 AddToBoardButton 보드 row 추가 spinner 에 동일 패턴 적용. 안티패턴 L15-L21 무매치 — 토큰/공개 컴포넌트 API 비변경, JSX 구조 미수정, attribute 2건만 부모 div 에 추가."
      repro: "1) cd apps/web && npm run dev. 2) /pin/new 진입 후 파일 업로드 탭 선택. 3) 비디오 또는 오디오 파일 선택(자동 트리거: `if (needsOptimization) optimizeFile(blob)`). 4) SR(VoiceOver/NVDA) 활성화 상태로 optimizing 분기 진입 → 화면에 spinner + '파일 처리 중...' / '메타데이터 추출' 등 표시되나 SR 무발화. 5) stage 텍스트가 동적으로 변경되어도 SR 무발화. 6) `grep -n 'role=\"status\"' apps/web/src/app/pin/new/PinCreateForm.tsx` 매칭 0 (다른 spinner 인 L494 ogLoading 도 동일 누락 — 별도 후보)."
    qa_plan: "1) cd apps/web && npm run dev. 2) /pin/new 진입 후 파일 업로드 + 비디오/오디오 파일 선택. 3) SR 활성화 상태로 optimizing 분기 진입 → '파일 처리 중...' 또는 stage 텍스트 발화 확인. 4) stage 가 변경될 때 polite 모드로 announce 확인(`aria-live=\"polite\"`). 5) 시각 회귀 0(role + aria 는 SR 전용, 시각 동작 무변경). 6) progress bar L367-372 percent 동작 회귀 0. 7) optimizing 종료 후 OG 카드/파일 정보 표시 분기로 정상 전환."
