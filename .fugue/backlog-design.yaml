      cite: "WCAG 2.1 SC 4.1.3 Status Messages (Level AA): 'In content implemented using markup languages, status messages can be programmatically determined through role or properties such that they can be presented to the user by assistive technologies without receiving focus.' WAI-ARIA: role=\"alert\"(implicit aria-live=\"assertive\") 는 에러/긴급 메시지, role=\"status\"(implicit aria-live=\"polite\") 는 success/info/non-critical 상태 갱신용. DESIGN.md L11 'Decoration level: Minimal — 타이포그래피와 여백이 모든 걸 한다' 및 루프 정체성 L7 '접근성 (대비, 키보드 포커스, aria)' 영역 정합. In-codebase precedent: `apps/web/src/app/login/page.tsx:54` `<p role=\"alert\" aria-live=\"polite\" className=\"...text-error\">` (코드베이스 내 ARIA live region 단일 매칭) — 본 후보 5개 error-only 박스가 동일 패턴 정렬, AddToBoardButton(L240-251) success/error 분기 박스는 role=\"status\" aria-live=\"polite\" 정렬. PR #33(decorative button aria-hidden) · PR #34(aria-required) · PR #35(role=\"button\" + tabIndex) · PR #36(focus-visible) 라인업의 a11y SR 안내 영역 확장."
