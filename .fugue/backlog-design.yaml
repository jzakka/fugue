  - id: "design-20260521-aesthetic-search-no-results-aria-live-region"
    title: "동적 'no-results' inline 메시지 2곳(SearchBar 드롭다운 · PinCreateForm 태그 검색) 에 ARIA live region 미부착 — WCAG 4.1.3 Status Messages Level AA 갭"
    area: a11y
    evidence:
      files:
