      cite: "WCAG 2.1 SC 1.1.1 Non-text Content (Level A): 'If non-text content is pure decoration ... it is implemented in a way that it can be ignored by assistive technology.' WAI-ARIA Authoring Practices Guide — Image Pattern: 'If the image is purely decorative, mark it with alt=\"\".' W3C alt 결정 트리: 인접 텍스트가 동일 정보를 제공하면 이미지는 장식 — alt=\"\". 본 3곳 모두 아바타 img가 `alt={...nickname}`을 가지면서 같은 컨테이너의 visible 텍스트(ProfileHeader L32-34 h1 nickname · SearchClient L325-327 nickname div · pins/[id] L209-211 nickname span)가 항상 화면에 표시됨 → 스크린리더가 nickname을 두 번 읽음. 코드 내 정착된 SSoT: PinCard.tsx L171-186이 동일 패턴(아바타 img + 인접 nickname text)에서 `alt=\"\"`를 사용해 in-codebase precedent 확립(decision-log 2026-05-15 NavBar wordmark · 2026-05-19 6 input aria-label 등 a11y 후속 잔여)."
