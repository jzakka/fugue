    note: "apps/web/src/components/board/AddToBoardButton.tsx AddToBoardButton 컴포넌트에 `const triggerRef = useRef<HTMLButtonElement>(null)` 1개 추가(L25), trigger button(L42)에 `ref={triggerRef}` 부여, BoardSelectModal `onClose` 콜백을 `() => setIsOpen(false)` 한 줄에서 `() => { setIsOpen(false); triggerRef.current?.focus(); }` 클로저 블록으로 변경(diff +6 -1: useRef 선언 1줄 + ref attribute 1줄 + onClose 블록 분해 4줄). 모달 close 4 경로 모두 `onClose` 단일 prop 통과 — ESC keydown handler(L138 `if (e.key === \"Escape\") onClose()`) · overlay click(L181 `onClose()`) · X button click(L253 `onClick={onClose}`) · auto-close-on-success setTimeout(L174 `setTimeout(onClose, 1500)`). useRef import 기존 보유(L3, useState/useEffect/useCallback 과 동일 import 라인) — 신규 import 0. WAI-ARIA Authoring Practices 1.2 Dialog (Modal) Pattern 및 WCAG 2.1 SC 2.4.3 Focus Order Level A 충족. trigger button 은 항상 `<>` Fragment 내 첫 자식으로 render(L41-47, modal mount 와 별개 위치) — modal unmount 와 무관하게 DOM 잔존, focus call 안전. in-codebase trigger ref + focus return 라인업: AddToBoardButton.tsx L25/L42/L55 신규 첫 도입(기존 0). 시각 회귀 0(useRef + focus() 호출은 키보드/SR 전용 동작, 시각 UI 무변경). BoardSelectModal 내부 panelRef · focus trap · loadBoards · handleSelectBoard · handleCreateAndAdd · feedback live region · scroll lock 모두 미수정. 비로그인 분기(Link L28-35) 영향 0(modal 자체 없음). VideoTrimModal(별도 trigger 가 file input, 본 패턴 미적용) · PinCreateForm · 다른 modal 미사용 컴포넌트 영향 0. Ralph env 제약(node_modules/headless 도구 미설치)으로 step 7 실 브라우저 QA 는 `grep -nE 'triggerRef|useRef<HTMLButtonElement>' apps/web/src/components/board/AddToBoardButton.tsx` 3 matches(L25 useRef · L42 ref · L55 focus call) 확인 + 4 close path 모두 onClose 단일 prop 통과 검증 + diff inspection(JSX 구조·panelRef·ESC handler·overlay click handler·focus trap·auto-close timer·feedback live region 모두 미수정)으로 대체."

  - id: "design-20260526-a11y-addtoboardbutton-feedback-error-role-alert-mismatch"
    title: "AddToBoardButton feedback live region 이 success/error 양쪽 모두 `role=\"status\"` 사용 — 코드베이스 error 메시지 6/6 컨벤션(`role=\"alert\"` + `aria-live=\"polite\"`) 위반, error 분기 SR announce semantics 약화(WCAG 2.1 SC 4.1.3 Status Messages Level AA · ARIA 1.2 alert vs status role 분리)"
    area: a11y
    evidence:
      files:
        - "apps/web/src/components/board/AddToBoardButton.tsx:274-287"
      cite: "WAI-ARIA 1.2 (https://www.w3.org/TR/wai-aria-1.2/#alert · https://www.w3.org/TR/wai-aria-1.2/#status) — 'The alert role identifies element that contain time-sensitive information about the result of an action by the user that is important enough to interrupt the user.' vs 'A status role contains advisory information for the user that is not important enough to justify an alert.' + WCAG 2.1 SC 4.1.3 Status Messages (Level AA) — 'In content implemented using markup languages, status messages can be programmatically determined through role or properties such that they can be presented to the user by assistive technologies without receiving focus.' AddToBoardButton.tsx L274-287 feedback live region 은 `role=\"status\"` + `aria-live=\"polite\"` 로 success/error 두 type 모두 동일 처리. handleSelectBoard(L184-204) error 케이스(`setFeedback({ type: \"error\", message: \"이미 이 보드에 추가된 핀입니다\" / \"보드에 추가하지 못했습니다. 다시 시도해주세요\" })` L201) 및 handleCreateAndAdd(L206-227) error 케이스(`setFeedback({ type: \"error\", message: \"보드 생성에 실패했습니다\" })` L220) 모두 role=status 로 발화 → 코드베이스 다른 6 곳 error 메시지(PinCreateForm.tsx L321-323 · BoardActions.tsx L67-69 · login/page.tsx L57 · MyPageClient.tsx L86-88 · ProfileEditForm.tsx L57-59 · FeedContainer.tsx L186-188) 모두 `role=\"alert\"` + `aria-live=\"polite\"` 페어 통일된 컨벤션과 어긋남. role=\"alert\" 는 alert role assertive intent 표시 + aria-live=\"polite\" 로 codebase-wide non-interruptive 정책 (사용자 결정 implicit, 6/6 일관) 유지. 안티패턴 L15-L21 무매치 — JSX 구조 비변경, conditional role/aria-live 1곳 변경(diff ~3 lines)."
      repro: "1) cd apps/web && npm run dev → 로그인 → /pins/[id] 진입(임의 pin). 2) '보드에 추가' → 보드 선택 → addPinToBoard 가 409 conflict 반환되면 setFeedback({ type: 'error', ... })(L201). 3) feedback `<div role=\"status\" aria-live=\"polite\">{message}</div>`(L275-287) mount → SR(VoiceOver/NVDA)이 'status' role 로 발화 — '보드 추가' 류 confirmation 메시지와 동일 semantic(즉 error 임이 role 로 구분 안 됨). 4) 대조: 같은 시점에 PinCreateForm/BoardActions/FeedContainer 등 다른 error 메시지는 모두 role=\"alert\" → SR 이 'alert' / '경고' 단어로 발화 + role distinction 명확. 5) `grep -rnE 'role=\"alert\"' apps/web/src/ --include=\"*.tsx\"` 6 matches 모두 error 메시지 element, AddToBoardButton 만 success+error 통합 role=status 사용 — 코드베이스 컨벤션 위반."
    qa_plan: "1) cd apps/web && npm run dev → 로그인 → /pins/[id]. 2) 이미 추가된 보드 선택(409 응답) → feedback type='error' → role=\"alert\" + aria-live=\"polite\" 발화 확인(SR 'alert' announcement). 3) 정상 보드 선택 → feedback type='success' → role=\"status\" + aria-live=\"polite\" 발화 확인(SR 'status' announcement). 4) 새 보드 생성 실패(boardName 길이 초과 또는 server error) → feedback type='error' → role=\"alert\" 동일. 5) 시각 회귀 0(role/aria-live 는 SR 전용 attribute, bg-success/error · border · text color · padding · rounded 모두 그대로). 6) `grep -rnE 'role=\"alert\"' apps/web/src/ --include=\"*.tsx\"` 7 matches(기존 6 + AddToBoardButton 신규 conditional 분기 1) 확인. 7) `grep -rnE 'role=\"status\"' apps/web/src/components/board/AddToBoardButton.tsx` 변경 후도 3 matches 유지(L275 feedback 신규 conditional · L287 loading · L341 adding) — feedback 의 conditional 분기에서 success type 시에만 role=status 적용."
    impact: 2
    confidence: 4
    effort: 1
    risk: 1
    score: 8.0
    status: done
    pr: 312
    note: "apps/web/src/components/board/AddToBoardButton.tsx L277 feedback live region 의 `role` 을 success/error 공통 `role=\"status\"` 에서 `role={feedback.type === \"success\" ? \"status\" : \"alert\"}` conditional 표현식으로 변경(diff +1 -1, 단일 라인 attribute 교체). aria-live=\"polite\"(L278) · className(L279-283) · feedback.message(L285) · JSX 구조 모두 미수정. handleSelectBoard error case(L201 `setFeedback({ type: \"error\", ... })`) 및 handleCreateAndAdd error case(L220) 시 conditional 분기로 role=\"alert\" 평가 → SR(VoiceOver/NVDA) 'alert' announcement; success case(L192 `setFeedback({ type: \"success\", ... })`) 시 role=\"status\" 유지. 코드베이스 다른 6 곳 error 메시지(PinCreateForm.tsx L321 · BoardActions.tsx L67 · login/page.tsx L57 · MyPageClient.tsx L86 · ProfileEditForm.tsx L57 · FeedContainer.tsx L186) 의 role=\"alert\" + aria-live=\"polite\" 통일 컨벤션 정렬. aria-live=\"polite\" 는 codebase-wide 비방해 announce 정책(6/6 implicit 사용자 결정) 유지. WAI-ARIA 1.2 alert role · WCAG 2.1 SC 4.1.3 Status Messages Level AA. AddToBoardButton.tsx 내 다른 role=\"status\" 2 곳(L293 boards 로딩 spinner · L347 adding indicator)은 본 conditional 과 별개 SR 채널 — 변경 0. 시각 회귀 0(role attribute 는 SR 전용 — bg-success/error · border · text color · padding · rounded 모두 그대로). 인접 컴포넌트 영향 0(단일 line). Ralph env 제약(node_modules/headless 도구 미설치)으로 step 7 실 브라우저 QA 는 `grep -nE 'role=\\{|role=\"alert\"|role=\"status\"' apps/web/src/components/board/AddToBoardButton.tsx` 3 matches(L277 conditional · L293 loading static · L347 adding static) 확인 + `grep -rnE 'role=\"alert\"' apps/web/src/ --include=\"*.tsx\"` 6 matches(기존 6 그대로 — conditional 표현식은 grep static literal 매칭 외) 라인업 확인으로 대체. handleSelectBoard · handleCreateAndAdd · feedback state schema · 4 close path · panelRef · focus trap · loadBoards 모두 미수정."

