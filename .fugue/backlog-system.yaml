      T4 Close 실패 path (best-effort): tmpfs quota 가 작은 mount 또는 chmod 로 강제
        실패 어려우면 cycle I/K 한계 인용하여 패턴 동일성 + 코드 인스펙션으로 보강.
      회귀: /api/pins GET 200, /api/feed 200, /api/auth/refresh 401(no cookies).
      단위 테스트: 가능한 한 io.Closer interface 도입 없이 핸들러 통합 테스트로 happy path
