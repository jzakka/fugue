          SIGKILL 로 해결. 빈도 낮지만 sev 영향 큼.
        - cmd/bot 가 이미 signal.NotifyContext 패턴을 적용한 것은 운영
          이 SIGTERM 정상 처리를 기대한다는 강한 신호 — scheduler 가
          그 신호를 받지 못하는 것이 wiring 결함.
        - cycle 변경 범위가 URLScheduler 인터페이스 변경을 포함하므로
          backward-compat 검토 필요. 권장 전략: 새 메서드
          `DequeueCtx(ctx, queueType) (string, error)` 추가, 기존 `Dequeue`
          는 호환을 위해 `DequeueCtx(context.Background(), queueType)`
          wrapper 로 유지 (점진적 마이그레이션). 두 consumer 가 곧장
          `DequeueCtx(runCtx, ...)` 호출하도록 갱신.
        - anti-patterns L15 (인프라 deployment) 무매치 — application
          code 의 graceful shutdown 결함.
    qa_plan: |
      실 환경 QA (Processing 모드 진입 시):
      1. `cd apps/api && go vet ./... && go build ./... && go test ./...`
         통과 사전 조건.
      2. URLScheduler 인터페이스에 `DequeueCtx(ctx, queueType)` 추가
         OR `Dequeue` 의 첫 인자에 ctx 추가 (둘 중 backward-compat
         영향 적은 쪽 채택). tryClaim 의 `context.Background()` 도
         전달받은 ctx 로 교체.
      3. PGURLScheduler.Dequeue 의 `time.Sleep(...)` 를
         `select { case <-ctx.Done(): return "", ctx.Err()
                    case <-time.After(pollInterval): }` 로 교체.
