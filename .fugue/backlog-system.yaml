  - id: system-20260522-scheduler-dequeue-ignores-runctx
    title: "scheduler.PGURLScheduler.Dequeue 가 context.Context 미수신 — consumer.Run(runCtx) 의 SIGTERM 이 빈 큐/throttled 상태의 워커에 도달하지 못함"
