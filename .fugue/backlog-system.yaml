  - id: system-20260521-bot-process-document-media-url-no-length-cap
    title: "HarvestPipeline.ProcessDocument 가 외부 ThumbnailURL/MediaCandidate URL 을 길이 검증 없이 pins.media_url(VARCHAR(500)) 에 직접 INSERT → 500 자 초과 URL(서명 CDN/사전 서명 S3 등) 에서 PostgreSQL value-too-long 으로 Pin upsert 결정적 실패 + 5회 harvest retry 비용 누수 (cycle 8 PR #50 title-truncate 동일 결함 형태의 media_url 잔여)"
    area: integrity
    evidence:
      files:
        - "apps/api/db/migrations/000012_pivot_pins_media.up.sql:2"     # media_url VARCHAR(500)
        - "apps/api/internal/bot/harvest_pipeline.go:266"               # mediaURL, mediaType := pickMediaForPin(doc) — 외부 URL 그대로
        - "apps/api/internal/bot/harvest_pipeline.go:288-297"           # UpsertBotPinByURL{MediaUrl: mediaURL} — 길이 cap 없이 INSERT
        - "apps/api/internal/bot/harvest_pipeline.go:313-337"           # pickMediaForPin 본문: doc.ThumbnailURL → 첫 MediaCandidate.URL, 길이 cap 없음
        - "apps/api/internal/bot/harvester_consumer.go:383-384"         # BodyText 500 / Title 200 truncate 직전·직후에만 적용. media_url 은 truncate 책임이 어디에도 위임되지 않음 (비대칭)
        - "apps/api/internal/bot/extractor.go:71"                       # doc.ThumbnailURL = pickFirstAbsoluteURL(base, scan.ogImage, scan.twImage, scan.jsonLDImage, scan.firstArticleImage) — 길이 cap 없음
        - "openspec/specs/harvester/spec.md:781-801"                    # "title은 pins.title 컬럼 cap 에 맞춰 rune-safe 사전 절단된다" Requirement — 동일 패턴이 title 에만 명시되어 있고 media_url 에는 부재 (cycle 8 PR #50 의 spec 잔여)
        - "openspec/specs/harvester/spec.md:182-183"                    # "Pin upsert SHALL be idempotent via ON CONFLICT DO UPDATE" — 500자 초과 URL 에서 INSERT 자체가 결정적 실패하므로 idempotent SHALL 비결정적 위반
        - ".fugue/decision-log.md:140-143"                              # 2026-05-19 cycle 8 PR #50 동일 결함 형태(title VARCHAR(200) cap 무절단 → value-too-long → 5회 retry → 영구 누락) 의 media_url 잔여
      cite: |
        직접 인용 가능한 OpenSpec SHALL 은 spec L182-183 의 idempotent upsert 와
        L781-785 의 title cap-enforcement 패턴이며, media_url 에 대한 명시적
        cap SHALL 은 부재하나 다음 사실로 결함성이 명백하다:

        (a) `apps/api/db/migrations/000012_pivot_pins_media.up.sql:2` 가
            `media_url VARCHAR(500)` 로 DB-level 길이 cap 강제. 이후 migration
            어디에도 ALTER 없음. production 스키마 일치.

        (b) `apps/api/internal/bot/harvest_pipeline.go:266` 의 `pickMediaForPin(doc)`
            은 doc.ThumbnailURL (extractor 의 `pickFirstAbsoluteURL`) 또는 첫
            MediaCandidate.URL 을 반환. 둘 다 외부 페이지의 og:image/twitter:image/
            JSON-LD image/<img src> 또는 <video src> 의 raw URL 로, 길이 cap 부재.
            반환된 mediaURL 은 L288-297 의 `UpsertBotPinByURL{MediaUrl: mediaURL}`
            에 직접 전달.

        (c) 같은 파일 Process 경로(L208 `mediaURL, dlErr := p.downloadAndUpload(...)`)
            는 storage.Upload 결과(pubURL + key, e.g. `http://localhost:9000/
            fugue-media/bot/<uuid>.<ext>` ≪ 500 chars) 로 안전. 즉 결함은
            ProcessDocument 경로(L266) 에 한정.

        (d) `apps/api/internal/bot/harvester_consumer.go:383-384` 가 `doc.BodyText
            = truncateRunes(doc.BodyText, 500)` + `doc.Title = truncateRunes(
            doc.Title, 200)` 로 description/title VARCHAR cap 사전 절단을
            명시적으로 수행. 즉 "pipeline write 직전에 컬럼 cap 에 맞춘다" 는
            합의된 로컬 패턴 — 그러나 media_url 에는 적용 부재. cycle 8 PR #50
            (2026-05-19 decision-log L140-143) 이 정확히 같은 결함 형태를 title
            에 대해 해소했고 본 항목이 media_url 에 대한 잔여.

        (e) `openspec/specs/harvester/spec.md:781-801` 가 title 에 대해
            "pins.title 컬럼 cap 에 맞춰 rune-safe 사전 절단된다" Requirement 4
            Scenarios 를 명시(`pins.title VARCHAR(200) NOT NULL` 컬럼 cap 에서
            `value too long for type character varying(200)` 거부를 사전 차단해
            Pin upsert SHALL 이 결정적으로 충족되도록 한다). 동일 spec L182-183
            "Pin upsert SHALL be idempotent via ON CONFLICT DO UPDATE" 가 media_url
            에 대해서도 같은 결정성을 요구하지만 cap-enforcement Requirement
            가 media_url 에 대해서는 부재.

        (f) 다만 media_url 은 URL 이라 title/description 처럼 단순 rune-truncate
            가 불가능(URL 의미 파괴). 따라서 fix 의 형태는 "사전 절단" 이 아닌
            "사전 차단(skip)": pickMediaForPin 에서 500 rune 초과 후보를 건너
            뛰고 다음 MediaCandidate 시도, 모든 후보가 초과면 ("", "") 반환
            → ProcessDocument L267-269 의 기존 `pin document missing media_url`
            분기로 자연 흡수 → classifier 의 no_primary_media 경로와 동일한
            "Pin 미생성 + skipped 카운트" 의미. cycle 8 의 title-truncate
            (정보 보존) 와 형태는 다르지만 spec L182-183 idempotent SHALL 결정성
            을 보장한다는 의도는 동일.

        (g) confidence 4 (PostgreSQL VARCHAR(500) 거부는 mechanical; cycle 8
            동일 결함 형태가 PR #50 으로 archive; spec L781-785 가 동일 cap-
            enforcement 패턴을 명시; resolution 형태(skip vs truncate)에 대한
            spec 부재가 5점이 아닌 4점의 이유 — 처리 모드에서 spec Requirement
            ADDED 가 필요).
      repro: |
        1. 어떤 외부 사이트가 `<meta property="og:image" content="...">` 또는
           `<img src="...">` 에 500 rune 초과 URL 을 가지고 있다고 가정. 실제로
