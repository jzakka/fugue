        대기.
      repro: |
        1. `docker-compose up -d` 후 pioneer_frontier 큐 비우기 (DELETE
           FROM pioneer_frontier; — 또는 모든 row 의 next_pioneer_at 을
           미래로 설정 / 모든 host 를 throttled 상태로).
        2. `cd apps/api && HARVESTER_MODE=real go run cmd/bot pioneer` (단일
           워커) 가동.
        3. 워커는 tryClaim 가 (false, nil) 반환 → time.Sleep(1s) → 무한
           재시도. 정상.
        4. 별 터미널에서 `kill -TERM <PID>`. 관측: 워커가 즉시 종료하지
