        1. fix 적용 후 단위 테스트: `redis.Client`를 mock하여 Del→error / SRem→error를 강제 주입하고 RevokeRefreshToken 호출 시 `log.Printf("auth.Logout: revoke Del error: ...")` / `"... SRem error: ..."`가 출력되는지 capture로 assertion. 정상 경로(Del/SRem 모두 성공)는 신규 로그 무출력.
        2. 실 환경 reproduction:
           (T1 정상) docker-compose Redis 정상 → JWT로 RT 발급 → /api/auth/logout 호출 → 200 OK + 신규 로그 무출력 + `redis-cli get rt:{JTI}` → nil 확인.
           (T2 Redis DEL 실패) Logout 시점 직전 `docker compose pause redis` → /api/auth/logout 호출 → 200 OK + 로그 `auth.Logout: revoke Del error: ...` 출력 + `docker compose unpause redis` 후 `redis-cli get rt:{JTI}` → 키 잔존 확인(현 결함 그대로 — fix는 운영자 가시화만, revoke 실패 자체는 best-effort 정책 유지).
