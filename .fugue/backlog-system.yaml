          defer func() { _ = rdb.Close() }()

        cmd/bot/main.go 는 이미 패턴 보유 (L276, L498):
          runCtx, cancel := signal.NotifyContext(ctx, os.Interrupt, syscall.SIGTERM)

        → 같은 backend 의 같은 cmd/ 디렉터리에 표준 graceful shutdown
        패턴이 이미 wiring 된 사례가 있는데 cmd/server 만 미적용.
      repro: |
        1. `docker-compose up -d` + `cd apps/api && go run cmd/server/main.go`
           로 API 서버 가동.
        2. `curl -X POST http://localhost:8080/api/pins ...` (인증 + 멀티-쿼리
           트랜잭션 핸들러 — INSERT pins + INSERT pin_tags) 의 응답이
           돌아오기 전에 server 프로세스에 SIGTERM 전송 (kill -TERM <PID>).
        3. 관측: client 측 `curl: (52) Empty reply from server` 또는
           connection reset by peer. 서버 측 stdout 에 `defer db.Close()` /
           `defer rdb.Close()` 가 실행됐다는 흔적 0 (Go runtime 의 default
           SIGTERM 핸들러는 즉시 프로세스 종료 → defers 미실행).
        4. PostgreSQL 측: 진행 중이던 transaction 이 client 측 abrupt close
           로 ROLLBACK (정상 동작이지만 partial 상태로 보일 수 있는 race
           — 예: pin INSERT 직후 pin_tags INSERT 직전 cut → 외부 관찰자에는
           orphan pin 잠시 보임).
        5. k8s 환경에서 rolling deploy: 매 deploy 마다 in-flight 요청 (특히
           긴 핸들러: search, OG fetch 5s, pin 생성 멀티-인서트) 가 client
           에 5xx/connection reset 로 노출 — 사용자 경험 직접 영향.
      attack_surface: |
        - 표면: 모든 HTTP 핸들러 (`apps/api/internal/{auth,pin,board,feed,
          search,og,creator,tag,interaction,boards}/handler.go`). Chi
          router 등록 모두 단일 `*chi.Mux` 인스턴스에 attach 되어 같은
          `http.ListenAndServe` 가 서비스.
        - 일반 read 핸들러는 idempotent 라 영향 작지만, write 핸들러는
          단일 핸들러 안에서 multi-statement transaction 또는 storage.Upload
          + DB insert 같은 두-개-사이드-이펙트 시퀀스가 abrupt cut 되면
          partial state 가능:
          * POST /api/pins (storage.Upload 후 pin INSERT + pin_tags INSERT)
          * POST /api/og/fetch (외부 HTTP 5s + DB 없음 — 영향 작음)
          * POST /api/boards/{id}/pins (board_pins INSERT)
          * POST /api/auth/{provider}/callback (user UPSERT + JWT 발급)
        - DB 연결 abrupt close: PostgreSQL 서버는 client TCP RST 를
          unhandled 종료로 인식 → idle 트랜잭션이 1분 동안 lock 유지
          가능 (`idle_in_transaction_session_timeout` 미설정 시).
          defer db.Close() 가 실행됐다면 `db.Close()` 가 모든 idle
          connection 을 `terminate` 로 cleanup 하므로 lock 해제 즉시.
        - Redis 연결 abrupt close: redis-go 클라이언트는 reconnect 처리
          하므로 비교적 안전, 그러나 in-flight rate-limit 카운터 update
          이 미flush 될 수 있음 (대부분 fire-and-forget 라 영향 작음).
        - k8s deployment 표준 패턴: pod 의 preStop hook 또는 SIGTERM
          전송 후 terminationGracePeriodSeconds (기본 30s) 안에 정상
          종료해야 readiness probe 가 endpoint 제거. 현재는 graceful
          shutdown 부재 → SIGTERM 직후 즉시 종료 → endpoint 제거 전
          frame 안의 in-flight 요청은 cut → rolling deploy 시 매 pod 마다
          1~수십 요청 5xx.
        - anti-patterns L15 의 "배포 매니페스트 결함" 항목은 helm/
          terraform/docker-compose 의 args/wiring 결함에 한정.
          본 항목은 `apps/api/cmd/server/main.go` 의 Go application
          코드 결함이므로 anti-pattern 무매치.
    qa_plan: |
