        apps/api/internal/scheduler/url_scheduler.go L296-340 recordError
        (RecordFetchError / RecordHarvestError 의 shared impl):
          func (s *PGURLScheduler) recordError(key string, errorKind ErrorKind, ops recordErrorOps) error {
              ...
              ctx := context.Background()      // L300
              ...
              rows, err := ops.dead(ctx, s.queries, hash)         // L309 (4xx 경로)
              rows, err := ops.backoff(ctx, s.queries, hash, candidates) // L336 (비-4xx 경로)
