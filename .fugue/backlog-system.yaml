  - id: system-20260522-pioneer-default-consumer-fetcher-no-ssrf-guard
    title: "PioneerConsumer 의 DefaultConsumerFetcher 가 SSRF-safe client 없이 외부 URL 을 fetch 해 snapshot store 에 internal IP 응답 적재 가능 — Harvester SSRF 가드 무력화"
    area: security
    evidence:
      files:
        - "apps/api/internal/bot/pioneer_consumer.go:319-332"
        - "apps/api/internal/bot/pioneer_consumer.go:337-367"
        - "apps/api/internal/bot/pioneer_consumer.go:171"
        - "apps/api/internal/bot/harvest_pipeline.go:143-156"
        - "apps/api/internal/httpclient/ssrf.go:28-90"
      cite: |
        openspec/specs/harvester/spec.md L739 Requirement
        `외부 미디어 fetch는 SSRF-safe HTTP client를 경유한다`:
        "외부 사이트로부터 추출된 — 즉, 호출자가 제어할 수 없는 — URL에
        대해 ... HTTP fetch는 SSRF-safe HTTP client를 경유해야 한다(SHALL)
        ... 외부 저장소에 사설 호스트 응답 바이트가 적재되지 않는다."

        Pioneer spec 자체에는 SSRF 명시 SHALL 이 없으나 위 Harvester SHALL
        의 위협 모델("호출자가 제어할 수 없는 URL" + "외부 저장소에 사설
        호스트 응답 바이트가 적재되지 않는다") 이 그대로 Pioneer fetch 에도
        적용됨 — Pioneer 가 fetch 한 body 는 pioneer_consumer.go:171
        `p.snapshotStore.Put(ctx, canonical, body)` 로 SnapshotStore(=S3Store,
        apps/api/internal/bot/snapshot/store.go:40) 에 적재됨. 즉 Harvester
        spec 의 "외부 저장소에 ... 적재" 시나리오와 동일 신뢰 경계.

        또한 직전 사이클 `system-20260519-bot-harvest-pipeline-ssrf` (PR #47)
        가 Harvester 의 SSRF 가드를 추가했으나 같은 봇 파이프라인의 **첫
        fetch 단(Pioneer)** 은 그대로 unsafe — Harvester 의 SSRF safe
        client 는 후속 (harvester 가 directly fetch 하는) 경로에만 적용되고,
        Pioneer 가 이미 internal IP 응답을 snapshot 으로 적재했다면 그 body
        는 Harvester 가 SnapshotFirstFetch 로 받아 그대로 처리됨. 따라서
        Pioneer 단의 가드 부재는 Harvester 의 SHALL 을 무력화한다.

        OWASP Top-10 A10:2021 SSRF 에도 해당.
      repro: |
        1. 외부 attacker 가 통제하는 페이지에 internal IP 를 가리키는
           a href 를 심는다:
           `<a href="http://169.254.169.254/latest/meta-data/iam/security-credentials/<role>">x</a>`
        2. Pioneer 시드/전이 경로로 attacker 페이지가 pioneer_frontier 에
           들어가 Pioneer 가 fetch.
        3. crawler.ExtractLinksWithSelectors 가 위 a href 를 추출.
        4. FilterChain.Apply 통과(link_filter 는 schema/host pattern 기준
           이며 private IP 필터 부재 — 본 backlog 의 범위는 fetcher cap
           단일 지점).
        5. 다음 사이클에 Pioneer 가 위 internal IP URL 을 Dequeue.
        6. DefaultConsumerFetcher.Fetch (pioneer_consumer.go:337) 가 bare
           `&http.Client{Timeout: 10s, CheckRedirect: ...}` 로 HTTP GET —
           IP 검사 없이 dial. AWS EC2 IMDS 응답 body(JSON 형태 IAM 임시
           자격증명 등) 를 받음.
        7. pioneer_consumer.go:171 `p.snapshotStore.Put(canonical, body)` 가
           S3Store 에 IMDS body 를 객체로 PutObject. snapshot key 는
           snapshots/scraped/<date>/<hash> 형식.
        8. EnqueueHarvester(rawURL, snapKey) 가 harvester_frontier 에
           행 INSERT. Harvester 가 다음 budget 에서 위 snapshot 을
           SnapshotFirstFetch.Fetch(rawURL) 로 받아 body 를 그대로
           extract+classify 처리. Harvester 의 SSRF safe client 는 이 단계에
           적용되지 않음 (이미 적재된 snapshot bytes 가 입력).
        9. PinDocument 가 만들어지면 pin 행에 IMDS 응답 일부가 적재될
           가능성도 있음 (생성자가 ProcessDocument 의 분기에 따라
           description/text_content 에 들어갈 수 있음).
      attack_surface: |
        - DefaultConsumerFetcher.client (pioneer_consumer.go:321-329) =
          bare `&http.Client{Timeout: 10s, CheckRedirect: redirect-cap}`.
          DialContext 미설정 → DNS rebinding/private IP 직접 dial 모두 가능.
          CheckRedirect 가 redirect 횟수만 cap 하고 hop 별 host 재해소·
          IP 검사 없음 → 200 OK 를 link-local IP 로 흘려보내는 302
          chain 통과.
        - 응답 body 5 MiB cap (io.LimitReader) 은 있지만 IMDS 응답은
          수 KiB 라 cap 으로 못 막음.
        - Pioneer 가 적재한 snapshot 은 그대로 Harvester 가 받아
          처리하므로 한번의 SSRF 성공이 곧 봇 파이프라인 후속 단계
          전체로 확산.
        - 동일 패키지 `httpclient.NewSSRFSafeClient` 가 이미 구현
          되어있으며 Harvester(HarvestPipeline.client) 가 사용 중 —
          Pioneer 만 비대칭으로 unsafe.
    qa_plan: |
      실 환경 QA (Processing 모드 진입 시):
      1. `cd apps/api && go vet ./... && go build ./... && go test ./...`
         통과 사전 조건 확인.
      2. 회귀 테스트 신규 추가 — `pioneer_consumer_ssrf_test.go` 1건
         (production NewDefaultConsumerFetcher() 가 127.0.0.1 / 169.254.169.254
         dial 을 거부, public IP 는 통과).
      3. docker-compose up -d (DB+Redis).
      4. `cd apps/api && go run cmd/server/main.go` (server 띄우기는 사실
         pioneer worker 자체는 별도 cmd 이지만 본 변경은 fetcher 단일
         지점이므로 DefaultConsumerFetcher 를 main_test 또는 직접 한번
         호출하는 ad-hoc go run snippet 으로 충분).
      5. Pioneer 가 위 internal IP URL 을 처리할 때 Fetch 가 SSRF 에러로
         실패하고 reportFailure(ErrorNetwork) 분기로 들어가는지 확인.
         로그에 "httpclient: blocked private/reserved IP ..." 메시지 확인.
      6. snapshot store (S3Store / 로컬 MinIO) 에 internal IP body 적재
         0건 확인 (수정 전 baseline 과 비교: 수정 전 fetch 성공 + Put
         호출 1회, 수정 후 fetch 실패 + Put 호출 0회).
      7. 회귀: public URL (예: https://example.com) 을 한 번 Fetch 하여
         정상 응답·snapshot 적재 확인.
