  - id: system-20260521-search-q-no-length-cap
    title: "/api/search 의 q 파라미터 길이 상한 없음 — 미인증·미rate-limit 엔드포인트가 unbounded q 를 pg_trgm similarity($1) 와 ILIKE '%' || $1 || '%' 에 그대로 흘려보내는 DoS 표면. 같은 핸들러 안에 빈/공백/type/태그-수/태그-UUID 검증은 모두 400 으로 잡으면서 q 길이만 누락"
    area: security
    evidence:
      files:
        - "apps/api/internal/search/handler.go:66-71"   # q := TrimSpace; if q == "" → 400 — 길이 상한 없음
        - "apps/api/internal/search/handler.go:73-111"  # type / limit / offset / tag_ids 검증은 모두 상한·형식 체크 후 400
        - "apps/api/internal/search/handler.go:113"     # useSimilarity = utf8.RuneCountInString(q) > 2 — 하한만 있고 상한 없음
        - "apps/api/internal/search/handler.go:203-237" # searchPins → SearchPinsBySimilarity / SearchPinsByILIKE 로 직행
        - "apps/api/db/queries/search.sql:1-21"         # similarity(p.title, $1) > 0.1 + ORDER BY score — unbounded $1 의 trigram 추출 O(n) + per-row 비교
        - "apps/api/db/queries/search.sql:23-38"        # p.title ILIKE '%' || $1 || '%' — pattern length 이 매칭 비용을 amplify
        - "apps/api/cmd/server/main.go:130"             # r.Get("/api/search", ...) — JWTMiddleware 없음, rate limiter 없음
        - "apps/api/internal/search/handler_test.go:10-74" # 같은 파일에 빈/공백/invalid type/>5 tags/invalid UUID 400 컨벤션 정립
        - "apps/api/internal/creator/handler.go:182-185"   # nickname 50 rune cap → 400
        - "apps/api/internal/creator/handler.go:192-195"   # avatar_url 500 rune cap → 400
        - ".fugue/decision-log.md"                          # cycle Q (PR #144) — pins.media_url(500) 사전 차단 — VARCHAR 상한 = 보안/DoS 가드 컨벤션
      quote: |
        L67: `q := strings.TrimSpace(r.URL.Query().Get("q"))`
        L68-71: `if q == "" { writeError(w, 400, "검색어를 입력해주세요"); return }`
        — 빈 query 만 reject. q 길이 상한 검사 없음.
        L113: `useSimilarity := utf8.RuneCountInString(q) > 2`
              하한(>2) 만 검사. 상한 없음.
        L130(main.go): `r.Get("/api/search", searchHandler.Search)`
              — JWTMiddleware 없음, rate limiter 없음.
        search.sql:8: `similarity(p.title, $1)` — pg_trgm 은 $1 의
              trigram 을 추출(O(len($1))) 후 모든 pin 행과 비교.
        search.sql:32: `p.title ILIKE '%' || $1 || '%'` — pattern length 가
              postgres 의 LIKE 매칭 비용을 직접 amplify (LIKE 가 GIN
              인덱스를 못 타면 full scan).
      reasoning: |
        같은 파일 handler_test.go 의 5 sub-test 가 입력 검증 컨벤션을 정립 —
        empty / whitespace / invalid type / >5 tags / invalid UUID 모두 400.
        그런데 q 길이만 무한대. q 는 (a) 미인증 (b) rate-limit 무, 두 가드
        모두 부재인 채로 (c) pg_trgm similarity 와 ILIKE '%q%' 에 직행.

        영향 모델:
        - similarity(p.title, $1): $1 의 모든 3-char 윈도우(trigram) 를
          추출(O(n)) 후 각 pin 의 trigram 집합과 비교. $1=100KB 면 trigram
          ~100K 개. WHERE similarity > 0.1 + ORDER BY score 가 모든 pin
          행에 대해 평가됨 (pg_trgm GIN 인덱스가 있어도 추출 비용은 $1 길이
          비례).
        - ILIKE '%' || $1 || '%': pattern length 가 길수록 매칭 cost 증가.
          또한 100KB 패턴은 네트워크/parse 비용도 흡수.
        - searchType=all (기본값) 이면 pins + creators + boards 3건 모두
          $1 으로 트리거 → 3배 amplification.
        - skipTopTags=false 분기(L134) 에서 추가로 limit=100 의 searchPins
