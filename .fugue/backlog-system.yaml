        도 ctx 무시:
          func (s *PGURLScheduler) tryClaim(queueType QueueType) (string, bool, error) {
              ctx := context.Background()
              tx, err := s.db.BeginTx(ctx, nil)
              ...

        apps/api/internal/bot/pioneer_consumer.go L117-152 Run 루프:
          for {
              if err := ctx.Err(); err != nil { return err }     // L124
              rawURL, err := p.scheduler.Dequeue(scheduler.QueuePioneer)  // L127 — ctx 무시!
              ...
          }

