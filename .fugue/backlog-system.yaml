        1. docker-compose up -d && go run cmd/server/main.go.
        2. OAuth 로그인 → fugue_refresh 쿠키 획득 → `redis-cli get "rt:{JTI}"`로 status=active 확인.
        3. `docker compose stop redis` 또는 `redis-cli ACL SETUSER default off`로 Redis DEL을 강제 실패시킨다.
        4. `curl -X POST -b fugue_refresh=... /api/auth/logout` → 200 OK 응답.
        5. `docker compose start redis`(또는 ACL 복구) 후 `redis-cli get "rt:{JTI}"` → 키가 여전히 status=active로 존재 → revoke 실패 silent.
        6. 같은 RT로 `curl -X POST -b fugue_refresh=... /api/auth/refresh` 시도 → 204 NoContent + 새 토큰 발행 → 로그아웃 후에도 회전 가능 입증.
      qa_plan: |
