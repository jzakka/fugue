      3. 통합 테스트 추가 (선택): httptest server 띄우고 in-flight
         long-handler 동안 Shutdown() 호출 시 정상 종료까지 대기 확인.
      4. 실 환경 QA:
         (a) `cd apps/api && go run cmd/server/main.go` 띄움.
         (b) `curl http://localhost:8080/api/feed` 반복 호출 baseline (200 OK
             확인).
         (c) 별 터미널에서 `kill -TERM <PID>` 전송 직전에 in-flight curl
             보내기 — server stdout 에 "shutdown: ...graceful..." 류 로그
             확인 + curl 응답 정상 200 수신 확인 (in-flight 요청 완료
             보장).
         (d) `psql -h localhost -U fugue -d fugue -c "SELECT state, count(*)
             FROM pg_stat_activity WHERE application_name LIKE '%fugue%'
             GROUP BY state;"` 로 SIGTERM 직후 idle/active connection
             상태 확인 — graceful 시 모든 connection 이 즉시 종료.
         (e) shutdown timeout 초과 (예: long-poll 핸들러 가정) 시 강제 종료
