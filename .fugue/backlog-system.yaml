  - id: system-20260519-bot-harvest-pipeline-ssrf
    title: "HarvestPipeline.client이 timeout/SSRF 가드 없는 bare http.Client라 og:image/media URL을 통한 SSRF → 공개 노출 체인 가능"
    area: security
    evidence:
      files:
        - "apps/api/internal/bot/harvest_pipeline.go:143-156"
        - "apps/api/internal/bot/harvest_pipeline.go:337-399"
        - "apps/api/internal/bot/harvest_pipeline.go:450-513"
        - "apps/api/internal/og/service.go:54-340"
      cite: |
        (직접 인용 가능한 스펙은 부재. 그러나 같은 저장소
         apps/api/internal/og/service.go L67-340이 동일한 외부 HTTP 호출
         경로에 대해 per-IP private/reserved range 거부 + CheckRedirect
         재해소를 이미 구현하고 있으므로 이는 프로젝트 내부 합의된
         "외부 HTTP fetcher의 SSRF 방어 패턴"이다. Bot의
         harvest_pipeline.go는 이 패턴을 따르지 않은 채 동일 신뢰 경계
         (외부에서 가져온 URL을 fetch)에서 동작한다. 또한 OWASP Top-10
         A10:2021 SSRF에 해당한다.)
      repro: |
        1. 외부 사이트 한 곳을 Pioneer가 크롤하도록 frontier에 enqueue.
        2. 해당 사이트 HTML에
           `<meta property="og:image" content="http://169.254.169.254/latest/meta-data/iam/security-credentials/<role>">`
           삽입 (또는 사내 localhost:포트 URL).
        3. Pioneer가 페이지를 가져오고 PickPrimaryImage가 위 og:image를
           추출 → snapshot_key와 함께 EnqueueHarvester.
        4. Harvester가 frontier에서 dequeue → HarvestPipeline.cacheImage
           가 `p.client.Do(req)`로 169.254.169.254 fetch → 응답 바이트를
           S3에 PutObject → 결과 URL을 Pin.og_image / media_url에 저장.
        5. 공개 Pin 조회 API가 해당 storage URL을 그대로 응답하므로
           AWS IAM 임시 자격증명이 인터넷에 공개됨.
      attack_surface: |
        - bare &http.Client{}: timeout 없음 → slow-loris 비용 공격,
          redirect cap 없음 → metadata 서비스로의 리다이렉트 우회,
          DialContext 없음 → DNS rebinding/private-IP 직접 연결 모두 가능.
        - HarvestPipeline.downloadAndUpload (L337-399): media_url 입력
          경로. Pioneer가 추출한 임의 URL.
        - HarvestPipeline.cacheImage (L450-513): og:image 입력 경로.
          외부 HTML에서 메타태그로 자유롭게 지정 가능.
        - 두 경로 모두 fetch 결과를 S3 객체로 저장하고 그 객체의 공개
          URL을 Pin row에 적재 → 공개 응답으로 흘러나감(공개-노출 체인).
    qa_plan: |
      실 환경 QA (Processing 모드 진입 시):
      1. docker-compose로 api+minio+postgres 기동.
      2. 호스트에서 `python3 -m http.server 8081`로 가짜 metadata 응답
         JSON을 serve하는 페이지를 띄우고, 그 페이지에
         `<meta property="og:image" content="http://169.254.169.254/latest/meta-data/iam/security-credentials/test">`
         삽입한 HTML을 별도 endpoint에 노출.
      3. pioneer_frontier에 위 페이지 URL을 enqueue한 뒤 1회 Pioneer
         실행 → harvester 1회 실행.
      4. minio에 og:image fetch 결과 객체가 생성되지 않는지,
         apps/api 로그에 SSRF 거부 메시지가 남는지 확인.
      5. 정상 외부 og:image(예: https://github.githubassets.com/favicon.ico)
         로 동일 절차 → 정상적으로 minio에 저장되고 Pin.og_image가
         채워지는지 회귀 확인.
      6. 동일 절차를 media_url(downloadAndUpload) 경로에 대해서도
         video URL로 1회 더 수행.
    impact: 5
    confidence: 5
    effort: 2
    risk: 2
    score: 6.25
    status: done
    note: |
      Discovery 모드 발굴. 인용 가능한 OpenSpec 요구사항은 부재하나
      저장소 내부 합의된 SSRF 방어 패턴(og/service.go)이 명백히 존재해
      "프로젝트 내부 스펙"의 위반으로 간주한다. Processing 모드에서
      당 항목 채택 시 첫 단계는 (a) og/service.go의 SSRF-safe
      dialer/CheckRedirect 로직을 공유 helper로 추출, (b) 해당 helper를
      HarvestPipeline.client에 주입, (c) downloadAndUpload/cacheImage
      각각에 timeout+redirect cap 명시. 동시에 harvester/spec.md에
      "외부 미디어 fetch는 private/reserved IP 거부 + N MB 상한 + T초
      timeout를 enforce한다" Scenario를 ADDED 한다.
    resolution: |
      2026-05-19 PR #47 (d51c944) 머지로 완료. apps/api/internal/httpclient
      신규 패키지에 SSRF-safe HTTP client (per-IP private/reserved 거부 +
      CheckRedirect 재해소 + non-http 스킴 거부 + 5s/60s/5-redirect cap)를
      추가하고 HarvestPipeline.client에 주입. downloadAndUpload의 streaming
      branch는 io.LimitReader(200 MiB)로 Content-Length lie 차단.
      harvester/spec.md에 "외부 미디어 fetch는 SSRF-safe HTTP client를
      경유한다" Requirement 5 Scenarios ADDED. og/service.go의 SSRF
      dialer를 신규 httpclient 패키지로 마이그레이션하는 작업은 본 사이클
      범위 밖으로 두고 후속 backlog 후보로 남김(중복 구현 정리 목적).

  - id: system-20260519-harvest-pipeline-title-no-truncate
    title: "HarvestPipeline이 doc.Title을 VARCHAR(200) cap 없이 그대로 INSERT → 긴 외부 title 페이지에서 PostgreSQL value-too-long 에러로 Pin 영구 실패 + 5회 fetch retry 비용 누수"
    area: integrity
    evidence:
      files:
        - "apps/api/db/migrations/000003_create_works.up.sql:5"   # title VARCHAR(200) NOT NULL
        - "apps/api/internal/bot/harvest_pipeline.go:293"          # Title: doc.Title (truncate 없이)
        - "apps/api/internal/bot/harvester_consumer.go:380-382"    # BodyText만 truncateRunes(500), Title은 없음
        - "apps/api/internal/bot/pin_document.go:37-38"            # "BodyText is raw text BEFORE the description-length cut; the Harvester is responsible for the rune-safe truncation when persisting." — Title에 대한 동일 책임 부재(비대칭 디자인)
        - "apps/api/internal/bot/extractor.go:69"                  # doc.Title = pickFirstNonEmpty(ogTitle, twTitle, jsonLDTitle, h1, htmlTitle) — 길이 cap 없음
        - "apps/api/internal/bot/script_adapter.go:112"            # Title: primary.Title — 동일 패턴
      cite: |
        직접 인용 가능한 OpenSpec SHALL은 부재하나, 다음 사실로 결함성이
        명백하다:
        (a) `apps/api/db/migrations/000003_create_works.up.sql:5`이
            `title VARCHAR(200) NOT NULL`로 DB-level 길이 cap을 강제.
            이후 migration 어디에도 ALTER가 없어 production 스키마와
            일치.
        (b) 같은 파일 `harvester_consumer.go:382`이 `doc.BodyText =
            truncateRunes(doc.BodyText, 500)`로 description의 VARCHAR(500)
            cap에 맞춘 사전 rune-truncate를 명시적으로 수행. 즉
            "pipeline write 직전에 컬럼 cap에 맞춰 자른다"가 이미 합의된
            로컬 패턴.
        (c) `pin_document.go:37-38`은 BodyText에 대해 truncate 책임을
            문서로 명시(`Harvester is responsible for the rune-safe
            truncation`). 그러나 Title은 같은 PinDocument 안에 있고
            DB cap이 더 작은(200 < 500) 컬럼에 매핑되는데 truncate
            책임이 어디에도 위임되지 않은 비대칭 결함.
        (d) `openspec/specs/harvester/spec.md:190` Pin upsert SHALL:
            "INSERT ... ON CONFLICT DO UPDATE를 통해 기존 Pin의 title
            ... 을 새 값으로 갱신한다". 200자 초과 title이면 PostgreSQL
            `ERROR: value too long for type character varying(200)`로
            INSERT 자체가 실패하므로 이 SHALL이 비결정적으로 깨짐.
      repro: |
        1. 어떤 외부 사이트가 `<title>` 또는 `<h1>` 또는 `og:title` 메타
           태그에 201자 이상의 문자열을 가지고 있다고 가정(SEO 키워드
           stuffing이나 자동 생성 페이지에서 흔함).
           예: `<title>A Comprehensive Review of Every Single Variant
           of the Phenomenon ... (continues for 250 chars)</title>`
        2. Pioneer가 이 페이지를 fetch + snapshot → HarvesterFrontier에
           enqueue.
        3. HarvesterConsumer가 dequeue → extractor.extract() →
           doc.Title = "A Comprehensive Review ... (250 chars)".
        4. `doc.BodyText = truncateRunes(doc.BodyText, 500)` 실행
           (Title은 손대지 않음).
        5. `pipeline.ProcessDocument(ctx, node, doc)` →
           `UpsertBotPinByURL{Title: doc.Title}` →
           PostgreSQL: `pq: value too long for type character varying(200)`.
        6. createPins가 에러 반환 → h.stats.failed.Add(1) →
           `h.reportFailure(rawURL, scheduler.ErrorNetwork, "pin_create",
           createErr)` → scheduler가 retry 스케줄 등록.
        7. 다음 fetch cycle에서 같은 URL이 다시 잡혀 같은 에러로 실패
           (title은 변하지 않음). harvest_error_count가 5에 도달할
           때까지 같은 비용 반복(snapshot fetch + extract + DB INSERT
           attempt 모두). 5에 도달하면 partial index 제외로 영구 누락.
        결과: 긴 title을 가진 모든 외부 페이지의 Pin이 영구적으로 생성
        되지 않고, 그동안 5회의 무의미한 retry 비용 누수.
      attack_surface: |
        - 자기 도메인 컨트롤이 없는 외부 사이트의 자유 입력(title 메타).
          공격이라기보다 운영 정상성 문제이지만, 누군가가 특정 도메인을
          타깃해 200자 초과 title을 가진 페이지를 다수 만들어두면
          harvester worker 시간/네트워크 비용을 의도적으로 낭비시킬
          수 있음(amplification: 1 PR한 페이지 → 5회 fetch).
        - 더 직접적 영향은 정상 외부 사이트(blog post title, news article
          subhead, JSON-LD headline 등)에서 200자 초과가 자주 발생하여
          정상 컨텐츠 일부가 누락되는 정합성 결함.
    qa_plan: |
      실 환경 QA (Processing 모드 진입 시):
      1. docker-compose로 api+postgres 기동.
      2. 호스트에서 `python3 -m http.server 8090`로 다음 HTML 페이지를
         serve:
         ```html
         <html><head><title>A test title that is exactly two hundred and
         ten characters long to exceed the VARCHAR(200) cap and prove
         the bug ... (210 chars total)</title></head>
         <body><article><p>본문이 200자 넘게...</p></article></body></html>
         ```
      3. `psql`로 pioneer_frontier에 이 URL을 enqueue:
         `INSERT INTO pioneer_frontier (normalized_url, url, url_hash, host)
          VALUES ('http://localhost:8090/long.html', ...);`
      4. Pioneer 1회 → snapshot이 harvester_frontier로 fanout 확인.
      5. Harvester 1회 → 로그에서 `pq: value too long for type character
         varying(200)`이 fix 전에는 나오는지 확인(재현),
         fix 적용 후엔 사라지고 Pin이 정상 생성되는지 확인.
      6. `psql`로 `SELECT title, length(title) FROM pins WHERE url=
         'http://localhost:8090/long.html';` → title 길이가 ≤200인지
         확인. rune-truncate가 마지막 글자를 안전하게 자르는지(멀티
         바이트 글자 보존) 한국어 케이스(예: 한글 한 글자가 200번째에
         걸치는 경우) 한 번 더 검증.
      7. 회귀: 정상(50자) title 페이지를 같은 절차로 처리 → Pin 정상
         생성, title이 입력값과 동일한지 확인.
      8. ScriptAdapter 경로도 동일 패턴이 있는지 short script 한
         site에 등록해 동일 절차 1회 더 수행.
    impact: 4
    confidence: 4
    effort: 1
    risk: 1
    score: 16.0
    status: done
    note: |
      Discovery 모드 발굴 — 영역: 정합성(ERD/DB schema ↔ Go 코드).
      Processing 모드 진입 시 첫 단계는 (a) `harvester_consumer.go:382`
      바로 뒤에 `doc.Title = truncateRunes(doc.Title, 200)` 한 줄을
      대칭으로 추가, (b) `pin_document.go:37-48`의 PinDocument doc
      comment에 Title도 truncate 책임 명시, (c) harvester/spec.md에
      "Pin upsert 전 title은 DB cap(200 runes)에 맞춰 rune-safe
      truncate된다"를 ADDED Scenario로 추가. ScriptAdapter 경로도
      동일 truncate 적용(consumer level 단일 지점으로도 충분 — Script
      → consumer → pipeline 순서이므로 consumer가 단일 진입점).
    resolution: |
      PR #50 (2026-05-19 squash-merge). `harvester_consumer.processOne`에
      `doc.BodyText` 절단 직후 `doc.Title = truncateRunes(doc.Title, 200)`
      한 줄을 대칭으로 추가. `truncateRunes` doc-comment를 BodyText/Title
      양쪽 명시로 확장. `pin_document.go`의 PinDocument doc-comment에
      Title도 raw text 보장 + Harvester truncate 책임 한 줄 추가
      (BodyText 줄과 대칭). 신규 테스트 `TestTruncateRunes_TitleCap`
      5 subtest (ASCII 201→200/한국어 201→200/100자 무손실/empty/
      boundary 200) 통과. `openspec/specs/harvester/spec.md`에 ADDED
      Requirement "title은 pins.title 컬럼 cap에 맞춰 rune-safe 사전
      절단된다" + 4 Scenarios. 실 환경 QA (PostgreSQL 16.13): ASCII
      201자 INSERT는 `value too long for type character varying(200)`
      에러로 거부(버그 재현), 200자 accept, 한국어 200 rune(600 byte)
      accept, 한국어 201 rune reject로 fix 양상과 multibyte 안전성
      모두 확인. OpenSpec change는 `archive/2026-05-19-fix-harvest-
      pipeline-title-truncate/`로 이동.

  - id: system-20260519-pin-create-handler-no-input-length-validation
    title: "POST /api/pins 핸들러가 title/description/url/og_image 사용자 입력 길이를 사전 검증하지 않아 VARCHAR cap 초과 시 PostgreSQL value-too-long → 500 Internal Server Error (의도된 400 Bad Request 우회)"
    area: integrity
    evidence:
      files:
        - "apps/api/internal/pin/handler.go:92-96"        # title trim + empty check만, length check 부재
        - "apps/api/internal/pin/handler.go:286-289"      # description: FormValue 후 trim만, length check 부재
        - "apps/api/internal/pin/handler.go:291-294"      # url: FormValue 후 trim만, length check 부재
        - "apps/api/internal/pin/handler.go:296-299"      # og_image: FormValue 후 trim만, length check 부재
        - "apps/api/internal/pin/handler.go:312-325"      # CreatePin INSERT → 길이 오류 시 L321-324가 500 응답
        - "apps/api/db/migrations/000003_create_works.up.sql:5"  # title VARCHAR(200) NOT NULL
        - "apps/api/db/migrations/000003_create_works.up.sql:6"  # description VARCHAR(500)
        - "apps/api/db/migrations/000003_create_works.up.sql:4"  # url VARCHAR(1000) NOT NULL
        - "apps/api/db/migrations/000003_create_works.up.sql:9"  # og_image VARCHAR(1000)
      cite: |
        (a) 직접 인용 가능한 OpenSpec SHALL은 부재하나, 동일 저장소 내부의
            기존 합의된 패턴이 명확히 존재:
            - `apps/api/internal/creator/handler.go:178-185`이
              `if nickname == "" { 400 } if utf8.RuneCountInString(nickname) > 50 { 400 "닉네임은 50자를 초과할 수 없습니다" }`로
              nickname VARCHAR(50)에 대해 사전 길이 검증.
            - `apps/api/internal/boards/handler.go:106-113` / `:283-290`이
              `if utf8.RuneCountInString(name) > 100 { 400 "보드 이름은 100자 이내여야 합니다" }`로
              boards.name VARCHAR(100)에 대해 사전 길이 검증.
            즉 "사용자 입력 → VARCHAR 컬럼 INSERT 전 RuneCount cap 검증 + 400 응답"이
            프로젝트 내부 합의된 input-validation 패턴이다.
        (b) `apps/api/internal/bot/harvester_consumer.go:380-384`이 bot 경로에서는
            동일 cap에 대해 truncateRunes로 사전 절단. 이는 무인 best-effort
            크롤러용 정책이고, 사용자 직접 입력 경로(pin.Create)는 truncate가 아닌
            reject로 응답해야 사용자가 입력을 수정할 수 있다(2026-05-19 archive
            fix-harvest-pipeline-title-truncate의 design.md D8 "classifier
            sees original untruncated" 대칭 정책의 user-facing 변형).
        (c) `pin.Create`의 handler.go:321-324는 INSERT 오류를 단일 500
            ("핀 등록에 실패했습니다") 분기로 흡수해 client가 길이 초과를
            구분할 방법이 없다. spec: pin `클라이언트 검증 우회 시 서버가 본문을
            거절한다` 의 정신(L77-80 requestBodyCap 적용)이 본 검증에는 미적용된
            비대칭 결함.
        (d) PostgreSQL 16 character varying(N)은 rune-count cap이라
            201 ASCII 또는 201 한국어 rune 모두 `value too long for type
            character varying(200)` 거부 — 2026-05-19 archive
            fix-harvest-pipeline-title-truncate 사이클이 실 환경 QA로
            동일 행동 패턴을 직접 입증.
      repro: |
        1. docker-compose로 api+postgres 기동, 로그인 후 access_token 획득.
        2. 다음 curl 호출:
           ```
           curl -X POST http://localhost:8080/api/pins \
             -H "Authorization: Bearer $TOKEN" \
             -F "title=$(python3 -c 'print("A"*201)')" \
             -F "media=@small.jpg"
           ```
           → API 응답이 500 "핀 등록에 실패했습니다" (의도된 400 Bad Request 부재).
           → 서버 로그에 `pin.Create: insert error: pq: value too long for type
              character varying(200)` 출력.
        3. description=A*501 / url=A*1001 / og_image=A*1001 각각도 동일한 500.
        4. 정상 길이는 정상 생성 (회귀 없음 확인).
        결과: 사용자가 긴 title/description/url을 입력하면(SEO 페이지 자동
        생성 title 복붙, 분석 파라미터가 많은 URL 복붙 등 흔한 케이스) 핀
        등록이 실패하는데 에러 메시지가 일반적이어서 사용자가 무엇을 줄여야
        하는지 알 수 없음. 그리고 5xx 응답이라 클라이언트 retry/sentry alert
        등에서 일시적 장애로 오분류됨.
      attack_surface: |
        - 인증된 모든 호출자가 트리거 가능(보안 사고는 아니나 운영 정상성·
          UX 결함).
        - 5xx 응답이라 모니터링 시스템(Sentry/Datadog/CW alarm)이 일시 장애로
          오분류 → on-call noise. 정상 응답은 400.
        - description/url/og_image 모두 client-supplied form field — 자동화된
          fuzz/긴 입력으로 의도적 500 발생 가능. amplification은 낮음
          (단순 reject)이나 동작 자체가 spec 위반.
    qa_plan: |
      실 환경 QA (Processing 모드 진입 시):
      1. docker-compose로 api+postgres+minio 기동.
      2. 호스트에서 로그인 후 JWT 획득.
      3. fix 전: 위 repro 4 케이스(title=A*201/description=A*501/url=A*1001/
         og_image=A*1001) 각각 호출 → 모두 500 응답 + `value too long for type
         character varying(N)` 서버 로그 확인.
      4. fix 적용 후: 동일 4 케이스 호출 → 400 응답 + 각 필드명시 메시지
         ("제목은 200자 이내여야 합니다" 등) 확인.
      5. 멀티바이트(한국어) 케이스: title=가*201 → 400 (rune count 기준 정확
         검증) 확인. PostgreSQL이 rune-count cap이므로 fix도 utf8.RuneCountInString
         기준으로 일치해야 함.
      6. 회귀: title=200/description=500/url=1000/og_image=1000 (boundary)
         → 정상 201 응답. title=A*100 같은 정상 길이 → 정상 201 응답.
      7. multipart parse 단계(L82 ParseMultipartForm)에서 통과한 form field만
         핸들러가 보므로 본 검증은 multipart body cap(requestBodyCap=500MB)과
         독립적으로 동작 — 본문 크기는 작아도 단일 form field가 길면 cap 초과
         가능 확인.
    impact: 3
    confidence: 5
    effort: 1
    risk: 1
    score: 15.0
    status: done
    note: |
      Discovery 모드 발굴 — 영역: 정합성(사용자 입력 ↔ DB VARCHAR cap).
      2026-05-19 archive fix-harvest-pipeline-title-truncate의 user-facing
      대칭 변형. 단, 정책 차이: bot 경로는 truncate(무인 best-effort),
      user-facing 경로는 reject 400(사용자가 입력 수정 가능). Processing
      모드 진입 시 첫 단계는 (a) pin/handler.go:92 직후에 title length check
