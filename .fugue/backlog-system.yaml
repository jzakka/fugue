        - 영향: k8s 롤링 deploy 시 워커가 SIGTERM 후 즉시 종료 못함 →
          terminationGracePeriodSeconds 안에 정상 종료 실패 → SIGKILL →
          in-flight URL 의 lease 가 10분간 stuck → 워커 재시작 후 같은
          URL 재처리 가능 (lease 만료 후) — 그러나 멱등성 보장이 있어
          데이터 손상은 없음.
        - 더 깊은 영향: tryClaim 의 db.BeginTx(context.Background()) 가
          DB 슬로우 시 ctx 무관하게 무한 대기. 정상 운영 중에도 DB
