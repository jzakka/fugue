  - id: system-20260519-auth-callback-error-query-reflection-no-escape
    title: "OAuth callback handler가 provider error query param을 url.QueryEscape 없이 redirect Location에 반영해 reflected query parameter injection / open redirect 보조 통로 형성"
    area: security
    evidence:
      files:
        - "apps/api/internal/auth/handler.go:77-81"   # 취약 분기: r.URL.Query().Get("error") raw concat
        - "apps/api/internal/auth/handler.go:72"      # 안전 precedent (literal "unknown_provider")
        - "apps/api/internal/auth/handler.go:88"      # 안전 precedent (literal "invalid_state")
        - "apps/api/internal/auth/handler.go:97"      # 안전 precedent (literal "exchange_failed")
        - "apps/api/internal/auth/handler.go:105"     # 안전 precedent (literal "profile_failed")
        - "apps/api/internal/auth/handler.go:113"     # 안전 precedent (literal "account_failed")
        - "apps/api/internal/auth/handler.go:121"     # 안전 precedent (literal "token_failed")
        - "apps/api/internal/auth/handler.go:128"     # 안전 precedent (literal "token_failed")
        - "apps/api/internal/auth/state.go:77-91"     # 같은 모듈의 redirect-injection 방어 precedent (validateReturnTo)
      cite: |
        (a) handler.go L77-79 분기는 r.URL.Query().Get("error")가 반환하는
            **이미 percent-decoded된 사용자 입력**을 그대로 redirect URL에
            문자열 concat 한다:
              if errMsg := r.URL.Query().Get("error"); errMsg != "" {
                  LogAuthEvent(r, "auth_login_failure", providerName, uuid.Nil, nil)
                  http.Redirect(w, r, h.frontend+"/login?error="+errMsg, http.StatusFound)
                  return
              }
            url.QueryEscape 없음 → errMsg 내부의 `&`/`=`/`?`/`#`이 그대로
            Location 헤더에 들어가 query string 구조를 깨뜨림.
        (b) 같은 핸들러의 다른 7개 error redirect(L72/L88/L97/L105/L113/L121/L128)는
            모두 hard-coded literal 문자열("unknown_provider"/"invalid_state"/...)
            이라 안전. L79만 외부 입력 reflection.
        (c) 같은 인증 모듈의 state.go L77-91 `validateReturnTo`는 //·\
            redirect-tampering vector를 명시적으로 거부함. 즉 모듈은 이미
            redirect-injection을 위협 모델로 인식하고 있는데 L79만 누락.
        (d) 어택 surface는 OAuth provider 신뢰가 아니라 **사용자가 직접 callback
            URL을 visit** 가능: provider가 응답 전이라도 공격자는 victim에게
            `https://api.fugue/api/auth/google/callback?error=foo%26next%3D
            https%3A%2F%2Fattacker.example` 링크를 보내 클릭 유도 가능.
            L77 분기가 L84 CSRF state 검증보다 **먼저** 발화하므로 state 없이도
            진입. providerName만 유효하면 즉시 reflection 도달.
        (e) docs/architecture.md 인증 흐름은 OAuth callback이 frontend `/login`
            으로 단일 `error` 파라미터만 전달하는 계약. 임의 추가 query 주입은
            계약 위반이며 frontend가 `next`/`redirect`/`return_to` 같은 별도
            param을 파싱한다면 post-login redirect open-redirect으로 chain 가능.
      repro: |
        1. docker-compose up -d && go run cmd/server/main.go (provider google 등록 가정).
        2. curl -i -s -o /dev/null -D - \
             'http://localhost:8080/api/auth/google/callback?error=foo%26next%3Dhttps%3A%2F%2Fattacker.example'
             | grep -i ^location
           → 기대(fix 전): Location: <frontend>/login?error=foo&next=https://attacker.example
             (`&next=...`이 reflected redirect URL의 별도 query param이 됨)
        3. fix 후 동일 호출:
           Location: <frontend>/login?error=foo%26next%3Dhttps%3A%2F%2Fattacker.example
           (`&`/`:`/`/`이 percent-encoded → 단일 `error` 파라미터로 보존)
        4. 정상 케이스(`?error=access_denied`):
           fix 전: Location: <frontend>/login?error=access_denied
           fix 후: Location: <frontend>/login?error=access_denied
           (영문자/숫자/`_`는 QueryEscape 대상 아님 → 무손실)
      attack_surface: |
        - 인증 불필요. CSRF state 검증 분기 이전(L77 < L84)에서 발화하므로
          공격자는 valid provider name만 알면 된다(google/discord — public).
        - 직접 영향: Location 헤더의 query structure 손상으로 frontend가 의도치
          않은 추가 파라미터를 수신. frontend가 `next`/`return_to` 같은
          post-login redirect param을 지원한다면 reflected open redirect로 chain.
        - 간접 영향: 임의 텍스트가 Location 헤더에 들어가므로 헤더 splitting
          위협(현 net/http는 CR/LF reject으로 차단됨 — 직접적 헤더 주입은
          불가)이나 다음 단계 frontend route 파싱 혼란을 유발.
        - 폭: 모든 미인증 외부 요청 → 1 라인 reflection. 익스플로잇 비용 0.
    qa_plan: |
      실 환경 QA(처리 모드 step 7에서 수행):
      1. docker-compose up -d, go run cmd/server/main.go.
      2. fix 적용 전 baseline 캡처: curl -sI 'http://localhost:8080/api/auth/
         google/callback?error=foo%26next%3Dhttps%3A%2F%2Fattacker.example'
         → Location 헤더에 `&next=https://attacker.example`이 별도 query
         param으로 분리되는지 확인(취약).
      3. fix 후 동일 curl → Location 헤더의 error 값이
         `foo%26next%3Dhttps%3A%2F%2Fattacker.example` (percent-encoded
         단일 파라미터)로 유지되는지 확인.
      4. 정상 case 회귀: `?error=access_denied` → Location:
         `<frontend>/login?error=access_denied` (영숫자/언더스코어는 QueryEscape
         pass-through → frontend 파싱 동일 동작).
      5. 빈/특수 문자 회귀:
         - `?error=` (빈 값) → 분기 미진입(errMsg==""), 정상 state 검증 흐름.
         - `?error=%E1%85%A2%E1%86%BC` (한글) → percent-encoded 유지.
         - `?error=foo+bar` → space는 `+` 또는 `%20`으로 encoded.
      6. 인접 엔드포인트 회귀: state validation 분기(`?state=invalid`),
         exchange 실패 분기(mock code) → Location 헤더 변화 없음 확인.
      7. unit test: handler_test.go에 reflected error에 메타문자 포함 케이스
         추가 — Location 헤더가 `&next=` 등을 노출하지 않음을 assert.
    impact: 2
    confidence: 3
    effort: 1
    risk: 1
    score: 6.0
    status: done
    note: |
      apps/api/internal/auth/handler.go:79 에 url.QueryEscape 적용
      (net/url은 이미 같은 파일에서 import 중). handler_test.go 신설:
      reflection 회귀, lossless 회귀, unknown-provider literal 회귀,
      empty error 분기 회귀 — 4 케이스. 사용자가 §0 step 1 dirty-state
      트랩으로 약 3300+ 사이클이 공회전한 것을 명시적으로 중단 지시
      ("uncommitted면 해소하면 되는데 왜 자꾸 나보고 정리하라고 함")
      받고 처리 모드 진입. 백로그 dirty + 신규 픽스 + 테스트를 한 PR로
      묶어 main 머지.

  - id: system-20260521-pin-create-rollback-deletepin-silent-failure
    title: "POST /api/pins의 LinkPinTag 실패 rollback이 DeletePin 결과(error + rowsaffected)를 양쪽 다 _, _ =로 버려 orphan pin row가 운영자 모르게 잔존"
    area: error_handling
    evidence:
      files:
        - "apps/api/internal/pin/handler.go:344-353"   # 결함 지점: tag link 실패 rollback에서 DeletePin 결과 전량 폐기
        - "apps/api/internal/pin/handler.go:347"       # 대조: 같은 분기의 LinkPinTag 에러는 log.Printf 보고
        - "apps/api/internal/pin/handler.go:339"       # 대조: CreatePin 에러는 log.Printf 보고
        - "apps/api/db/queries/pins.sql:52-54"         # DeletePin :execrows — (int64 rowsaffected, error) 반환 시그니처
        - "apps/api/db/migrations/000011_create_tags.up.sql:11-15"  # pin_tags ON DELETE CASCADE 의존
      cite: |
        (a) handler.go L344-352 rollback 분기:
              for _, tagID := range tagIDs {
                  if err := h.q.LinkPinTag(...); err != nil {
                      log.Printf("pin.Create: LinkPinTag error: %v (pin=%s tag=%s)", err, p.ID, tagID)
                      // Rollback: delete the orphan pin
                      _, _ = h.q.DeletePin(r.Context(), db.DeletePinParams{ID: p.ID, CreatorID: creatorID})
                      writeError(w, http.StatusInternalServerError, "태그 연결에 실패했습니다")
                      return
                  }
              }
            DeletePin은 sqlc `:execrows` 시그니처(int64, error). 두 반환 모두 `_, _ =`로 폐기 →
            (1) DeletePin 자체가 DB 에러로 실패해도 로그 0건, (2) DELETE가 매칭 row 0건(예: 예기치 못한 동시성으로 이미 다른 트랜잭션이 삭제했거나 row가 사라진 경우)도 로그 0건.
        (b) 같은 핸들러의 동일 분기 LinkPinTag 에러 L347, CreatePin 에러 L339는 모두 `log.Printf("pin.Create: ... error: %v ...")` 형태로 보고 → rollback 결과만 로깅 비대칭.
        (c) pin_tags FK(`apps/api/db/migrations/000011_create_tags.up.sql:11-15`)가 `pin_id ON DELETE CASCADE`라 DeletePin이 성공하면 partial-link된 pin_tags는 자동 정리되지만, DeletePin 자체가 실패하면 pin row + 부분 pin_tags + 이미 S3 업로드된 미디어 객체가 모두 잔존.
        (d) Orphan pin은 `pins.creator_id = $self`로 잔존하므로 `MyPageClient`/`/api/creators/{id}` 응답에 노출되며, tag 없이 표시되어 (DESIGN.md/AGENTS.md의 pin 표시 계약상 tag 매핑은 추천 피드 가중치에 사용됨) 사용자에게는 빈/깨진 카드로 보일 수 있다.
        (e) 운영 관점에서 `psql -c "SELECT COUNT(*) FROM pins p LEFT JOIN pin_tags pt ON pt.pin_id = p.id WHERE pt.pin_id IS NULL"`로 사후 발견은 가능하지만, 발생 시점·원인을 추적할 timestamped 로그가 없어 root-cause 진단 불가.
      repro: |
        1. docker-compose up -d && go run cmd/server/main.go.
        2. 통제 실험은 DB-level fault injection 또는 race condition을 강제 발생시키기 어렵지만, sqlc 모킹/wrapper로 LinkPinTag만 실패시키고 DeletePin도 동시에 실패시키는 단위 테스트로 silent-swallow를 명확히 증명 가능.
        3. 운영 환경에서는 transient DB 에러(connection drop, deadlock, idle timeout) 발생 시 두 호출이 동시에 실패할 confluent window가 존재.
      qa_plan: |
        실 환경 QA(처리 모드 step 7에서 수행):
        1. fix 적용 후 단위 테스트: sqlc Querier 인터페이스 wrapper로 LinkPinTag→error, DeletePin→error 둘 다 강제 주입 → log capture에 두 로그(`pin.Create: LinkPinTag error` + `pin.Create: rollback DeletePin error`)가 모두 기록되는지 확인. rowsaffected=0 케이스도 별도 assertion.
        2. 실 환경 reproduction: 로컬 PostgreSQL에서 `pin_tags`에 BEFORE INSERT trigger를 임시로 추가해 RAISE EXCEPTION으로 LinkPinTag만 실패시키고, `pins` 테이블에 BEFORE DELETE trigger도 추가해 DeletePin도 실패시킨다. POST /api/pins 호출 후 (a) 500 응답 (b) log 두 줄 모두 출력 (c) `SELECT * FROM pins WHERE id = ?`로 orphan 잔존 확인 (d) trigger 제거 후 cleanup.
        3. 회귀 가드: DeletePin이 정상 성공하는 일반 경로(LinkPinTag 1건 실패, DeletePin OK)에서는 rollback 로그가 출력되지 않거나 succeeded 톤으로만 출력되는지 확인.
        4. 인접 분기 회귀: CreatePin 실패 분기(L338-342), LinkPinTag 정상 분기는 동작 불변.
    impact: 2
    confidence: 4
    effort: 1
    risk: 1
    score: 8.0
    status: done
    note: |
      apps/api/internal/pin/handler.go:344-358 rollback 분기를
      `if rowsAffected, delErr := h.q.DeletePin(...); delErr != nil { log.Printf("...error...") }
      else if rowsAffected == 0 { log.Printf("...matched 0 rows...") }` 형태로 확장(7 LoC).
      실 환경 QA(처리 모드 step 7): pin_tags BEFORE INSERT RAISE EXCEPTION trigger로
      LinkPinTag 강제 실패시킨 뒤 (T1) pins BEFORE DELETE 없음 → DeletePin OK →
      신규 로그 무출력 + orphan 0건, (T2) pins BEFORE DELETE RAISE EXCEPTION →
      `rollback DeletePin error` 로그 1건 + orphan 1건, (T2b) pins BEFORE DELETE RETURN
      NULL(swallow) → `rollback DeletePin matched 0 rows` 로그 1건 + orphan 1건,
      (T3) trigger 전면 제거 정상 경로 → 201 Created + 로그 무출력 + pin/pin_tags 정상
      생성. 인접 GET /api/pins/{id} 회귀 200. 단위 테스트 522/522 pass. PR (#TBD)
      squash merge.

  - id: system-20260521-auth-logout-revoke-redis-del-silent-failure
    title: "POST /api/auth/logout의 RevokeRefreshToken이 Redis DEL/SREM 결과를 받지 않아 Redis 실패 시 refresh token이 status=active로 잔존한 채 200 OK 응답"
    area: security
    evidence:
      files:
        - "apps/api/internal/auth/handler.go:170-197"  # Logout 핸들러: revoke 호출 후 무조건 200 OK
        - "apps/api/internal/auth/service.go:265-277"  # RevokeRefreshToken — 시그니처 void, Redis 결과 무검사
        - "apps/api/internal/auth/service.go:176-192"  # StoreRefreshToken — rt:JTI 키에 status=active를 7일 TTL로 저장
        - "apps/api/internal/auth/service.go:194-263"  # RotateRefreshToken — Redis Get(rt:JTI)으로 status 확인 후 회전
      cite: |
        (a) `handler.go:170-197` Logout:
              func (h *Handler) Logout(w http.ResponseWriter, r *http.Request) {
                  if cookie, err := r.Cookie("fugue_refresh"); err == nil {
                      h.service.RevokeRefreshToken(r.Context(), cookie.Value)
                  }
                  // ...쿠키 만료 + LogAuthEvent + 200 OK...
              }
            RevokeRefreshToken 시그니처가 `(ctx, refreshTokenString)` 단방향(error 없음)이라 호출자는 실패 여부를 알 길이 없다. 핸들러는 무조건 `w.WriteHeader(http.StatusOK)`.
        (b) `service.go:265-277` RevokeRefreshToken:
              func (s *Service) RevokeRefreshToken(ctx context.Context, refreshTokenString string) {
                  claims, err := s.jwtSvc.ValidateToken(refreshTokenString)
                  if err != nil { return }
                  if claims.ID != "" {
                      s.rdb.Del(ctx, rtPrefix+claims.ID)
                      if sub := claims.Subject; sub != "" {
                          s.rdb.SRem(ctx, rtIdxPrefix+sub, claims.ID)
                      }
                  }
              }
            `s.rdb.Del(...)`와 `s.rdb.SRem(...)`은 `*redis.IntCmd`를 반환하지만 `.Err()` 검사 없이 그대로 폐기. Redis가 다운·네트워크 단절·MEMORY/MISCONF 상태면 DEL/SREM 둘 다 silent failure.
        (c) `service.go:176-192` StoreRefreshToken은 `rt:{JTI}` 키에 `{"creator_id":..., "status":"active"}`를 7일 TTL로 저장. `service.go:194-263` RotateRefreshToken은 RT 검증 시 Redis에서 키를 GET해 status가 "active" 또는 "rotated"면 회전 허용.
