  - id: system-20260521-auth-rotate-refresh-grace-mark-and-index-srem-silent-swallow
    title: "auth.RotateRefreshToken 의 grace mark Set / index SRem 두 호출이 silent-swallow 되어 회전 후 cleanup 실패가 invisible — 동시성 race 시 토큰 sprawl 가능"
    area: security
    evidence:
      files:
        - "apps/api/internal/auth/service.go:196-263"
        - "apps/api/internal/auth/service.go:257"
        - "apps/api/internal/auth/service.go:261"
