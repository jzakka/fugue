  - id: system-20260519-creator-update-avatar-url-no-length-validation
    title: "PUT /api/creators/me 핸들러가 avatar_url 사용자 입력 길이를 사전 검증하지 않아 VARCHAR(500) cap 초과 시 500 Internal Server Error"
    area: integrity
    evidence:
      files:
        - "apps/api/internal/creator/handler.go:187-194"  # avatar_url 처리 — length check 부재
        - "apps/api/internal/creator/handler.go:178-185"  # 같은 핸들러 nickname 검증은 존재
        - "apps/api/internal/creator/handler.go:196-205"  # UpdateCreator INSERT → 500 분기
        - "apps/api/db/migrations/000001_create_creators.up.sql:7"  # avatar_url VARCHAR(500)
      cite: |
        (a) 같은 UpdateMe 핸들러가 nickname에 대해서는 `if nickname == "" { 400 }`
            + `if utf8.RuneCountInString(nickname) > 50 { 400 "닉네임은 50자를
            초과할 수 없습니다" }`로 사전 검증 + clear 400 메시지(L178-185).
            avatar_url에 같은 검증 없음 — 핸들러 내부 inconsistency.
        (b) avatar_url은 통상 S3/CDN URL이며 query string(signed token, cache
            buster, analytics)이 길어지면 500 chars 초과가 발생 가능. spec
            (docs/architecture.md)이나 ERD가 avatar_url 길이 cap을 명시하지
            않아 client는 500 cap을 인지하지 못한다.
        (c) JSON body parse(L157)에는 `http.MaxBytesReader` 미적용 — body size
            cap도 별도 검토 필요하나 본 후보 범위 밖.
      repro: |
        1. docker-compose 기동, JWT 획득.
        2. ```
           curl -X PUT http://localhost:8080/api/creators/me \
             -H "Authorization: Bearer $TOKEN" \
             -H "Content-Type: application/json" \
             -d "{\"avatar_url\":\"https://cdn.example.com/$(python3 -c 'print("A"*500)')\"}"
           ```
           → 응답 500 "프로필 업데이트에 실패했습니다".
           → 서버 로그 `creator.UpdateMe: update error: pq: value too long for
              type character varying(500)`.
        3. 정상 길이(<=500) → 정상 200.
      attack_surface: |
        - 인증된 호출자만 트리거 — 보안 사고 아님. 운영 정상성·UX 결함.
        - S3 signed URL pre-signed expiry token + tracking params 추가로 자연
          발생 가능(악의 없는 사용자도 트리거).
        - 5xx 응답으로 false positive 유발.
    qa_plan: |
      실 환경 QA:
      1. docker-compose 기동, JWT 획득.
      2. fix 전: avatar_url=A*501 → 500 + DB 에러 재현.
      3. fix 적용 후: 동일 호출 → 400 "아바타 URL은 500자 이내여야 합니다"
         형식.
      4. avatar_url=가*167 (한국어 167 rune * 3 byte = 501 byte → 167 rune은
         500 미만이라 정상 통과, 167×3=501 byte여도 PostgreSQL cap은 rune이라
         정상). cap 단위 일치 확인.
      5. 회귀: avatar_url=500 boundary → 정상 200.
      6. avatar_url=null/missing(부분 업데이트) → 기존 값 보존(L188-194 분기).
    impact: 2
    confidence: 5
    effort: 1
    risk: 1
    score: 10.0
    status: done
    resolution: |
      cycle 10 (2026-05-19): apps/api/internal/creator/handler.go UpdateMe의
      `else` 분기(*req.AvatarURL != "")에 `utf8.RuneCountInString > 500 → 400
      "아바타 URL은 500자 이내여야 합니다"` 추가. 빈 문자열 clear semantics와
