  - id: system-20260521-auth-storerefreshtoken-expire-silent-swallow
    title: "auth.StoreRefreshToken 의 Expire 호출이 silent-swallow 되어 rt_index:{sub} set이 TTL=-1로 영구화될 수 있음 — 같은 함수 안의 Set/SAdd `.Err()` 캡처 패턴과 비대칭"
    area: error-handling
    evidence:
      files:
        - "apps/api/internal/auth/service.go:177-193"
        - "apps/api/internal/auth/service.go:191"
        - ".fugue/decision-log.md (2026-05-21 cycle C `RevokeRefreshToken` Del/SRem, cycle F `RotateRefreshToken` grace mark Set/SRem, cycle G `RateLimiter` fail-open — 인접 모든 silent-swallow가 로깅화된 이후의 같은 파일 잔여 비대칭)"
        - "openspec/specs/auth/spec.md (rt index TTL 무명시 — in-codebase consistency 기준)"
      cite: |
        (a) 현재 코드 (service.go:177-193, StoreRefreshToken):
              if err := s.rdb.Set(ctx, key, data, rtTTL).Err(); err != nil {
                  return fmt.Errorf("store refresh token: %w", err)
              }
              idxKey := rtIdxPrefix + creatorID.String()
              if err := s.rdb.SAdd(ctx, idxKey, jti).Err(); err != nil {
                  return fmt.Errorf("add to token index: %w", err)
              }
              s.rdb.Expire(ctx, idxKey, rtTTL)        // L191: silent swallow
              return nil
        Set·SAdd 두 호출은 `.Err()` 으로 잡지만 Expire 만 *redis.BoolCmd 를 폐기.
        (b) 동작 의도: rt_index:{sub} 는 Redis SET 자료형이라 SAdd 만으로는 키 생성 시 default
