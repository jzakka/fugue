        (e) 인접 동일 영역의 다른 silent-swallow(RotateRefreshToken grace mark Set L256, RevokeAllTokens Del L287-289)는 별도 후보로 분리. 본 항목은 Logout 핸들러의 명시적 사용자 액션 한 경로로 한정.
