        - "openspec/specs/auth/spec.md (로깅/observability 무명시 — in-codebase consistency 기준)"
      cite: |
        (a) 현재 코드 (service.go:252-262):
              // Mark old token as rotated with grace period
              rotatedData, _ := json.Marshal(map[string]string{
                  "creator_id": creatorID.String(),
                  "status":     "rotated",
              })
              s.rdb.Set(ctx, key, rotatedData, rtGrace)     // L257: silent swallow

              // Remove old JTI from index
              idxKey := rtIdxPrefix + creatorID.String()
              s.rdb.SRem(ctx, idxKey, jti)                  // L261: silent swallow
        두 호출 모두 `*redis.StatusCmd` / `*redis.IntCmd` 를 반환하지만 `.Err()` 검사 없이 폐기.
        (b) 동작 의도: rotate 직후 old `rt:{JTI}` 키를 status=rotated + 10s grace TTL 로 덮어써,
        같은 윈도우 안의 동시 RotateRefreshToken 호출 (race 또는 client 재시도) 이 status=="rotated"
        분기 (L232-236) 를 거쳐 grace 통과하도록 만든다.
        (c) L257 Set 실패 시 결과:
            - old `rt:{JTI}` 는 status=active 그대로 + 7d TTL 유지.
            - 다음에 같은 RT 로 RotateRefreshToken 호출되면 L237 status != "active" 분기를 빠져나가
              L242 IssueTokenPair 로 또 새 RT 발급 → 같은 old RT 로 무한 회전 가능 (token sprawl).
            - 정상 client 는 이미 새 RT 를 받았으므로 자기 자신은 영향 없음. 그러나 (1) 동시 race,
              (2) 탈취된 RT 가 grace 안에서 reuse 되는 정상 시나리오가 grace 보호 없이 무한 회전으로
              변질 → grace 가 의미하는 "concurrent legitimate retry" semantic 깨짐.
            - 운영자 timestamped 단서 0건.
        (d) L261 SRem 실패 시 결과:
            - old jti 가 `rt_index:{sub}` 에 잔존.
            - RevokeAllTokens (compromise detection, 현재 caller 없음) wiring 시 stale jti 에 대한
              Del 시도가 발생하지만 동작에 무해. 그러나 `rt_index` 가 정확한 active jti 집합이라는
              invariant 깨짐.
        (e) 인접 RevokeRefreshToken (L281-289) 은 cycle C 에서 정확히 같은 패턴으로 `.Err()` capture +
        `log.Printf` 추가됨. RotateRefreshToken 의 grace mark + index SRem 도 같은 in-codebase
        consistency 패턴 적용 대상.
      repro: |
        1. docker-compose up -d && go run cmd/server/main.go.
        2. OAuth 로그인 → /api/auth/refresh 호출 → 정상 회전 → `redis-cli get "rt:{old JTI}"` 결과
           status=rotated, TTL ≈ 10s 확인 (정상 동작).
        3. fail injection (예: Lua DEBUG SLEEP 으로 Get 만 통과시키고 Set 단계에서 ctx deadline 또는
           Redis 일시적 reject 유발) → /api/auth/refresh 호출 → 새 토큰 발급 200/204 + 클라이언트는
           정상이라 인식 + `redis-cli get "rt:{old JTI}"` → status=active 그대로 (TTL 7d) 잔존.
        4. 같은 old RT 로 다시 /api/auth/refresh 호출 → 또 새 RT 발급 → 동일 old RT 로 무한 회전
           반복 가능. 운영 로그 0건.
      qa_plan: |
        실 환경 QA(처리 모드 step 7 에서 수행):
        T1 happy: docker-compose Redis 정상 → /api/auth/refresh 호출 → 204 + 새 Set-Cookie +
          `redis-cli get "rt:{old JTI}"` status=rotated + TTL ≤ 10s + 신규 로그 무출력.
        T2 grace mark Set 실패: docker compose pause Redis 를 GET 통과시점과 Set 시점 사이로
          유발하기 어려우므로 단위 테스트로 대체 (miniredis 의 SetError() 또는 Set 명령 disable).
          단위 테스트로 Set 실패 강제 → `auth.RotateRefreshToken: grace mark Set error: <err> (jti=<old> sub=<sub>)`
          로그 출력 + 함수 시그니처 / 리턴값 무변경(새 pair 정상 반환).
        T2b SRem 실패: 같은 단위 테스트 패턴으로 SRem 실패 강제 →
          `auth.RotateRefreshToken: index SRem error: <err> (jti=<old> sub=<sub>)` 로그 출력.
        T3 실 환경 race-condition 시뮬레이션: 동일 RT 로 동시 2개 /api/auth/refresh → 하나는
          status=rotated 분기, 다른 하나는 status=active 분기 → grace 보호 동작 + 로그 정상 출력
          확인.
        회귀 가드: /api/auth/logout (cycle C 변경 무영향) / /api/auth/me / OAuth callback 정상 200/302.
        단위 테스트 525+/525+ pass.
