          // omits it; a follow-up refactor may want to propagate cancellation
          // from the worker loop.

        URLScheduler L70-112 의 5 메서드 (DequeueCtx 제외) 모두 ctx 미수신
        signature:
          Enqueue(queueType QueueType, urls ...string) error
          EnqueueHarvester(url string, snapshotKey string) error
          SetStatus(key string, status Status, pinIDs []uuid.UUID) error
          RecordFetchError(key string, errorKind ErrorKind) error
          RecordHarvestError(key string, errorKind ErrorKind) error

        구현부 (apps/api/internal/scheduler/postgres_scheduler.go):
          func (s *PGURLScheduler) Enqueue(queueType QueueType, urls ...string) error {
              ...
              ctx := context.Background()      // L93
              switch queueType { ... }
          }
          func (s *PGURLScheduler) EnqueueHarvester(rawURL string, snapshotKey string) error {
              ...
              ctx := context.Background()      // L130
              return s.queries.UpsertHarvesterWithSnapshot(ctx, ...)
          }
          func (s *PGURLScheduler) SetStatus(key string, status Status, pinIDs []uuid.UUID) error {
              ctx := context.Background()      // L346
              ...
              case StatusHarvested:
                  return s.setStatusHarvested(ctx, key, hash, pinIDs)  // BeginTx(ctx,nil) 도 ctx 동일
              ...
