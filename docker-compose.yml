services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fugue
      POSTGRES_PASSWORD: fugue
      POSTGRES_DB: fugue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fugue
      MINIO_ROOT_PASSWORD: fuguedev123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 fugue fuguedev123;
      mc mb local/fugue-media --ignore-existing;
      mc anonymous set download local/fugue-media;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
