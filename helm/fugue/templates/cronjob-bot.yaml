apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "fugue.fullname" . }}-bot
  labels:
    {{- include "fugue.labels" . | nindent 4 }}
    app.kubernetes.io/component: bot
spec:
  schedule: "0 */24 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "fugue.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: bot
        spec:
          restartPolicy: Never
          containers:
            - name: fuguebot
              image: "{{ .Values.bot.image.repository }}:{{ .Values.bot.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.bot.image.pullPolicy | default "IfNotPresent" }}
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "fugue.fullname" . }}-secrets
                      key: database-url
                - name: S3_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "fugue.fullname" . }}-config
                      key: s3-endpoint
                - name: S3_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "fugue.fullname" . }}-config
                      key: s3-region
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "fugue.fullname" . }}-config
                      key: s3-bucket
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "fugue.fullname" . }}-secrets
                      key: s3-access-key
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "fugue.fullname" . }}-secrets
                      key: s3-secret-key
                - name: S3_PUBLIC_URL
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "fugue.fullname" . }}-config
                      key: s3-public-url
                # pioneer-snapshot-storage feature toggle. Default off
                # (matches application default). Operators flip to "true"
                # only after the snapshots/ prefix and 365d lifecycle rule
                # are in place. Optional: omit to inherit Pioneer's default.
                - name: PIONEER_SNAPSHOT_ENABLED
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "fugue.fullname" . }}-config
                      key: pioneer-snapshot-enabled
                      optional: true
                # Optional override: defaults to S3_BUCKET when empty.
                - name: PIONEER_SNAPSHOT_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "fugue.fullname" . }}-config
                      key: pioneer-snapshot-bucket
                      optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
