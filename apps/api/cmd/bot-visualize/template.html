<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fugue Bot Graph Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }

        #graph-container {
            width: 100vw;
            height: 100vh;
        }

        #stats-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            min-width: 250px;
            z-index: 1000;
        }

        #stats-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #fff;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .stat-label {
            color: #999;
        }

        .stat-value {
            color: #fff;
            font-weight: 600;
        }

        .site-list {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .site-list h3 {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .site-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .site-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .site-item.active {
            background: rgba(255, 255, 255, 0.1);
        }

        .site-item input[type="radio"] {
            margin-right: 8px;
            accent-color: #3b82f6;
        }

        .site-name {
            font-weight: 600;
            color: #fff;
            margin-right: 8px;
        }

        .site-domain {
            color: #666;
            font-size: 12px;
        }

        #legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            z-index: 1000;
        }

        #legend h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #fff;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
            font-size: 12px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .legend-line {
            width: 20px;
            height: 2px;
            margin-right: 8px;
        }

        .node {
            cursor: pointer;
            stroke-width: 2px;
        }

        .link {
            stroke: #555;
            stroke-opacity: 0.6;
            stroke-width: 1.5px;
            fill: none;
        }

        .link-arrow {
            fill: #555;
        }

        .tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            font-size: 12px;
            pointer-events: none;
            z-index: 2000;
            max-width: 300px;
            display: none;
        }

        .tooltip-url {
            color: #60a5fa;
            word-break: break-all;
            margin-bottom: 5px;
        }

        .tooltip-type {
            color: #fbbf24;
        }

        .tooltip-status {
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid #444;
        }

        @media (max-width: 600px) {
            #stats-panel {
                top: 10px;
                right: 10px;
                min-width: 0;
                padding: 10px;
                font-size: 12px;
                max-width: 160px;
            }
            #stats-panel h2 {
                font-size: 14px;
                margin-bottom: 8px;
            }
            #legend {
                bottom: 10px;
                left: 10px;
                padding: 8px;
                font-size: 10px;
                max-width: 150px;
            }
            #legend h3 {
                font-size: 11px;
            }
            .legend-color {
                width: 12px;
                height: 12px;
            }
        }

        .hint-text {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #555;
            font-size: 12px;
            z-index: 999;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>
    <div id="graph-container"></div>

    <div id="stats-panel">
        <h2>Graph Statistics</h2>
        <div class="stat-row">
            <span class="stat-label">Nodes:</span>
            <span class="stat-value" id="stat-nodes">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Edges:</span>
            <span class="stat-value" id="stat-edges">0</span>
        </div>
        <div class="site-list" id="site-list">
            <h3>Sites</h3>
        </div>
    </div>

    <div id="legend">
        <h3>Legend — Node Type</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #3b82f6; border: 2px solid #2563eb;"></div>
            <span>List</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #10b981; border: 2px solid #059669;"></div>
            <span>Detail</span>
        </div>
        <h3 style="margin-top: 10px;">Script Status</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #3b82f6; border: 2px solid #fff;"></div>
            <span>Implemented (bright stroke)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #3b82f6; border: 2px solid #333;"></div>
            <span>Missing (dark stroke)</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: #555;"></div>
            <span>Edge (link)</span>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>
    <div class="hint-text" id="hint">Scroll to zoom · Drag to pan</div>

    <script>
        const graphData = {{.GraphDataJSON}};

        if (!graphData || graphData.nodes.length === 0) {
            document.body.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 24px; color: #666;">No nodes found in database</div>';
        } else {
            initApp(graphData);
        }

        function normalizeNodeType(nt) {
            if (nt === 'listing' || nt === 'gallery' || nt === 'category') return 'list';
            return nt;
        }

        function stripTLD(domain) {
            const parts = domain.split('.');
            if (parts.length >= 2) return parts.slice(0, -1).join('.');
            return domain;
        }

        function initApp(data) {
            const siteMap = {};
            data.sites.forEach(site => { siteMap[site.id] = site; });

            // Build site list UI
            const siteListEl = document.getElementById('site-list');
            data.sites.forEach((site, i) => {
                const label = document.createElement('label');
                label.className = 'site-item' + (i === 0 ? ' active' : '');
                label.innerHTML = `<input type="radio" name="site" value="${site.id}" ${i === 0 ? 'checked' : ''}>` +
                    `<span class="site-name">${stripTLD(site.domain)}</span>` +
                    `<span class="site-domain">${site.domain}</span>`;
                label.addEventListener('click', () => {
                    document.querySelectorAll('.site-item').forEach(el => el.classList.remove('active'));
                    label.classList.add('active');
                    selectSite(site.id);
                });
                siteListEl.appendChild(label);
            });

            // Node type color map — treats old DB values (listing/gallery/category) as list
            const typeColors = {
                list:   '#3b82f6',
                detail: '#10b981',
            };
            const defaultColor = '#6b7280';

            function getNodeColor(d) {
                return typeColors[normalizeNodeType(d.node_type)] || defaultColor;
            }

            // Setup SVG
            let width = window.innerWidth;
            let height = window.innerHeight;

            const svg = d3.select('#graph-container')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            window.addEventListener('resize', () => {
                width = window.innerWidth;
                height = window.innerHeight;
                svg.attr('width', width).attr('height', height);
            });

            const g = svg.append('g');
            const hint = document.getElementById('hint');
            let hintVisible = true;
            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                    if (hintVisible) {
                        hint.style.opacity = '0';
                        hintVisible = false;
                    }
                });
            svg.call(zoom);

            // Arrow marker
            svg.append('defs').append('marker')
                .attr('id', 'arrow')
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 20)
                .attr('refY', 0)
                .attr('markerWidth', 6)
                .attr('markerHeight', 6)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .attr('class', 'link-arrow');

            const linkGroup = g.append('g');
            const nodeGroup = g.append('g');
            const tooltip = d3.select('#tooltip');

            let simulation = null;

            function selectSite(siteId) {
                // Filter nodes/edges for selected site
                const filteredNodes = data.nodes.filter(n => n.site_id === siteId);
                const nodeIds = new Set(filteredNodes.map(n => n.id));
                const filteredEdges = data.edges.filter(e =>
                    nodeIds.has(e.source?.id || e.source) && nodeIds.has(e.target?.id || e.target)
                );

                // Reset D3 link references to raw IDs (D3 mutates source/target to objects)
                const edges = filteredEdges.map(e => ({
                    ...e,
                    source: e.source?.id || e.source,
                    target: e.target?.id || e.target,
                }));

                // Update stats
                document.getElementById('stat-nodes').textContent = filteredNodes.length;
                document.getElementById('stat-edges').textContent = edges.length;

                // Update links
                const link = linkGroup.selectAll('path')
                    .data(edges, d => d.id);
                link.exit().remove();
                const linkEnter = link.enter().append('path')
                    .attr('class', 'link')
                    .attr('marker-end', 'url(#arrow)');
                const linkMerged = linkEnter.merge(link);

                // Update nodes
                const node = nodeGroup.selectAll('circle')
                    .data(filteredNodes, d => d.id);
                node.exit().remove();
                const nodeEnter = node.enter().append('circle')
                    .attr('class', 'node')
                    .attr('r', 8)
                    .call(d3.drag()
                        .on('start', dragstarted)
                        .on('drag', dragged)
                        .on('end', dragended));
                const nodeMerged = nodeEnter.merge(node);

                nodeMerged
                    .attr('fill', d => getNodeColor(d))
                    .attr('stroke', d => d.has_script ? '#fff' : '#333');

                // Tooltip
                nodeMerged.on('mouseover', (event, d) => {
                    const site = siteMap[d.site_id];
                    const sampleLine = d.sample_url ? `<div class="tooltip-url" style="color:#86efac;">Sample: ${d.sample_url}</div>` : '';
                    tooltip.style('display', 'block')
                        .html(`
                            <div class="tooltip-url">Pattern: ${d.url}</div>
                            ${sampleLine}
                            <div class="tooltip-type">Type: ${normalizeNodeType(d.node_type) || 'unknown'}</div>
                            <div>Site: ${site ? site.domain : 'unknown'}</div>
                            <div class="tooltip-status">Script: ${d.has_script ? 'Implemented' : 'Missing'}</div>
                        `);
                })
                .on('mousemove', (event) => {
                    tooltip.style('left', (event.pageX + 15) + 'px')
                        .style('top', (event.pageY + 15) + 'px');
                })
                .on('mouseout', () => {
                    tooltip.style('display', 'none');
                });

                // Restart simulation
                if (simulation) simulation.stop();
                simulation = d3.forceSimulation(filteredNodes)
                    .force('link', d3.forceLink(edges)
                        .id(d => d.id)
                        .distance(60))
                    .force('charge', d3.forceManyBody().strength(-150))
                    .force('center', d3.forceCenter(width / 2, height / 2))
                    .force('collision', d3.forceCollide().radius(15))
                    .on('tick', () => {
                        linkMerged.attr('d', d => {
                            if (!d.source || !d.target) return '';
                            return `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`;
                        });
                        nodeMerged.attr('cx', d => d.x).attr('cy', d => d.y);
                    })
                    .on('end', () => {
                        const padding = 60;
                        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                        filteredNodes.forEach(d => {
                            if (d.x < minX) minX = d.x;
                            if (d.y < minY) minY = d.y;
                            if (d.x > maxX) maxX = d.x;
                            if (d.y > maxY) maxY = d.y;
                        });
                        const gw = maxX - minX;
                        const gh = maxY - minY;
                        if (gw === 0 || gh === 0) return;
                        const scale = Math.min((width - padding * 2) / gw, (height - padding * 2) / gh, 1.5);
                        const cx = (minX + maxX) / 2;
                        const cy = (minY + maxY) / 2;
                        const transform = d3.zoomIdentity
                            .translate(width / 2, height / 2)
                            .scale(scale)
                            .translate(-cx, -cy);
                        svg.transition().duration(750).call(zoom.transform, transform);
                    });

                function dragstarted(event, d) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                }

                function dragged(event, d) {
                    d.fx = event.x;
                    d.fy = event.y;
                }

                function dragended(event, d) {
                    if (!event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }
            }

            // Auto-select first site
            if (data.sites.length > 0) {
                selectSite(data.sites[0].id);
            }
        }
    </script>
</body>
</html>
